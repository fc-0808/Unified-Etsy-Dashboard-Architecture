name: Safe CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safe-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Windows / Node 22 / Python 3.12
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: route-engine/requirements.txt

      - name: Install Node dependencies from lockfile
        run: npm ci

      - name: Install route-engine dependencies
        run: python -m pip install -r route-engine/requirements.txt

      - name: Validate Python environment
        run: python -m pip check

      - name: Audit dependency advisories
        run: npm audit --audit-level=high

      - name: Run safe offline and isolated tests
        env:
          ALLOW_LIVE_ETSY_READ_TEST: '0'
        run: npm test
