				{ id: 'huitong',      order: 50, label: { en: 'Huitong',      zh: '汇通'     }, aliases: ['汇通'] },
				// The charm market — bare codes, no prefix to parse; reached only via
				// the charm re-home below (charmLoc), which is why it has no aliases.
				// Last, because the charm leg is walked after the cases and grips.
				{ id: 'longsheng',    order: 60, label: { en: 'Longsheng',    zh: '龙胜'     }, aliases: [] },
			]
			const UNREGISTERED_ORDER = 9000
			const UNLOCATED_ORDER = 9999
			const UNKNOWN_FLOOR = 999
			const PLACEHOLDER_CODES = new Set(['-', '???'])
			const ALIAS_INDEX = BUILDINGS.flatMap((b) => b.aliases.map((alias) => ({ alias, upper: alias.toUpperCase(), building: b }))).sort(
				(a, b) => b.alias.length - a.alias.length,
			)
			const BUILDING_BY_ID = new Map(BUILDINGS.map((b) => [b.id, b]))
			const normalizeStall = (stall) =>
				String(stall == null ? '' : stall)
					.normalize('NFKC')
					.replace(/[–—―]/g, '-')
					.trim()
			function floorFromCode(code) {
				if (!code) return UNKNOWN_FLOOR
				if (/^A2/i.test(code)) return 2
				let m = /^(\d)/.exec(code)
				if (m) return Number(m[1])
				m = /(\d)[A-Za-z]/.exec(code)
				if (m) return Number(m[1])
				return UNKNOWN_FLOOR
			}
			function locatedAt(building, order, code, raw, registered) {
				return {
					buildingId: building.id,
					buildingOrder: order,
					buildingLabel: building.label,
					isHome: building.id === HOME_BUILDING_ID,
					registered,
					located: true,
					code,
					floor: floorFromCode(code),
					raw,
				}
			}
			function parseStall(stall) {
				const raw = normalizeStall(stall)
				if (!raw || PLACEHOLDER_CODES.has(raw)) {
					return {
						buildingId: '',
						buildingOrder: UNLOCATED_ORDER,
						buildingLabel: { en: '', zh: '' },
						isHome: false,
						registered: false,
						located: false,
						code: '',
						floor: UNKNOWN_FLOOR,
						raw,
					}
				}
				const hit = ALIAS_INDEX.find((a) => raw.slice(0, a.alias.length).toUpperCase() === a.upper)
				if (hit) return locatedAt(hit.building, hit.building.order, raw.slice(hit.alias.length).trim(), raw, true)
				// A leading run of non-ASCII is a market we haven't registered yet: give
				// it a stop of its own rather than filing it under the home market.
				const foreign = /^([^\x00-\x7F]+)/.exec(raw)
				if (foreign) {
					const name = foreign[1].trim()
					return locatedAt({ id: 'x:' + name, label: { en: name, zh: name } }, UNREGISTERED_ORDER, raw.slice(foreign[1].length).trim(), raw, false)
				}
				const home = BUILDING_BY_ID.get(HOME_BUILDING_ID)
				return locatedAt(home, home.order, raw, raw, true)
			}
			const stallFloor = (stall) => parseStall(stall).floor
			const floorSortValue = (floor) => (floor != null && floor !== UNKNOWN_FLOOR && floor !== '' ? Number(floor) : 9999)
			// The order the route is walked: building → floor → stall → shop. Compared
			// with plain < / > (code-unit order) so Chinese shop names sequence the same
			// here, on the desktop table and in the Excel export.
			function locationSortKey(stall, shop) {
				const loc = parseStall(stall)
				return [
					String(loc.buildingOrder).padStart(4, '0'),
					loc.buildingId,
					String(floorSortValue(loc.floor)).padStart(4, '0'),
					loc.code.toLowerCase(),
					String(shop == null ? '' : shop).trim().toLowerCase(),
				].join('\x00')
			}
			// ══ END STALL LOCATION ══

			// Market name in the shopper's language. An unlocated stop has no market,
			// so it reads as "other" rather than as an empty chip.
			const buildingLabel = (loc) => (LANG === 'zh' ? loc.buildingLabel.zh : loc.buildingLabel.en) || t('otherFloor')

			// Where a CHARM is shopped. Charms are bought in their own market (龙胜),
			// whose stalls are recorded with bare codes exactly like the home
			// case/grip market — so a bare charm code, which parses as the home
			// market, is re-homed to 龙胜 (floor and code untouched). A charm stall
			// that explicitly names another market keeps it. A charm sold at a stall
			// already on the case/grip route is merged into that supplier's stop
			// upstream and never reaches here, so it correctly keeps the supplier's
			// market — the one exception the shopper asked for.
			// ══ CHARM LOCATION ══
			const CHARM_HOME_BUILDING_ID = 'longsheng'
			function charmLoc(stall) {
				const loc = parseStall(stall)
				if (!loc.isHome) return loc
				const b = BUILDING_BY_ID.get(CHARM_HOME_BUILDING_ID)
				return { ...loc, buildingId: b.id, buildingOrder: b.order, buildingLabel: b.label, isHome: false }
			}
			// ══ END CHARM LOCATION ══
			// Stop identity for a line, matching the list's grouping exactly so counts
			// line up with what the shopper sees. Case/grip stops key by supplier
			// location; charm stops key by charm stall. Unmatched → a single bucket.
			const supKeyOf = (r) => {
				const shop = (r.supplier_shop || '').trim()
				const stall = (r.supplier_stall || '').trim()
				return shop || stall ? locationSortKey(stall, shop) : '\uffff'
			}
			const charmKeyOf = (r) => {
				const shop = (r.charm_shop || '').trim()
				return shop ? shop.toLowerCase() : '\uffff'
			}

			// ── Charms sold at a stall we already visit ──────────────────────────
			// A sourced charm normally has its own stop in the Charms section. But some
			// charm stalls ARE case/grip suppliers (one merchant sells both), and making
			// the shopper walk back to a stall they already stood at is wasted time. So a
			// charm whose stall is a stop already on the Cases & Grips route is shopped
			// THERE — the same principle as an integral (AirPods) charm, which is bought
			// with its case. The charm keeps its own card (code, photo, price, quantity
			// merged across orders); only the STOP it hangs under changes.
			const shopIdent = (s) => String(s || '').trim().toLowerCase()
			// Case/grip stops of the WHOLE route, indexed by merchant and by stop key.
			// Built from every case/grip line — never the filtered view — so a charm's
			// home stop can't flip just because a case was bought, hidden or searched out.
			// Memoised on the ROWS identity (ROWS is replaced, never mutated in place).
			let _cgStops = { rows: null, idx: null }
			function cgStopIndex() {
				if (_cgStops.rows === ROWS) return _cgStops.idx
				const byKey = new Map() // stop key → { key, shop, stall, floor }
				const byShop = new Map() // merchant → [stop, …]
				for (const r of ROWS) {
					if (!inCgSection(r)) continue
					const id = shopIdent(r.supplier_shop)
					if (!id) continue // no merchant name → nothing to match a charm against
					const key = supKeyOf(r)
					if (byKey.has(key)) continue
					const stop = { key, shop: (r.supplier_shop || '').trim(), stall: (r.supplier_stall || '').trim(), floor: r.supplier_floor }
					byKey.set(key, stop)
					const list = byShop.get(id)
					list ? list.push(stop) : byShop.set(id, [stop])
				}
				const idx = { byKey, byShop }
				_cgStops = { rows: ROWS, idx }
				return idx
			}
			// The case/grip stop key a charm should be shopped at, or null to keep it in
			// the Charms section. Deliberately FAIL-SAFE: merge only when the physical
			// booth is unambiguous — same merchant AND the same stall code (merged-stall
			// aliases included), or the merchant holds exactly one stop and one side has
			// no stall recorded. A merchant with two booths whose charm sits at the other
			// one is never merged: sending a shopper to the wrong counter is worse than a
			// second stop.
			function charmMergeStop(r) {
				if (!inCharmSection(r)) return null
				const stops = cgStopIndex().byShop.get(shopIdent(r.charm_shop))
				if (!stops || !stops.length) return null
				const stall = (r.charm_stall || '').trim()
				if (stall) {
					const same = stops.find((s) => s.stall && stallCodesOverlap(s.stall, stall))
					if (same) return same.key
					// Both sides name a stall, but a different one → a different stop.
					if (stops.some((s) => s.stall)) return null
				}
				return stops.length === 1 ? stops[0].key : null
			}
			// ── Summary + progress ───────────────────────────────────────────────
			function renderSummary() {
				// Swaps never reach ROWS (the server projects them out of the buy list
				// and sends them separately as EXCHANGES), so everything here is real
				// buying work — including buy-shaped model fixes, which arrive already
				// naming the corrected model and look identical to any other purchase.
				const actionable = ROWS.filter((r) => !r.excluded)
				const remaining = actionable.filter((r) => !fullyPurchased(r))
				const done = actionable.length - remaining.length
				const pct = actionable.length ? Math.round((done / actionable.length) * 100) : 0
				$('progressBar').style.width = pct + '%'

				// Component breakdown: how many CASES / GRIPS / CHARMS are still to buy,
				// quantity-weighted so the totals equal the sum of every card's ×N badge
				// (a component counts while it exists on a line and isn't yet Purchased —
				// the exact convention the product cards use). Empty pills are omitted and
				// the whole strip hides (CSS :empty) when nothing of a kind remains.
				let caseN = 0
				let gripN = 0
				let charmN = 0
				for (const r of actionable) {
					const q = r.quantity || 1
					if (r.has_case && (r.status_case || 'Pending') !== 'Purchased') caseN += q
					if (r.has_grip && (r.status_grip || 'Pending') !== 'Purchased') gripN += q
					if (r.has_charm && (r.status_charm || 'Pending') !== 'Purchased') charmN += q
				}
				$('summaryComps').innerHTML =
					(caseN ? `<span class="component-total case">${compLabel(COMP_CASE)} ×${caseN}</span>` : '') +
					(gripN ? `<span class="component-total grip">${compLabel(COMP_GRIP)} ×${gripN}</span>` : '') +
					(charmN ? `<span class="component-total charm">${compLabel(COMP_CHARM)} ×${charmN}</span>` : '')
			}

			// ── Card rendering ───────────────────────────────────────────────────
			function aggregateComponentStatus(rows, component) {
				const relevant = rows.filter((r) => r[component.flag])
				const statuses = relevant.map((r) => r[component.status] || 'Pending')
				if (!statuses.length) return 'Pending'
				if (statuses.every((s) => s === statuses[0])) return statuses[0]
				// Orders of the same model landed on different statuses (e.g. one
				// bought, one out of stock). Surface it as a distinct "mixed" chip
				// so the shopper knows to open it and resolve per order.
				return 'mixed'
			}

			function aggregateCompHtml(rows, comps, aggId) {
				return comps
					.filter((c) => rows.some((r) => r[c.flag]))
					.map((c) => {
						const relevant = rows.filter((r) => r[c.flag])
						const status = aggregateComponentStatus(rows, c)
						const meta = STATUS_META[status] || STATUS_META.Pending
						const qty = relevant.reduce((n, r) => n + (r.quantity || 1), 0)
						return `<button class="comp type-${c.key} ${meta.cls}" data-agg="${aggId}" data-c="${c.key}">
							<span class="cicon">${ICONS[c.key] || ''}</span>
							<div class="ctext"><span class="cl">${compLabel(c)}${qty > 1 ? ` ×${qty}` : ''}</span><span class="cs">${aggStatusHtml(status, relevant, c.status)}</span></div>
						</button>`
					})
					.join('')
			}

			// Price chip: shows the line total (unit × qty), tappable to set/change.
			// `attrs` carries the identity the cost endpoint needs (product title or
			// charm code) so a tap can save it.
			function priceChip(attrs, label, unitCost, qty) {
				const lab = `<span class="pl">${label}</span>`
				// data-qty lets a live cost change patch this chip in place (unit × qty)
				// without re-rendering the whole list.
				const q = qty || 1
				if (unitCost == null || unitCost === '') {
					return `<button class="price unset" ${attrs} data-qty="${q}">${lab}<span class="pvwrap"><span class="pv">${t('setPrice')}</span></span></button>`
				}
				const total = Number(unitCost) * q
				const per = q > 1 ? `<span class="price-per">${money(unitCost)}×${q}</span>` : ''
				return `<button class="price" ${attrs} data-qty="${q}">${lab}<span class="pvwrap"><span class="pv">${money(total)}</span>${per}</span></button>`
			}

			// Product photo thumbnail for a Case/Grip product header.
			function imgHtml(r) {
				return r.image_url
					? `<img class="thumb" loading="lazy" decoding="async" referrerpolicy="no-referrer" src="${esc(r.image_url)}" onerror="this.classList.add('ph');this.removeAttribute('src')" />`
					: `<div class="thumb ph"></div>`
			}

			// One card scoped to a SINGLE component of a product:
			//   • COMP_CASE → a model-specific row (one per phone model; a case must fit).
			//   • COMP_GRIP → the single model-agnostic grip BATCH (all grips for the
			//     product — from Case+Grip combos AND Grip-Only orders — since a grip
			//     fits any phone). The chip opens the per-order sheet for PARTIAL marking
			//     (e.g. 2 bought / 1 out of stock), and the button marks the whole
			//     component bought in one tap. Only this component's status is touched,
			//     so a combo order's case (in its own model row) stays independent.
			function cgComponentCardHtml(rows, comp, aggId) {
				const done = rows.every((r) => (r[comp.status] || 'Pending') === 'Purchased')
				const qty = rows.filter((r) => r[comp.flag]).reduce((n, r) => n + (r.quantity || 1), 0)
				// Shoppers only need the model to buy. Buy-shaped model fixes already
				// rename `phone_model` server-side; the ordered/wrong model is never
				// shown here (exchange UI is for swaps with something in hand only).
				const identity = comp.key === 'case'
					? `<span class="cmodel">${esc(rows[0].phone_model || '—')}</span>`
					: `<span class="cmodel">${esc(compLabel(comp))}</span>`
				const button = done
					? `<button class="markall done compact" data-agg="${aggId}" data-comp="${comp.key}">${t('bought')}</button>`
					: `<button class="markall compact" data-agg="${aggId}" data-comp="${comp.key}">${t('markBought')}</button>`
				return `<div class="card in-product model-group ${done ? 'done' : ''}" data-agg="${aggId}" data-comp="${comp.key}">
					<div class="model-line-head">
						${identity}
						${qty > 1 ? `<span class="cmeta"><span class="tag qty">×${qty}</span></span>` : ''}
					</div>
					<div class="comps">${aggregateCompHtml(rows, [comp], aggId)}</div>
					${button}
				</div>`
			}

			// Distinct positive Etsy listing ids behind a product card. Manual/synthetic
			// order lines have no (or a non-positive) listing id and can't be merged.
			function cardListingIds(lines) {
				const ids = new Set()
				for (const r of lines) {
					const id = Number(r.listing_id)
					if (Number.isInteger(id) && id > 0) ids.add(id)
				}
				return [...ids]
			}

			// The card's "same product" control. Only offered when there is something to
			// act on: another mergeable card at this stall, or an existing merge to undo.
			function mergeBtnHtml(cardId, listingIds, siblingCount) {
				if (!listingIds.length) return ''
				const linked = listingIds.some((id) => MANUAL_MERGE.has(id))
				if (!linked && siblingCount < 1) return ''
				const icon = `<svg viewBox="0 0 24 24"><path d="M9.5 14.5l5-5"/><path d="M13.2 6.6l1.6-1.6a3.7 3.7 0 0 1 5.2 5.2l-1.6 1.6"/><path d="M10.8 17.4l-1.6 1.6a3.7 3.7 0 0 1-5.2-5.2l1.6-1.6"/></svg>`
				return `<button class="pmerge${linked ? ' linked' : ''}" data-pcard="${cardId}">${icon}${t('sameProduct')}</button>`
			}

			// Render a supplier group's Case/Grip cards, unifying multiple orders of
			// the SAME product (same canonical product_key → same physical item on the
			// stall's shelf) into a single product card: the image is shown ONCE, with a
			// row per model to buy.
			function renderCgCards(g) {
				const byProduct = new Map()
				for (const r of g.rows) {
					const k = r.product_key || 't:' + normTitle(r.title)
					if (!byProduct.has(k)) byProduct.set(k, [])
					byProduct.get(k).push(r)
				}
				// Deterministic walk order within a stall: products with items STILL to
				// buy first (so the shopper works top-down), then alphabetical/natural by
				// title. Stable across re-renders, teammates, and reloads.
				const products = [...byProduct.values()].sort((a, b) => {
					const ar = a.some((r) => !cgDone(r)) ? 0 : 1
					const br = b.some((r) => !cgDone(r)) ? 0 : 1
					if (ar !== br) return ar - br
					return String(a[0].title || '').localeCompare(String(b[0].title || ''), undefined, { numeric: true, sensitivity: 'base' })
				})
				// Register this stall's cards up front so each one's merge sheet can list
				// its siblings (they're all candidates — the shopper decides from the
				// photos, which is the only signal that reliably settles it).
				const cardIds = products.map(() => 'p' + PCARD_SEQ++)
				products.forEach((lines, i) => {
					PCARD.set(cardIds[i], { lines, siblings: cardIds.filter((_, j) => j !== i) })
				})
				let html = ''
				for (const [productIdx, lines] of products.entries()) {
					// EVERY product — whether it's one order or many — renders with the
					// SAME anatomy: an image + still-to-buy header, then one card per
					// component (a case row per phone model, and a single model-agnostic
					// grip batch). A one-order product simply has one row. This keeps the
					// list visually consistent so a shopper never has to relearn a layout.
					const r0 = lines[0]
					// Split the product's lines by COMPONENT, because the two shop very
					// differently: a CASE is model-specific (must fit the phone) so it's
					// listed per phone model; a GRIP is universal (fits any phone) so every
					// grip — from Case+Grip combos AND Grip-Only orders — is ONE batch count.
					const caseLines = lines.filter((r) => r.has_case)
					const gripLines = lines.filter((r) => r.has_grip)
					// Integral (AirPods) charms shop here as a product component — like a
					// grip, model-agnostic, at the case supplier — so batch them the same.
					const charmLines = lines.filter(isIntegralCharm)
					const caseNeed = caseLines.filter((r) => (r.status_case || 'Pending') !== 'Purchased').reduce((n, r) => n + (r.quantity || 1), 0)
					const gripNeed = gripLines.filter((r) => (r.status_grip || 'Pending') !== 'Purchased').reduce((n, r) => n + (r.quantity || 1), 0)
					const charmNeed = charmLines.filter((r) => (r.status_charm || 'Pending') !== 'Purchased').reduce((n, r) => n + (r.quantity || 1), 0)
					const caseCost = lines.find((r) => r.cost_case != null)?.cost_case ?? null
					const gripCost = lines.find((r) => r.cost_grip != null)?.cost_grip ?? null
					const sharedPrices = []
					if (caseLines.length) sharedPrices.push(priceChip(`data-kind="product" data-part="case" data-title="${esc(r0.title)}"`, compLabel(COMP_CASE), caseCost, 1))
					if (gripLines.length) sharedPrices.push(priceChip(`data-kind="product" data-part="grip" data-title="${esc(r0.title)}"`, compLabel(COMP_GRIP), gripCost, 1))
					// CASES → one row per phone model (newest → oldest).
					const byModel = new Map()
					for (const line of caseLines) {
						const key = String(line.phone_model || '—').trim()
						if (!byModel.has(key)) byModel.set(key, [])
						byModel.get(key).push(line)
					}
					const caseModelGroups = [...byModel.entries()].sort((a, b) =>
						b[0].localeCompare(a[0], undefined, { numeric: true, sensitivity: 'base' }),
					)
					// Rows: every case model (model shown), then ONE model-agnostic grip
					// batch (no model — a grip fits any phone). A combo order's case sits
					// in its model row and its grip in the batch; the two are marked
					// independently (per-component status).
					const rowsHtml = []
					for (const [, modelRows] of caseModelGroups) {
						const aggId = 'm' + MODEL_AGG_SEQ++
						AGG.set(aggId, modelRows)
						rowsHtml.push(cgComponentCardHtml(modelRows, COMP_CASE, aggId))
					}
					if (gripLines.length) {
						const aggId = 'm' + MODEL_AGG_SEQ++
						AGG.set(aggId, gripLines)
						rowsHtml.push(cgComponentCardHtml(gripLines, COMP_GRIP, aggId))
					}
					// ONE model-agnostic integral-charm batch (AirPods). Rendered after
					// the grip batch so the product reads case → grip → charm.
					if (charmLines.length) {
						const aggId = 'm' + MODEL_AGG_SEQ++
						AGG.set(aggId, charmLines)
						rowsHtml.push(cgComponentCardHtml(charmLines, COMP_CHARM, aggId))
					}
					// Header summary = ONLY the still-to-buy per-component counts
					// (壳 ×N · 支架 ×M). The old "N models ×total" line conflated cases
					// and grips (e.g. "1 model ×2" for a product that is 1 case + 2 grips),
					// which read as if a case count was wrong — so it's gone. The case
					// rows below list the models; the totals give the honest quantities.
					const cardId = cardIds[productIdx]
					const mergeBtn = mergeBtnHtml(cardId, cardListingIds(lines), products.length - 1)
					html += `<div class="product">
						<div class="product-head">
							${imgHtml(r0)}
							<div class="product-meta">
								<div class="component-totals">
									${caseNeed ? `<span class="component-total case">${compLabel(COMP_CASE)}${caseNeed > 1 ? ` ×${caseNeed}` : ''}</span>` : ''}
									${gripNeed ? `<span class="component-total grip">${compLabel(COMP_GRIP)}${gripNeed > 1 ? ` ×${gripNeed}` : ''}</span>` : ''}
									${charmNeed ? `<span class="component-total charm">${compLabel(COMP_CHARM)}${charmNeed > 1 ? ` ×${charmNeed}` : ''}</span>` : ''}
								</div>
								${sharedPrices.length ? `<div class="product-prices">${sharedPrices.join('')}</div>` : ''}
								${mergeBtn}
							</div>
						</div>
						<div class="plines">${rowsHtml.join('')}</div>
					</div>`
				}
				return html
			}

			// Charm card — one card PER charm code (identical charms are merged and
			// show the total quantity to buy). Shows the charm photo, code, and ×qty.
			function charmCardHtml(a) {
				const done = a.done
				const status = aggStatus(a.rows)
				const m = STATUS_META[status] || STATUS_META.Pending
				const img = a.charm_code
					? `<img class="thumb charm-thumb" loading="lazy" decoding="async" src="${charmImageUrl(a.charm_code, a.charm_image_version)}" onerror="this.classList.add('ph');this.removeAttribute('src')" />`
					: `<div class="thumb charm-thumb ph"></div>`
				const orders = a.rows.length
				const btn = done
					? `<button class="markall done" data-agg="${a.aggId}" data-sec="charm">${t('bought')}</button>`
					: `<button class="markall" data-agg="${a.aggId}" data-sec="charm">${t('markBought')}</button>`
				// `charm-card` marks a SOURCED charm card wherever it renders (its own
				// charm stall, or merged into a supplier stop). The live-patch lookup keys
				// on it so it can never be confused with the integral (AirPods) charm chip
				// that renders inside a product card.
				return `<div class="card charm-card ${done ? 'done' : ''}">
					<div class="ctop">
						${img}
						<div class="cinfo">
							<div class="cident">
								<span class="ccharm">${esc(a.charm_code || t('noCharmCode'))}</span>
								<span class="cqty">×${a.qty}</span>
							</div>
							<div class="cmeta"><span class="tag">${ordersN(orders)}</span></div>
						</div>
					</div>
					<div class="comps">
						<button class="comp type-charm ${m.cls}" data-agg="${a.aggId}" data-c="charm">
							<span class="cicon">${ICONS.charm}</span>
							<div class="ctext"><span class="cl">${compLabel(COMP_CHARM)}</span><span class="cs">${aggStatusHtml(status, a.rows, 'status_charm')}</span></div>
						</button>
					</div>
					${a.charm_code ? `<div class="cprice">${priceChip(`data-kind="charm" data-code="${esc(a.charm_code)}"`, compLabel(COMP_CHARM), a.charm_cost, a.qty)}</div>` : ''}
					${btn}
				</div>`
			}

			// Merge charm lines by charm code (empty codes stay separate). Quantity is
			// the sum of the line quantities so one row can say "buy ×N".
			function aggregateCharms(rows) {
				const map = new Map()
				let uniq = 0
				for (const r of rows) {
					const code = (r.charm_code || '').trim()
					const key = code ? code.toLowerCase() : '__none__' + uniq++
					if (!map.has(key)) map.set(key, { charm_code: code, rows: [] })
					map.get(key).rows.push(r)
				}
				const arr = [...map.values()]
				for (const a of arr) {
					a.qty = a.rows.reduce((n, r) => n + (r.quantity || 1), 0)
					a.done = a.rows.every(charmDone)
					a.charm_cost = a.rows[0] ? a.rows[0].charm_cost : null
					a.charm_image_version = a.rows[0] ? a.rows[0].charm_image_version || '' : ''
				}
				arr.sort((a, b) => String(a.charm_code || '~').localeCompare(String(b.charm_code || '~'), undefined, { numeric: true }))
				return arr
			}

			// A merged charm's shown status: Purchased if all bought, else the first
			// actionable status (prefer "to buy").
			function aggStatus(rows) {
				const st = rows.map((r) => r.status_charm || 'Pending')
				if (st.every((s) => s === st[0])) return st[0]
				return 'mixed'
			}

			// Swap card — a wrong-model item to carry back and exchange on this trip.
			// The server only sends SWAPs here: a model fix with nothing in hand is an
			// ordinary purchase and arrives in ROWS instead, on a normal product card
			// showing the corrected model. The buy branch below is kept only so a card
			// cached from an older server build still renders sensibly.
			function exCardHtml(x) {
				const img = x.image_url
					? `<img class="thumb" loading="lazy" decoding="async" referrerpolicy="no-referrer" src="${esc(x.image_url)}" onerror="this.classList.add('ph');this.removeAttribute('src')" />`
					: `<div class="thumb ph"></div>`
				// Name the pieces this swap actually covers. iPhone is case-only
				// (grip/charm stay in hand). AirPods include the attached charm —
				// they ship as one object, so the card must not read as "Case" alone.
				const parts = String(x.components || '')
					.split(',')
					.map((s) => s.trim().toLowerCase())
					.filter(Boolean)
				const showCharm = parts.includes('charm') || (!parts.length && x.charm_integral)
				const showCase = parts.includes('case') || (!parts.length && (x.has_case !== false))
				const showGrip = parts.includes('grip')
				const labels = []
				if (showCase) labels.push(compLabel(COMP_CASE))
				if (showGrip) labels.push(compLabel(COMP_GRIP))
				if (showCharm) labels.push(x.charm_integral ? (LANG === 'zh' ? '挂件（随壳）' : 'attached charm') : compLabel(COMP_CHARM))
				const comps = labels.join(' + ') || compLabel(COMP_CASE)
				const have = (x.have_model || '').trim()
				const swapHtml = have
					? `<div class="exswap">
								<span class="exhave">${esc(have)}</span>
								<span class="exarrow">→</span>
								<span class="exneed">${esc(x.need_model || '?')}</span>
							</div>`
					: `<div class="exswap exbuy">
								
								<span class="exneed">${esc(x.need_model || '?')}</span>
							</div>`
				return `<div class="card ex" data-exid="${x.exchange_id}">
					<div class="ctop">
						${img}
						<div class="cinfo">
							${swapHtml}
							${comps ? `<div class="cmeta"><span class="cstyle">${esc(comps)}</span></div>` : ''}
							${x.note ? `<div class="exnote">${esc(x.note)}</div>` : ''}
						</div>
					</div>
					<button class="markall exbtn" data-exid="${x.exchange_id}">${have ? t('markExchanged') : t('markBought')}</button>
				</div>`
			}

			function markExchanged(exid) {
				const idx = EXCHANGES.findIndex((x) => x.exchange_id === exid)
				if (idx < 0) return
				const x = EXCHANGES[idx]
				EXCHANGES.splice(idx, 1) // optimistic
				const el = document.querySelector('.card.ex[data-exid="' + exid + '"]')
				if (el) removeCardEl(el)
				refreshBadges()
				haptic(10)
				const action = pushUndo({ type: 'exchange', exchange: x })
				showUndoBar((x.have_model || '').trim() ? t('markedExchanged') : t('markedBought'), action)
				fetch('/api/exchanges/' + encodeURIComponent(exid) + '/done', { method: 'POST', credentials: 'same-origin' })
					.then((r) => {
						if (r.status === 401) leaveTo('/login')
						else if (!r.ok) throw new Error('HTTP ' + r.status)
					})
					.catch(() => {
						EXCHANGES.splice(Math.min(idx, EXCHANGES.length), 0, x) // roll back
						render()
					})
			}

			// Charms are shopped at charm stalls, so they group by charm shop/stall.
			// A merchant is still ONE stop (identity stays the shop name, which the
			// completion / celebration paths key off), but the stops are laid out in
			// walking order — market, then floor, then stall — so the charm leg of the
			// trip reads like a route instead of an alphabetical list.
			function groupCharmRows(rows) {
				const groups = new Map()
				for (const r of rows) {
					const shop = (r.charm_shop || '').trim()
					const key = shop ? shop.toLowerCase() : '\uffff'
					if (!groups.has(key)) {
						const stall = (r.charm_stall || '').trim()
						const loc = charmLoc(stall)
						// Sort on the re-homed market so 龙胜 stops group together and any
						// charm at another named market sorts after them, matching the tree.
						const orderKey = shop || stall ? [String(loc.buildingOrder).padStart(4, '0'), loc.buildingId, String(floorSortValue(loc.floor)).padStart(4, '0'), loc.code.toLowerCase(), shop.toLowerCase()].join('\x00') : '\uffff'
						groups.set(key, { loc, shop, stall, sortKey: key, orderKey, rows: [] })
					}
					groups.get(key).rows.push(r)
				}
				return [...groups.values()].sort((a, b) => (a.orderKey < b.orderKey ? -1 : a.orderKey > b.orderKey ? 1 : a.sortKey < b.sortKey ? -1 : a.sortKey > b.sortKey ? 1 : 0))
			}

			function applySearch(rows) {
				if (!searchQ) return rows
				const q = searchQ.toLowerCase()
				return rows.filter((r) =>
					[r.title, r.phone_model, r.style, r.charm_code, r.supplier_shop, r.supplier_stall, r.charm_shop, r.have_model, r.need_model].some((v) =>
						String(v || '').toLowerCase().includes(q),
					),
				)
			}

			function render() {
				renderSummary()
				const box = $('list')
				if (!ROWS.length && !EXCHANGES.length) {
					LAST_GROUPS = []
					box.innerHTML = `<div class="state"><div class="state-title">${t('nothing')}</div></div>`
					maybeRenderTree()
					return
				}

				// Section 1 — Cases & Grips, MERGED with everything else owed at the same
				// stall: exchanges to swap, and charms this merchant sells. A shopper
				// standing at a supplier sees, in one place, everything to BUY and SWAP
				// there — no backtracking to a second section later.
				const merged = new Map()
				// `loc` (market, floor, prefix-free code) is resolved once per stop and
				// read by the header, the building dividers and the drawer tree, so all
				// three can never disagree about where a shopper is being sent.
				const newGroup = (shop, stall) => ({ loc: parseStall(stall), shop, stall, matched: !!(shop || stall), rows: [], exRows: [], charmRows: [] })
				const ensureGroup = (r) => {
					const k = supKeyOf(r)
					if (!merged.has(k)) merged.set(k, newGroup((r.supplier_shop || '').trim(), (r.supplier_stall || '').trim()))
					return merged.get(k)
				}
				let cg = ROWS.filter(inCgSection)
				cg = applySearch(cg.filter((r) => showDone || !cgDone(r)))
				for (const r of cg) ensureGroup(r).rows.push(r)
				for (const x of applySearch(EXCHANGES)) ensureGroup(x).exRows.push(x)

				// Section 2 — Charms. Those sold at a stall this route ALREADY stops at
				// for cases/grips move into that supplier's group above (one stop, one
				// visit); the rest keep their own charm stalls here. Integral (AirPods)
				// charms are excluded entirely — they shop as a component of their case,
				// so they must never appear here as a "no charm code" stray.
				let ch = ROWS.filter(inCharmSection)
				ch = applySearch(ch.filter((r) => showDone || !charmDone(r)))
				const chOwn = []
				for (const r of ch) {
					const stopKey = charmMergeStop(r)
					if (stopKey == null) {
						chOwn.push(r)
						continue
					}
					let g = merged.get(stopKey)
					if (!g) {
						// Every case/grip at this stop is already bought (and hidden), but its
						// charm isn't — keep the stop alive so the shopper still sees the one
						// thing left to buy there, instead of it jumping back to the Charms
						// section mid-trip. Display fields come from the SUPPLIER side so the
						// header reads identically however the stop was created.
						const stop = cgStopIndex().byKey.get(stopKey)
						g = newGroup(stop ? stop.shop : (r.charm_shop || '').trim(), stop ? stop.stall : (r.charm_stall || '').trim())
						merged.set(stopKey, g)
					}
					g.charmRows.push(r)
				}

				const cgGroups = [...merged.keys()]
					.sort((a, b) => (a < b ? -1 : a > b ? 1 : 0))
					.map((k) => {
						const g = merged.get(k)
						return { ...g, section: 'cg', comps: CASE_GRIP, doneFn: cgDone, sortKey: 'cg\x01' + k, charmAggs: g.charmRows.length ? aggregateCharms(g.charmRows) : [] }
					})
				const chGroups = groupCharmRows(chOwn).map((g) => ({ ...g, section: 'charm', comps: CHARM, doneFn: charmDone, sortKey: 'ch\x01' + g.sortKey, aggs: aggregateCharms(g.rows) }))

				// Register every merged charm so its buttons can act on all its lines —
				// both the charms shopped at a supplier stop and those at charm stalls.
				AGG.clear()
				MODEL_AGG_SEQ = 0
				PCARD.clear()
				PCARD_SEQ = 0
				let ac = 0
				for (const g of cgGroups) for (const a of g.charmAggs) { a.aggId = 'a' + ac++; AGG.set(a.aggId, a.rows) }
				for (const g of chGroups) for (const a of g.aggs) { a.aggId = 'a' + ac++; AGG.set(a.aggId, a.rows) }

				LAST_GROUPS = [...cgGroups, ...chGroups]

				if (!cgGroups.length && !chGroups.length) {
					box.innerHTML = `<div class="state"><div class="state-title">${searchQ ? t('noMatches') : t('allBought')}</div></div>`
					maybeRenderTree()
					return
				}

				const prevScroll = shopScrollY()
				box.innerHTML = renderSection(t('secCG'), cgGroups, 0, 'cg') + renderSection(t('secCharm'), chGroups, cgGroups.length, 'charm')
				maybeRenderTree()
				// Keep the shopper's place across a re-render (search/collapse/undo) —
				// no jarring jump.
				if (prevScroll > 0) requestAnimationFrame(() => shopScrollTo(prevScroll))
			}

			// Items still needing action in a group = unbought lines + charms sourced at
			// this same stall + open exchanges. (A charm-stall group carries its charms in
			// `rows`, so `charmRows` is only ever set on a supplier group — no double
			// count, and the two section badges still add up to the same page total.)
			function groupRemaining(g) {
				const buy = g.rows.filter((r) => !g.doneFn(r)).length
				const charms = (g.charmRows || []).filter((r) => !charmDone(r)).length
				return buy + charms + ((g.exRows && g.exRows.length) || 0)
			}
			// Amount still to PAY at this stall (sum of unbought line costs). Exchanges
			// are swaps, not purchases, so they're excluded. anyUnpriced flags that some
			// items don't have a price yet (so the shown total is a partial total).
			function groupSubtotal(g) {
				let sum = 0
				let anyUnpriced = false
				// Live check rather than the aggregate's build-time `done` flag, so a
				// subtotal patched between renders (e.g. after a price edit) can't quote a
				// charm that has since been bought.
				const addCharms = (aggs) => {
					for (const a of aggs || []) {
						if (a.rows.every(charmDone)) continue
						if (a.charm_cost != null) sum += Number(a.charm_cost) * (a.qty || 1)
						else anyUnpriced = true
					}
				}
				if (g.section === 'charm') {
					addCharms(g.aggs)
				} else {
					for (const r of g.rows) {
						if (g.doneFn(r)) continue
						const qty = r.quantity || 1
						if (r.has_case) r.cost_case != null ? (sum += Number(r.cost_case) * qty) : (anyUnpriced = true)
						if (r.has_grip) r.cost_grip != null ? (sum += Number(r.cost_grip) * qty) : (anyUnpriced = true)
					}
					// Charms bought at this same stall are part of what's owed here.
					addCharms(g.charmAggs)
				}
				return { sum: Math.round(sum * 100) / 100, anyUnpriced }
			}
			function gtotalHtml(g) {
				const st = groupSubtotal(g)
				if (st.sum <= 0) return ''
				return `<span class="gtotal">${money(st.sum)}${st.anyUnpriced ? '+' : ''}</span>`
			}

			// ══ ROUTE LIST ══
			// How a market is announced in the route, and how each stall under it
			// says where it is. Both are deliberately uniform: the home market gets
			// no privileged styling and no shorter phrasing, because a shopper should
			// tell one leg from the next by reading its NAME, never by having learnt
			// that one building happens to be drawn differently from the rest.

			// How many items are still owed in the run of consecutive stops that
			// starts at `from` and stays in the same market — i.e. one leg of the trip.
			function buildingLegRemaining(from) {
				const head = LAST_GROUPS[from]
				let items = 0
				for (let i = from; i < LAST_GROUPS.length; i++) {
					const g = LAST_GROUPS[i]
					if (g.section !== head.section || g.loc.buildingId !== head.loc.buildingId) break
					items += groupRemaining(g)
				}
				return items
			}

			// A milestone announcing the market the route has just walked into. Stops
			// are already sorted market-first, so one divider per market is all it
			// takes for a shopper scrolling the list to know which building they are
			// standing in — and how much is left before they can leave it.
			//
			// The name and the count are all it carries. A tally of stalls was noise:
			// it competes with the number that actually decides whether the shopper
			// can leave the building, and it is not a number anyone acts on.
			function buildingDividerHtml(g, from) {
				const items = buildingLegRemaining(from)
				return `<div class="bdiv${g.loc.located ? '' : ' none'}" data-bfrom="${from}">
					<span class="bname">${esc(g.loc.located ? buildingLabel(g.loc) : t('otherFloor'))}</span>
					<span class="bcount${items ? '' : ' done'}">${items || '✓'}</span>
				</div>`
			}

			// A stall header deliberately carries NO market or floor chip. The market
			// is stated once, by the divider that opens its leg of the trip, and the
			// route is walked one market at a time — so on the floor the shopper is
			// already standing in the building the chip would have named. Repeating
			// it above every shop was noise competing with the two things actually
			// used to find the booth: the shop name and the code painted on it.
			// ══ END ROUTE LIST ══

			function renderSection(title, groups, baseIdx, kind) {
				if (!groups.length) return ''
				const remaining = groups.reduce((n, g) => n + groupRemaining(g), 0)
				const badge = remaining ? `<span class="section-count">${remaining}</span>` : `<span class="section-count sdone">✓</span>`
				let prevBuilding = null
				const body = groups
					.map((g, j) => {
						const gidx = baseIdx + j
						const crossed = g.loc.buildingId !== prevBuilding
						prevBuilding = g.loc.buildingId
						return renderGroup(g, gidx, crossed ? buildingDividerHtml(g, gidx) : '')
					})
					.join('')
				return `<div class="section ${kind || ''}"><div class="section-head">${title}${badge}</div>${body}</div>`
			}

			function renderGroup(g, gidx, dividerHtml) {
				const remaining = groupRemaining(g)
				const allDone = remaining === 0
				const collapsed = isCollapsed(g)
				const count = allDone ? `<span class="gcount done">✓</span>` : `<span class="gcount">${remaining}</span>`
				const chev = `<span class="gchev">${collapsed ? '▸' : '▾'}</span>`
				const gtotal = gtotalHtml(g)
				// "Locate on map" — only for supplier stalls we can actually point to.
				const locBtn =
					g.section !== 'charm' && g.matched && g.stall && mapHasStall(g.stall)
						? `<button class="glocate" data-stall="${esc(g.stall)}" title="${t('locate')}" aria-label="${t('locate')}"><svg viewBox="0 0 24 24"><path d="M12 21s7-5.6 7-11a7 7 0 1 0-14 0c0 5.4 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/></svg></button>`
						: ''
				// WeChat prep list — one clean long image per stall for supplier staff.
				const shareBtn = `<button type="button" class="gshare" data-gidx="${gidx}" title="${t('prepShare')}" aria-label="${t('prepShare')}"><svg viewBox="0 0 24 24"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v14"/></svg></button>`
				// The market prefix is dropped from the code — the divider already says
				// which market this is, and "5A40-42" is what's painted on the booth
				// the shopper is looking for.
				const stallText = g.loc.code || g.stall
				let head
				if (g.section === 'charm') {
					head = `<div class="ghead${allDone ? ' gdone' : ''}">
						<span class="shop">${esc(g.shop || t('charmNotSet'))}</span>
						${stallText ? `<span class="stall">${esc(stallText)}</span>` : ''}
						${shareBtn}${gtotal}${count}${chev}
					</div>`
				} else {
					head = g.matched
						? `<div class="ghead${allDone ? ' gdone' : ''}">
							<span class="shop">${esc(g.shop || '—')}</span>
							${stallText ? `<span class="stall">${esc(stallText)}</span>` : ''}
							${locBtn}${shareBtn}${gtotal}${count}${chev}
						</div>`
						: `<div class="ghead${allDone ? ' gdone' : ''}">
							<span class="shop">${t('supplierNotSet')}</span>
							${shareBtn}${gtotal}${count}${chev}
						</div>`
				}
				let body = ''
				if (!collapsed) {
					let cards
					if (g.section === 'charm') {
						cards = g.aggs.map((a) => charmCardHtml(a)).join('')
					} else {
						cards = renderCgCards(g)
						// A divider only earns its keep when there's something ABOVE it to
						// separate from — otherwise it's a stray rule at the top of the group
						// (e.g. a stop whose cases are all bought but whose charm isn't).
						const divider = (cls, label) => (cards ? `<div class="gsublabel${cls ? ' ' + cls : ''}">${label}</div>` : '')
						// Charms this same merchant sells — bought here in the one visit
						// instead of a second trip to the Charms section. Same card as the
						// Charms section uses (code, photo, price, merged quantity).
						if (g.charmAggs && g.charmAggs.length) {
							cards += divider('ch', t('secCharm')) + g.charmAggs.map((a) => charmCardHtml(a)).join('')
						}
						// Exchanges to swap at THIS same stall, under a small divider so the
						// shopper handles buying and swapping in one visit.
						if (g.exRows && g.exRows.length) {
							cards += divider('', t('secEx')) + g.exRows.map((x) => exCardHtml(x)).join('')
						}
					}
					body = `<div class="gbody">${cards}</div>`
				}
				// The divider lives INSIDE the first group of its run, so the two share a
				// lifetime: when that group is emptied out and removed, its divider goes
				// with it instead of being left behind labelling nothing.
				return `<div class="group${collapsed ? ' collapsed' : ''}" data-gidx="${gidx}">${dividerHtml || ''}${head}${body}</div>`
			}

			// A group is collapsed if the user explicitly collapsed it, else it
			// auto-collapses once every (visible) line in it is bought.
			function isCollapsed(g) {
				if (collapseOverride.has(g.sortKey)) return collapseOverride.get(g.sortKey)
				// Auto-collapse only when there's nothing left to buy AND nothing to swap.
				return groupRemaining(g) === 0
			}

			// Section-aware group keys + completion (for celebration / auto-scroll).
			function cgGroupKey(r) {
				const shop = (r.supplier_shop || '').trim()
				const stall = (r.supplier_stall || '').trim()
				return 'cg\x01' + (shop || stall ? locationSortKey(stall, shop) : '\uffff')
			}
			// Exchange → same supplier-location key as the buy list (they're merged).
			const exCgKey = (x) => cgGroupKey(x)
			// The stop a charm is SHOPPED at — its supplier group when that merchant is
			// already on the case/grip route, else its own charm stall. One source of
			// truth with the renderer, so the "stall finished" celebration and auto-
			// advance always name the group the shopper is actually looking at.
			function charmGroupKey(r) {
				const stopKey = charmMergeStop(r)
				if (stopKey != null) return 'cg\x01' + stopKey
				const shop = (r.charm_shop || '').trim()
				return 'ch\x01' + (shop ? shop.toLowerCase() : '\uffff')
			}
			function cgGroupDone(key) {
				const rs = ROWS.filter((r) => inCgSection(r) && cgGroupKey(r) === key)
				// Charms sourced at this same stall are part of the stop's work, so it
				// isn't finished until they're bought either.
				const chs = ROWS.filter((r) => inCharmSection(r) && charmGroupKey(r) === key)
				const buysDone = rs.length + chs.length > 0 && rs.every(cgDone) && chs.every(charmDone)
				// The stall isn't "done" while a swap is still owed there.
				const swapPending = EXCHANGES.some((x) => exCgKey(x) === key)
				return buysDone && !swapPending
			}
			function charmGroupDone(key) {
				const rs = ROWS.filter((r) => inCharmSection(r) && charmGroupKey(r) === key)
				return rs.length > 0 && rs.every(charmDone)
			}
			// Is the STOP named by this key finished? A key names either a supplier group
			// ('cg…') or a charm stall ('ch…') — and a charm merged into a supplier stop
			// carries the supplier's key, so it must be judged by the whole stop.
			const stopDone = (key) => (String(key).startsWith('ch\x01') ? charmGroupDone(key) : cgGroupDone(key))

			// ── Navigation drawer (route tree: Section → Building → Floor → Stall) ──
			// The building level is what makes the drawer usable now that the route
			// spans several markets: "5楼" on its own used to file the home market's
			// 5C26 next to 康乐北区5A40-42 and 经济5D91, which are a taxi ride apart.
			const drawerOpen = () => $('drawerBg').classList.contains('open')

			// ══ ROUTE TREE ══
			const treeCollapsed = new Set() // node ids the shopper explicitly folded away
			const treeExpanded = new Set() // …and ones they explicitly re-opened
			// The drawer opens as a map of the trip: every market on one screen, nothing
			// below it. A shopper picks where to walk first, then opens that market. Its
			// floors and stalls stay open from there — a finished branch folds itself
			// away so the drawer shrinks as the trip progresses, the same rule the list
			// uses for a finished stall. Either way an explicit tap wins.
			const treeNodeCollapsed = (node) =>
				treeCollapsed.has(node.id) ? true
				: treeExpanded.has(node.id) ? false
				: node.type === 'building' ? true
				: node.remaining === 0

			// Build the tree from the CURRENTLY rendered groups so leaf → card jumps
			// line up with the DOM (via each group's data-gidx index).
			function buildTree() {
				const cg = { id: 'sec:cg', type: 'section', label: t('secCG'), remaining: 0, children: [], buildings: new Map() }
				const charm = { id: 'sec:charm', type: 'section', label: t('secCharm'), remaining: 0, children: [], buildings: new Map() }
				LAST_GROUPS.forEach((g, gidx) => {
					// Count includes exchanges owed at the stall (they're merged into cg).
					const remaining = groupRemaining(g)
					const sec = g.section === 'charm' ? charm : cg
					addTreeLeaf(sec, g.loc, {
						type: 'leaf',
						gidx,
						label: g.shop || (g.section === 'charm' ? t('charmNotSet') : t('supplierNotSet')),
						sub: g.loc.code,
						remaining,
					})
					sec.remaining += remaining
				})
				const out = []
				if (cg.children.length) out.push(cg)
				if (charm.children.length) out.push(charm)
				return out
			}

			// File one stop under its market, then its floor. Stalls whose floor can't
			// be read hang straight off the market rather than under an "Other" floor
			// that would tell the shopper nothing — and because they already sort last
			// within the market, they land after the real floors on their own.
			function addTreeLeaf(sec, loc, leaf) {
				const bid = sec.id + ':bld:' + (loc.located ? loc.buildingId : '_')
				let b = sec.buildings.get(bid)
				if (!b) {
					b = { id: bid, type: 'building', label: loc.located ? buildingLabel(loc) : t('otherFloor'), remaining: 0, children: [], floors: new Map() }
					sec.buildings.set(bid, b)
					sec.children.push(b)
				}
				b.remaining += leaf.remaining
				if (loc.floor === UNKNOWN_FLOOR) {
					b.children.push(leaf)
					return
				}
				const fid = b.id + ':flr:' + loc.floor
				let fl = b.floors.get(fid)
				if (!fl) {
					fl = { id: fid, type: 'floor', label: floorLabel(loc.floor), remaining: 0, children: [] }
					b.floors.set(fid, fl)
					b.children.push(fl)
				}
				fl.children.push(leaf)
				fl.remaining += leaf.remaining
			}

			function treeNodeHtml(node) {
				const badge = (n) => `<span class="${n === 0 ? 'tcount z' : 'tcount'}">${n === 0 ? '✓' : n}</span>`
				if (node.type === 'leaf') {
					const sub = node.sub ? ` <span class="tsub">${esc(node.sub)}</span>` : ''
					return `<div class="tnode"><div class="trow leaf" data-gidx="${node.gidx}">
						<span class="tcaret" style="visibility:hidden">·</span>
						<span class="tlabel">${esc(node.label)}${sub}</span>
						${badge(node.remaining)}
					</div></div>`
				}
				const collapsed = treeNodeCollapsed(node)
				return `<div class="tnode ${node.type === 'building' ? 'bld ' : ''}${collapsed ? 'collapsed' : ''}">
					<div class="trow ${node.type}" data-toggle="${esc(node.id)}">
						<span class="tcaret">▾</span>
						<span class="tlabel">${esc(node.label)}</span>
						${badge(node.remaining)}
					</div>
					<div class="tchildren">${node.children.map(treeNodeHtml).join('')}</div>
				</div>`
			}
			// ══ END ROUTE TREE ══

			function renderTree() {
				const tree = buildTree()
				const items = tree.reduce((n, s) => n + s.remaining, 0)
				const orders = new Set(ROWS.filter((r) => !fullyPurchased(r)).map((r) => r.receipt_id)).size
				$('drawerTitle').textContent = t('overview')
				$('drawerSub').textContent = `${items} ${t('leftSummary')} · ${ordersN(orders)}`
				$('treeRoot').innerHTML = tree.length ? tree.map(treeNodeHtml).join('') : `<div class="tempty">${t('allBought')}</div>`
			}
			function maybeRenderTree() {
				if (drawerOpen()) renderTree()
				syncMap()
			}

			// ── Overlay focus management (return focus on close, for a11y) ───────
			let lastFocus = null
			function rememberFocus() {
				lastFocus = document.activeElement
			}
			function restoreFocus() {
				try {
					if (lastFocus && lastFocus.focus) lastFocus.focus()
				} catch {}
				lastFocus = null
			}
			// Close whichever overlay is on top (Escape / back-gesture friendly).
			// `fromPop` is true when the close originates from a hardware/browser Back
			// press so the manager knows the history entry is already consumed.
			function closeTopOverlay(fromPop) {
				if ($('zoomBg').classList.contains('open')) return closeZoom(fromPop), true
				if ($('prepBg').classList.contains('open')) return closePrepSheet(fromPop), true
				if ($('mergeBg').classList.contains('open')) return closeMergeSheet(fromPop), true
				if ($('priceBg').classList.contains('open')) return closePriceSheet(fromPop), true
				if ($('sheetBg').classList.contains('open')) return closeSheet(fromPop), true
				if (mapOpen()) return closeMap(fromPop), true
				if (drawerOpen()) return closeDrawer(fromPop), true
				return false
			}

			// ── Overlay lifecycle manager ────────────────────────────────────────
			// One place owns the cross-cutting concerns for every modal overlay
			// (status sheet, price sheet, map, drawer, image zoom):
			//   • Hardware/browser BACK closes the top overlay instead of leaving the
			//     page — via a pushed history entry per open + a single popstate handler.
			//   • The page behind is scroll-locked so the list can't move under a sheet.
			//   • Focus is trapped inside the top overlay (Tab wraps) for keyboard/AT.
			// Design: every OPEN pushes one history entry; a PROGRAMMATIC close consumes
			// it via history.back() (guarded by `suppress` so it doesn't re-close); a
			// BACK press is handled by popstate closing the top overlay directly. Depth
			// stays balanced across any mix of the two paths, including stacked overlays.
			const Overlay = (() => {
				const trapStack = [] // dialog containers, innermost last (for focus trap)
				let depth = 0 // pushed history entries not yet consumed
				let suppress = 0 // popstate events to swallow (from our own history.back)
				const root = document.documentElement

				function opened(container) {
					if (!trapStack.length) root.classList.add('scroll-lock')
					trapStack.push(container || null)
					depth++
					history.pushState({ shopOverlay: depth }, '')
				}
				function closed(fromPop) {
					if (trapStack.length) trapStack.pop()
					if (!trapStack.length) root.classList.remove('scroll-lock')
					if (fromPop === true) {
						// popstate already decremented depth and moved history back.
						return
					}
					if (depth > 0) {
						depth--
						suppress++
						history.back()
					}
				}
				window.addEventListener('popstate', () => {
					if (suppress > 0) return void suppress--
					if (depth > 0) {
						depth--
						closeTopOverlay(true) // synchronous DOM close; won't touch history
					}
				})
				return {
					opened,
					closed,
					topTrap: () => trapStack[trapStack.length - 1] || null,
				}
			})()

			// Keep Tab focus inside the top overlay (light, standard focus trap).
			document.addEventListener('keydown', (e) => {
				if (e.key !== 'Tab') return
				const box = Overlay.topTrap()
				if (!box) return
				const nodes = [...box.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])')].filter(
					(n) => n.offsetWidth || n.offsetHeight || n === document.activeElement,
				)
				if (!nodes.length) return void e.preventDefault()
				const first = nodes[0]
				const last = nodes[nodes.length - 1]
				if (!box.contains(document.activeElement)) {
					e.preventDefault()
					first.focus()
				} else if (e.shiftKey && document.activeElement === first) {
					e.preventDefault()
					last.focus()
				} else if (!e.shiftKey && document.activeElement === last) {
					e.preventDefault()
					first.focus()
				}
			})

			function openDrawer() {
				rememberFocus()
				renderTree()
				$('drawerBg').classList.add('open')
				Overlay.opened($('drawer'))
				$('drawerClose').focus()
			}
			function closeDrawer(fromPop) {
				if (!$('drawerBg').classList.contains('open')) return
				$('drawerBg').classList.remove('open')
				restoreFocus()
				Overlay.closed(fromPop)
			}

			// Jump from a drawer leaf to its group: expand it, scroll it into view
			// (below the sticky header), and flash it.
			function navigateToGroup(gidx) {
				const g = LAST_GROUPS[gidx]
				closeDrawer()
				if (g && g.sortKey) collapseOverride.set(g.sortKey, false)
				render()
				requestAnimationFrame(() => {
					const grp = document.querySelector(`.group[data-gidx="${gidx}"]`)
					if (!grp) return
					shopScrollElIntoView(grp, 8)
					grp.classList.add('ghl')
					setTimeout(() => grp.classList.remove('ghl'), 1500)
				})
			}

			// ── Supplier map (in-person wayfinding) ──────────────────────────────
			let FLOOR_LAYOUT = null // [{ mall, floor, label, corridors:[…] }]
			let MAP_STALLS = new Set() // normalised stall codes that exist on any floor
			let mapFloorIdx = 0
			let mapLocateMode = false
			let mapLocateTarget = ''
			const mapOpen = () => $('mapBg').classList.contains('open')
			// Same normalisation the server uses, so route stalls match map stalls.
			const mapNorm = (s) =>
				String(s || '')
					.trim()
					.toUpperCase()
					.replace(/\s+/g, '')
					.replace(/[–—]/g, '-')
			// Mirror of server stallCodeAliases: expand merged stalls (A279-280,
			// 5B31-32, 5C03-07) to their unit codes so a catalog stall recorded as a
			// single unit still matches the combined map cell. Numbers must share the
			// same width, so single-unit codes like A2-21 / A2-16 are left untouched.
			const mapCodeAliases = (code) => {
				const normalized = mapNorm(code)
				if (!normalized) return []
				const out = new Set([normalized])
				const match = /^([0-9]*[A-Z]+)(\d+)-(\d+)$/.exec(normalized)
				if (match) {
					const [, prefix, startStr, endStr] = match
					const start = Number(startStr)
					const end = Number(endStr)
					if (startStr.length === endStr.length && end >= start && end - start <= 20) {
						for (let value = start; value <= end; value++) out.add(`${prefix}${String(value).padStart(startStr.length, '0')}`)
					}
				}
				return [...out]
			}
			const stallAliases = (stall) => (stall && stall.aliases && stall.aliases.length ? stall.aliases : mapCodeAliases(stall && (stall.code || stall.norm || stall)))
			// Do two stall codes name the same physical booth? They must sit in the
			// same MARKET first — 康乐5A17 and the home market's 5A17 are different
			// shops in different buildings — and only then are their local codes
			// compared, with merged-stall ranges expanded. Running the expansion on the
			// prefix-free code is also what makes a range in another market
			// (康乐北区5C34-39) resolve to its units at all.
			const stallCodesOverlap = (a, b) => {
				const la = parseStall(a)
				const lb = parseStall(b)
				if (!la.located || !lb.located || la.buildingId !== lb.buildingId) return false
				const right = new Set(mapCodeAliases(lb.code))
				return mapCodeAliases(la.code).some((code) => right.has(code))
			}
			// The code to look for on the floor plans. The plans were surveyed in the
			// home market only, so a stall anywhere else has no map code at all —
			// without this, 康乐5A17 would light up the home market's 5A17.
			const mapCodeOf = (stall) => {
				const loc = parseStall(stall)
				return loc.located && loc.isHome ? mapNorm(loc.code) : ''
			}
			// Localise a label that may be a plain string ('左a') or an {en,zh} pair.
			const lz = (v) => (typeof v === 'string' ? v : v ? (LANG === 'zh' ? v.zh : v.en) : '')

			async function loadFloorMap() {
				try {
					const r = await fetch('/api/route/floor-map', { credentials: 'same-origin' })
					if (!r.ok) return
					const d = await r.json()
					FLOOR_LAYOUT = (d.floors || []).filter((f) => f.corridors && f.corridors.length)
					// Index of every stall on the map, so the list only shows a "locate"
					// button for shops we can actually point to.
					MAP_STALLS = new Set()
					for (const f of FLOOR_LAYOUT) for (const c of f.corridors) for (const sd of c.sides) for (const blk of sd.blocks) for (const st of blk) {
						for (const alias of stallAliases(st)) MAP_STALLS.add(alias)
					}
					if (FLOOR_LAYOUT.length) {
						$('mapBtn').style.display = ''
						render() // re-render so locate buttons appear on already-shown groups
					}
				} catch {}
			}
			const mapHasStall = (stall) => {
				const code = mapCodeOf(stall)
				return !!code && MAP_STALLS.has(code)
			}

			// Per-stall (normalised) shopping status from the live route: how many
			// lines still to buy vs. total. Exchanges owed at a supplier count too.
			function stallStatusMap() {
				const m = new Map()
				const bump = (code, remaining) => {
					const c = mapCodeOf(code)
					if (!c) return
					let e = m.get(c)
					if (!e) {
						e = { total: 0, remaining: 0 }
						m.set(c, e)
					}
					e.total++
					if (remaining) e.remaining++
				}
				for (const r of ROWS) if (inCgSection(r)) bump(r.supplier_stall, !cgDone(r))
				// Charms count at their own stall too. Without this, a stall whose cases are
				// bought but whose charm still isn't would read as DONE on the map and get
				// skipped — the very trip this merge is meant to save.
				for (const r of ROWS) if (inCharmSection(r)) bump(r.charm_stall, !charmDone(r))
				for (const x of EXCHANGES) bump(x.supplier_stall, true)
				return m
			}

			// Index of the rendered group for a stall (for tap-to-jump), or -1. Supplier
			// groups are checked first (they lead LAST_GROUPS), so a stall that sells both
			// lands on the stop that now carries its charms too.
			function groupIdxForStall(norm) {
				for (let i = 0; i < LAST_GROUPS.length; i++) {
					const g = LAST_GROUPS[i]
					if (stallCodesOverlap(g.stall, norm)) return i
				}
				return -1
			}

			function renderMap() {
				const body = $('mapFloor')
				if (!FLOOR_LAYOUT || !FLOOR_LAYOUT.length) {
					body.innerHTML = `<div class="state"><div class="state-title">${t('mapNone')}</div></div>`
					return
				}
				if (mapFloorIdx >= FLOOR_LAYOUT.length) mapFloorIdx = 0
				const floor = FLOOR_LAYOUT[mapFloorIdx]
				const stat = stallStatusMap()
				$('mapTitle').textContent = t('mapTitle')
				// Single floor → no switcher pill (saves header height); the floor is
				// shown in the subtitle instead.
				$('mapFloors').innerHTML =
					FLOOR_LAYOUT.length > 1
						? FLOOR_LAYOUT.map((f, i) => `<button class="map-floor ${i === mapFloorIdx ? 'on' : ''}" data-fi="${i}">${esc(lz(f.label))}</button>`).join('')
						: ''
				$('mapLegend').innerHTML =
					`<span class="lg"><span class="sw need"></span>${t('legTo')}</span>` +
					`<span class="lg"><span class="sw done"></span>${t('legDone')}</span>` +
					`<span class="lg"><span class="sw other"></span>${t('legOther')}</span>`

				let needStalls = 0
				const cell = (st) => {
					const aliases = stallAliases(st)
					const e = aliases.reduce(
						(total, alias) => {
							const value = stat.get(alias)
							if (value) {
								total.total += value.total
								total.remaining += value.remaining
							}
							return total
						},
						{ total: 0, remaining: 0 },
					)
					const hasStatus = !!(e && e.total > 0)
					const aliasAttr = aliases.map(esc).join(' ')
					// Faint only when it's neither named nor on today's route. Every cell
					// carries data-code so the "locate" action can target it.
					if (!st.named && !hasStatus) {
						return `<div class="mstall unnamed" data-code="${esc(st.norm)}" data-aliases="${aliasAttr}"><span class="mcode">${esc(st.code)}</span></div>`
					}
					let cls = 'other'
					let count = 0
					if (hasStatus) {
						if (e.remaining > 0) {
							cls = 'need'
							count = e.remaining
							needStalls++
						} else cls = 'done'
					}
					const tap = cls === 'need' || cls === 'done'
					const tag = tap ? 'button' : 'div'
					return `<${tag} class="mstall ${cls}" data-code="${esc(st.norm)}" data-aliases="${aliasAttr}"${tap ? ` data-stall="${esc(st.norm)}"` : ''}>
						<span class="mcode">${esc(st.code)}</span>
						${st.name ? `<span class="mname">${esc(st.name)}</span>` : ''}
						${count > 0 ? `<span class="mcount">${count}</span>` : ''}
					</${tag}>`
				}

				const elevatorHtml = (l) =>
					`<div class="map-elevator" title="${esc(lz(l.label))}"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><polyline points="9.5 9.5 12 7 14.5 9.5"/><polyline points="9.5 14.5 12 17 14.5 14.5"/></svg><span>${esc(lz(l.label))}</span></div>`
				let html = ''
				floor.corridors.forEach((c, ci) => {
					html += `<div class="corridor"><div class="corridor-title">${esc(lz(c.label))}</div><div class="aisle">`
					c.sides.forEach((sd, si) => {
						html += `<div class="side ${si === 0 ? 'a' : 'b'}"><div class="side-title">${esc(sd.label)}</div>`
						// Flip each side vertically: the last-recorded stall shows at the
						// TOP (e.g. 右b → A225-227 top, A248 bottom). Data stays in physical
						// walking order; only the display is reversed. slice() avoids
						// mutating the cached layout across re-renders.
						html += sd.blocks
							.slice()
							.reverse()
							.map((blk) => `<div class="mblock">${blk.slice().reverse().map(cell).join('')}</div>`)
							.join('')
						html += `</div>`
					})
					html += `</div></div>`
					// Central walkway between the two corridors — holds the elevator at the
					// near (bottom) end, between A275 (左b) and A2-21 (右a).
					if (ci === 0 && floor.corridors.length > 1) {
						const landmarks = floor.landmarks || []
						const elev = landmarks.find((l) => l.type === 'elevator')
						html += `<div class="map-walkway">${elev ? elevatorHtml(elev) : ''}</div>`
					}
				})
				body.innerHTML = html
				const floorLbl = lz(floor.label)
				$('mapSub').textContent = needStalls
					? LANG === 'zh'
						? `${floorLbl} · 需前往 ${needStalls} 个摊位`
						: `${floorLbl} · ${needStalls} stall${needStalls > 1 ? 's' : ''} to visit`
					: LANG === 'zh'
						? `${floorLbl} · 本层无需采购`
						: `${floorLbl} · nothing to buy here`
			}
			// Keep the map fresh while it's open (status changes, teammate updates).
			function syncMap() {
				if (!mapOpen()) return
				renderMap()
				if (mapLocateMode && mapLocateTarget) {
					const cell = $('mapFloor').querySelector('.mstall[data-aliases~="' + CSS.escape(mapLocateTarget) + '"]')
					if (cell) focusCell(cell)
				}
			}

			function openMap() {
				if (!FLOOR_LAYOUT || !FLOOR_LAYOUT.length) return
				const wasOpen = mapOpen()
				rememberFocus()
				mapLocateMode = false
				mapLocateTarget = ''
				$('mapBody').classList.remove('locating')
				// Default to the floor with the most stalls still to visit.
				const stat = stallStatusMap()
				let best = 0
				let bestN = -1
				FLOOR_LAYOUT.forEach((f, i) => {
					let n = 0
					for (const c of f.corridors) for (const sd of c.sides) for (const blk of sd.blocks) for (const st of blk) {
						const e = stat.get(st.norm)
						if (e && e.remaining > 0) n++
					}
					if (n > bestN) {
						bestN = n
						best = i
					}
				})
				mapFloorIdx = best
				set3d(false) // always open flat (readable) rather than tilted
				renderMap()
				$('mapBg').classList.add('open')
				if (!wasOpen) Overlay.opened($('mapBg'))
				// Open framing the ENTIRE floor so no stall is hidden below the fold
				// (e.g. A201-202 at the far end). Detail is a pinch / double-tap away.
				requestAnimationFrame(() => requestAnimationFrame(fitMap))
				$('mapClose').focus()
			}
			function closeMap(fromPop) {
				if (!mapOpen()) return
				$('mapBg').classList.remove('open')
				$('mapBody').classList.remove('locating')
				mapLocateMode = false
				mapLocateTarget = ''
				restoreFocus()
				Overlay.closed(fromPop)
			}

			// Which floor index holds a given stall code (or -1).
			function floorIdxForStall(norm) {
				for (let i = 0; i < (FLOOR_LAYOUT || []).length; i++) {
					for (const c of FLOOR_LAYOUT[i].corridors) for (const sd of c.sides) for (const blk of sd.blocks) for (const st of blk) {
						if (stallAliases(st).includes(norm)) return i
					}
				}
				return -1
			}
			// Open the map focused on ONE stall: switch to its floor, zoom in, centre it
			// and pulse it. Triggered by a supplier group's "locate" button when the
			// shopper doesn't know where a shop is.
			function openMapAt(code) {
				if (!FLOOR_LAYOUT || !FLOOR_LAYOUT.length) return
				const wasOpen = mapOpen()
				const norm = mapCodeOf(code)
				mapLocateTarget = norm
				const fi = floorIdxForStall(norm)
				rememberFocus()
				mapLocateMode = true
				if (fi >= 0) mapFloorIdx = fi
				set3d(false)
				renderMap()
				$('mapBg').classList.add('open')
				if (!wasOpen) Overlay.opened($('mapBg'))
				$('mapClose').focus()
				requestAnimationFrame(() =>
					requestAnimationFrame(() => {
						const cell = fi >= 0 ? $('mapFloor').querySelector('.mstall[data-aliases~="' + CSS.escape(norm) + '"]') : null
						if (cell) focusCell(cell)
						else {
							fitMap()
							toast(LANG === 'zh' ? '该摊位不在地图上' : "That stall isn't on the map")
						}
					}),
				)
			}
			// Frame the WHOLE floor (so the shopper sees where the shop sits in the
			// overall layout) and make the target pulse so it's found at a glance.
			function focusCell(cell) {
				fitMap()
				$('mapBody').classList.add('locating')
				cell.dataset.located = LANG === 'zh' ? '这里' : 'HERE'
				cell.classList.add('locate')
			}

			// ── Map pan / zoom / 3-D (dependency-free, pointer-events) ───────────
			let mScale = 1
			let mTx = 0
			let mTy = 0
			let mTilt = false
			const M_MIN = 0.12
			const M_MAX = 4.5
			const mPointers = new Map()
			let mPinchDist = 0
			let mPinchMid = null
			let mPanLast = null
			let mMoved = false // gesture moved → suppress the tap-to-jump click
			let mDown = null

			function applyMapTransform() {
				$('mapScene').style.transform = `translate(${mTx.toFixed(2)}px, ${mTy.toFixed(2)}px) scale(${mScale.toFixed(4)})`
			}
			const clampScale = (s) => Math.max(M_MIN, Math.min(M_MAX, s))
			// Point in stage-local coordinates.
			function stagePt(clientX, clientY) {
				const r = $('mapBody').getBoundingClientRect()
				return { x: clientX - r.left, y: clientY - r.top }
			}
			// Zoom by `factor` while keeping stage point (sx,sy) fixed (zoom-to-cursor).
			function mapZoomAt(factor, sx, sy) {
				const ns = clampScale(mScale * factor)
				const ratio = ns / mScale
				mTx = sx - (sx - mTx) * ratio
				mTy = sy - (sy - mTy) * ratio
				mScale = ns
				applyMapTransform()
			}
			// Fit the whole floor into the stage, centered.
			function fitMap() {
				const stage = $('mapBody')
				const floor = $('mapFloor')
				const sw = stage.clientWidth
				const sh = stage.clientHeight
				const fw = floor.offsetWidth
				const fh = floor.offsetHeight
				if (!fw || !fh || !sw || !sh) return
				const pad = 8
				mScale = clampScale(Math.min((sw - pad * 2) / fw, (sh - pad * 2) / fh))
				mTx = (sw - fw * mScale) / 2
				mTy = Math.max(pad, (sh - fh * mScale) / 2)
				applyMapTransform()
			}
			function set3d(on) {
				mTilt = on
				$('mapScene').classList.toggle('tilt', on)
			}

			// ── In-place DOM updates ─────────────────────────────────────────────
			// Status changes patch the affected card(s) directly instead of rebuilding
			// the whole list. This removes the flash/refresh AND stops every image
			// from reloading on each tap.
			// Every Case/Grip card a row appears in. Each card is a component-scoped
			// aggregate (a case model row or the grip batch), so a combo order lives in
			// TWO cards — its case in a model row, its grip in the batch — and a status
			// change must patch both; a case-only / grip-only order returns one.
			function findCgCards(r) {
				const out = []
				for (const el of document.querySelectorAll('.model-group[data-agg]')) {
					const rows = AGG.get(el.dataset.agg)
					if (rows && rows.includes(r)) out.push(el)
				}
				return out
			}
			// A card is "done" (removable when hiding bought) once its scoped component
			// (case row / grip batch) is fully Purchased. The cgDone fallback is
			// defensive — every Case/Grip card is component-scoped.
			function cgCardDone(el, rows) {
				if (el.dataset.comp) {
					const field = 'status_' + el.dataset.comp
					return rows.every((row) => (row[field] || 'Pending') === 'Purchased')
				}
				return rows.every(cgDone)
			}
			// Locate the merged-charm card covering a row via the live AGG map. Scoped to
			// SOURCED charm cards (`.charm-card`), which now render either at their own
			// charm stall or inside a supplier group that sells them: an integral (AirPods)
			// charm renders a charm chip inside a product card instead, and that one is
			// handled via the cg cards — so this must not match it, or the two paths would
			// fight over one row.
			function findCharmCard(r) {
				for (const btn of document.querySelectorAll('.card.charm-card .comp[data-agg][data-c="charm"]')) {
					const rows = AGG.get(btn.dataset.agg)
					if (rows && rows.includes(r)) return { el: btn.closest('.card'), rows }
				}
				return null
			}
			function updateCgCardEl(el, r) {
				const rows = el.dataset.agg ? AGG.get(el.dataset.agg) || [r] : [r]
				// A component-scoped card (case model row / grip batch) tracks exactly ONE
				// component; the CASE_GRIP fallback is defensive (all cards are scoped).
				const scopeComp = el.dataset.comp ? COMPONENTS.find((c) => c.key === el.dataset.comp) : null
				const scoped = scopeComp ? [scopeComp] : CASE_GRIP
				const done = scopeComp
					? rows.every((row) => (row[scopeComp.status] || 'Pending') === 'Purchased')
					: rows.every(cgDone)
				el.classList.toggle('done', done)
				// Patch ONLY the affected component button(s) in place. Rebuilding the
				// whole .comps innerHTML tore down / recreated both buttons every tap,
				// which caused the visible twitch — so we surgically update instead.
				for (const c of scoped) {
					if (!rows.some((row) => row[c.flag])) continue
					const cb = el.querySelector('.comp[data-c="' + c.key + '"]')
					if (!cb) continue
					const relevant = rows.filter((row) => row[c.flag])
					const st = aggregateComponentStatus(rows, c)
					const m = STATUS_META[st] || STATUS_META.Pending
					cb.className = 'comp type-' + c.key + ' ' + m.cls
					const qty = relevant.reduce((n, row) => n + (row.quantity || 1), 0)
					const cl = cb.querySelector('.cl')
					if (cl) cl.textContent = compLabel(c) + (qty > 1 ? ` ×${qty}` : '')
					const cs = cb.querySelector('.cs')
					if (cs) cs.innerHTML = aggStatusHtml(st, relevant, c.status)
				}
				const btn = el.querySelector('.markall')
				if (btn) {
					btn.classList.toggle('done', done)
					btn.textContent = done ? t('bought') : t('markBought')
				}
				updateProductSummary(el.closest('.product'))
			}

			function updateProductSummary(productEl) {
				if (!productEl) return
				// Dedupe: a combo order appears in BOTH its case row and the grip batch,
				// so collect each line-item once (else case/grip totals double-count).
				const seen = new Set()
				const rows = []
				for (const el of productEl.querySelectorAll('.model-group[data-agg]')) {
					for (const row of AGG.get(el.dataset.agg) || []) {
						const k = row.receipt_id + '\x00' + row.item_key
						if (seen.has(k)) continue
						seen.add(k)
						rows.push(row)
					}
				}
				const values = {
					case: rows.filter((r) => r.has_case && (r.status_case || 'Pending') !== 'Purchased').reduce((n, r) => n + (r.quantity || 1), 0),
					grip: rows.filter((r) => r.has_grip && (r.status_grip || 'Pending') !== 'Purchased').reduce((n, r) => n + (r.quantity || 1), 0),
					// Integral (AirPods) charm — patched in place like case/grip so the
					// header total stays accurate after a tap without a full re-render.
					charm: rows.filter((r) => isIntegralCharm(r) && (r.status_charm || 'Pending') !== 'Purchased').reduce((n, r) => n + (r.quantity || 1), 0),
				}
				for (const [key, qty] of Object.entries(values)) {
					const el = productEl.querySelector('.component-total.' + key)
					if (!el) continue
					const comp = key === 'case' ? COMP_CASE : key === 'grip' ? COMP_GRIP : COMP_CHARM
					// Hide the "×1" — a lone unit reads cleaner as just "壳" / "支架"
					// (matches the initial render so live patches never diverge).
					el.textContent = compLabel(comp) + (qty > 1 ? ` ×${qty}` : '')
					el.hidden = qty === 0
				}
			}
			function updateCharmCardEl(el, rows) {
				const done = rows.every(charmDone)
				const status = aggStatus(rows)
				const m = STATUS_META[status] || STATUS_META.Pending
				el.classList.toggle('done', done)
				const comp = el.querySelector('.comp')
				if (comp) {
					comp.className = 'comp type-charm ' + m.cls
					const cs = comp.querySelector('.cs')
					if (cs) cs.innerHTML = aggStatusHtml(status, rows, 'status_charm')
				}
				const btn = el.querySelector('.markall')
				if (btn) {
					btn.className = 'markall' + (done ? ' done' : '')
					btn.textContent = done ? t('bought') : t('markBought')
				}
			}
			// Drop any sub-label ("Charms" / "Exchanges") whose cards have all been bought
			// away, so a group never shows a heading with nothing under it.
			function pruneSubLabels(groupEl) {
				if (!groupEl) return
				for (const lab of groupEl.querySelectorAll('.gsublabel')) {
					let hasCard = false
					for (let n = lab.nextElementSibling; n; n = n.nextElementSibling) {
						if (n.classList.contains('gsublabel')) break // next section starts
						if (n.classList.contains('card') || n.querySelector('.card')) {
							hasCard = true
							break
						}
					}
					if (!hasCard) lab.remove()
				}
			}
			// Remove a card; drop its product wrapper / group / section when empty.
			function removeCardEl(el) {
				const productEl = el.closest('.product')
				const groupEl = el.closest('.group')
				const sectionEl = el.closest('.section')
				el.remove()
				if (productEl && !productEl.querySelector('.card')) productEl.remove()
				else updateProductSummary(productEl)
				if (groupEl && !groupEl.querySelector('.card')) groupEl.remove()
				else pruneSubLabels(groupEl)
				if (sectionEl && !sectionEl.querySelector('.card')) sectionEl.remove()
			}
			// Recompute every count badge (group, section, summary, drawer) + collapse
			// finished stalls — all without rebuilding the list.
			function refreshBadges() {
				renderSummary()
				let cgRem = 0
				let chRem = 0
				document.querySelectorAll('.group[data-gidx]').forEach((groupEl) => {
					const g = LAST_GROUPS[+groupEl.dataset.gidx]
					if (!g) return
					const rem = groupRemaining(g)
					if (g.section === 'charm') chRem += rem
					else cgRem += rem
					const gc = groupEl.querySelector('.ghead .gcount')
					if (gc) {
						gc.className = 'gcount' + (rem === 0 ? ' done' : '')
						gc.textContent = rem === 0 ? '✓' : rem
					}
					if (rem === 0 && !collapseOverride.has(g.sortKey) && !groupEl.classList.contains('collapsed')) {
						groupEl.classList.add('collapsed')
						const gb = groupEl.querySelector('.gbody')
						if (gb) gb.remove()
					}
				})
				// Market milestones are patched from the same pass, so the "how much is
				// left in this building" number can't drift from the stalls under it.
				document.querySelectorAll('.bdiv[data-bfrom]').forEach((div) => {
					const from = Number(div.dataset.bfrom)
					if (!LAST_GROUPS[from]) return
					const items = buildingLegRemaining(from)
					const badge = div.querySelector('.bcount')
					if (badge) {
						badge.className = 'bcount' + (items ? '' : ' done')
						badge.textContent = items || '✓'
					}
				})
				const setSec = (sel, rem) => {
					const b = document.querySelector(sel + ' .section-head .section-count')
					if (b) {
						b.className = 'section-count' + (rem === 0 ? ' sdone' : '')
						b.textContent = rem === 0 ? '✓' : rem
					}
				}
				setSec('.section.cg', cgRem)
				setSec('.section.charm', chRem)
				if (!$('list').querySelector('.card')) {
					LAST_GROUPS = []
					$('list').innerHTML = `<div class="state"><div class="state-title">${searchQ ? t('noMatches') : t('allBought')}</div></div>`
				}
				if (drawerOpen()) renderTree()
				syncMap()
			}
			// Patch the UI in place for one status change across one/many lines.
			function patchUi(rowsArr, touchesCharm) {
				for (const r of rowsArr) {
					// A sourced charm lives in the Charm section (its own card). A
					// case/grip change — OR an integral (AirPods) charm, which renders as
					// a component of its product — is patched through the cg cards, where
					// findCgCards also picks up the integral charm chip via `.model-group`.
					if (touchesCharm && !isIntegralCharm(r)) {
						const found = findCharmCard(r)
						if (found) {
							if (!showDone && found.rows.every(charmDone)) removeCardEl(found.el)
							else updateCharmCardEl(found.el, found.rows)
						}
					} else {
						for (const el of findCgCards(r)) {
							const rows = el.dataset.agg ? AGG.get(el.dataset.agg) || [r] : [r]
							if (!showDone && cgCardDone(el, rows)) removeCardEl(el)
							else updateCgCardEl(el, r)
						}
					}
				}
				refreshBadges()
			}
			// Patch a row wherever it appears (a line can be in both the Case/Grip and
			// Charm sections, and a combo order in both its case row and grip batch).
			// Used for real-time updates from other devices.
			function patchRowEverywhere(r) {
				for (const cg of findCgCards(r)) {
					const rows = cg.dataset.agg ? AGG.get(cg.dataset.agg) || [r] : [r]
					if (!showDone && cgCardDone(cg, rows)) removeCardEl(cg)
					else updateCgCardEl(cg, r)
				}
				const ch = findCharmCard(r)
				if (ch) {
