					if (!showDone && ch.rows.every(charmDone)) removeCardEl(ch.el)
					else updateCharmCardEl(ch.el, ch.rows)
				}
				refreshBadges()
			}

			// ── Status changes (optimistic + retry queue) ────────────────────────
			function applyLocal(r, patch) {
				Object.assign(r, patch)
			}

			// Ask the service worker to drain the queue in the background when
			// connectivity returns — even if this tab is later closed/evicted. A no-op
			// where Background Sync is unsupported (iOS Safari); the online/foreground
			// flush below is the fallback there.
			function requestBgSync() {
				if (!('serviceWorker' in navigator) || !navigator.serviceWorker.ready) return
				navigator.serviceWorker.ready
					.then((reg) => reg.sync && reg.sync.register(ShopSync.SYNC_TAG))
					.catch(() => {})
			}

			// Persist the latest coalesced value in strict sequence. Reading `pending`
			// inside the chain skips superseded objects and ensures the durable store is
			// never older than the in-memory desired state.
			function persistQueuedEntry(entry) {
				const version = ++queuePersistVersion
				queuePersistChain = queuePersistChain
					.catch(() => {})
					.then(async () => {
						const latest = pending.get(entry.id)
						if (!latest) return
						try {
							await ShopSync.putEntry(latest)
						} catch {
							/* IndexedDB unavailable — the in-memory queue still drains */
						}
					})
					.finally(() => {
						queuePersistedVersion = version
					})
				return queuePersistChain
			}

			// Queue a status change for the server (optimistic; DURABLE + retried on
			// failure). Coalesces repeated taps on the same line into one write.
			function enqueueNetwork(r, patch) {
				recordLocalMutation()
				const prev = pending.get(ShopSync.assignOpId(r.receipt_id, r.item_key))
				const entry = ShopSync.makeAssignEntry(prev, {
					receipt_id: r.receipt_id,
					item_key: r.item_key,
					title: r.title,
					patch,
					// Audit-only event context. It travels inside the same durable
					// offline operation, so a replay records what the shopper actually
					// saw at the stall rather than whatever the order looks like later.
					context: {
						phone_model: r.phone_model || '',
						ordered_phone_model: r.ordered_phone_model || '',
						style: r.style || '',
						quantity: r.quantity || 1,
						product_listing_id: r.product_listing_id,
						product_image_url: r.image_url || '',
					},
				}, Date.now())
				pending.set(entry.id, entry)
				setConn(sse && sse.readyState === 1 ? 'live' : 'off')
				persistQueuedEntry(entry).finally(() => {
					requestBgSync()
					flush()
				})
			}

			// Queue a price change (same durability guarantees as a status change, so a
			// price entered in a dead zone is never lost). Replaces any prior queued
			// price for the same product-component / charm.
			function enqueueCost(body) {
				recordLocalMutation()
				const entry = ShopSync.makeCostEntry(body, Date.now())
				pending.set(entry.id, entry)
				setConn(sse && sse.readyState === 1 ? 'live' : 'off')
				persistQueuedEntry(entry).finally(() => {
					requestBgSync()
					flush()
				})
			}

			// Apply one status change to one OR MANY lines (a merged charm hits every
			// order line it covers), persist each, re-render, and — if this completes
			// a whole stall — celebrate + jump to the next stall still needing shopping.
			// Applies a status patch optimistically and returns
			//   { action, completedKey }
			// so the caller can offer an undo (with countdown) and, if a stall just
			// finished, celebrate + advance. `action` is null for undo replays.
			function commitRows(rowsArr, patch, opts = {}) {
				if (!rowsArr || !rowsArr.length) return { action: null, completedKey: null }
				// Record the pre-change values so this can be undone (skip when this
				// call IS an undo).
				let action = null
				if (!opts.isUndo) {
					const changes = rowsArr.map((r) => {
						const prev = {}
						for (const k in patch) prev[k] = r[k]
						return { receipt_id: r.receipt_id, item_key: r.item_key, prev }
					})
					action = pushUndo({ type: 'assign', changes })
				}
				const touchesCharm = 'status_charm' in patch
				// Which SECTION's completion may have changed. An integral (AirPods)
				// charm completes its Cases & Grips stall, not a charm stall; a sourced
				// charm completes a charm stall. Case/grip always affect the cg stall.
				const affectsCg = 'status_case' in patch || 'status_grip' in patch || (touchesCharm && rowsArr.some(isIntegralCharm))
				const affectsCharm = touchesCharm && rowsArr.some((r) => !isIntegralCharm(r))
				const cgKeys = new Set(rowsArr.map(cgGroupKey))
				const chKeys = new Set(rowsArr.map(charmGroupKey))
				const wasCg = new Map([...cgKeys].map((k) => [k, stopDone(k)]))
				const wasCh = new Map([...chKeys].map((k) => [k, stopDone(k)]))
				for (const r of rowsArr) {
					applyLocal(r, patch)
					enqueueNetwork(r, patch)
				}
				patchUi(rowsArr, touchesCharm)
				let completedKey = null
				if (affectsCharm) {
					for (const k of chKeys) if (!wasCh.get(k) && stopDone(k)) { completedKey = k; break }
				}
				if (!completedKey && affectsCg) {
					for (const k of cgKeys) if (!wasCg.get(k) && stopDone(k)) { completedKey = k; break }
				}
				return { action, completedKey }
			}

			// Undo window (ms) for the countdown snackbar. Long enough to catch an
			// accidental tap, short enough to stay out of the way — Gmail uses ~5–10s.
			const UNDO_MS = 6000
			// After a status commit: show the undo snackbar, and if a stall just
			// finished, use a celebratory message + scroll to the next one.
			function afterCommit(res, msg, opts = {}) {
				if (!res || !res.action) return
				if (res.completedKey && !opts.noAdvance) {
					haptic([14, 40, 22]) // stall finished — a distinct success buzz
					showUndoBar(t('stallDone'), res.action)
					setTimeout(() => scrollToNextIncomplete(res.completedKey), 350)
				} else {
					haptic(10) // a single confirming tap
					showUndoBar(msg, res.action)
				}
			}

			// Resolves when the CURRENT drain pass finishes. When a pass is already in
			// flight we hand back THAT pass's promise rather than resolving instantly:
			// `flush()` is called on every tap, so a caller awaiting it (logout) would
			// otherwise sail straight through the `flushing` guard and conclude the work
			// is unsaved while the request was mid-flight and about to succeed.
			let flushPromise = null
			function flush() {
				if (!pending.size) return Promise.resolve()
				// External triggers (online, foreground, logout) can call flush before
				// enqueueNetwork's persistence callback. Never let a fast HTTP ACK race
				// ahead of the IndexedDB put and leave a resurrected stale queue entry.
				if (queuePersistedVersion < queuePersistVersion) {
					return queuePersistChain.catch(() => {}).then(() => flush())
				}
				if (flushing) return flushPromise || Promise.resolve()
				flushing = true
				// Never reject (most callers fire-and-forget, and the logout path awaits
				// without a catch), and always release the `flushing` latch — an escaping
				// throw would otherwise wedge the queue shut for the rest of the session.
				flushPromise = _flushPass()
					.catch(() => {})
					.finally(() => {
						flushing = false
					})
				return flushPromise
			}

			async function _flushPass() {
				let failed = false
				for (const id of [...pending.keys()]) {
					// Always send the LATEST coalesced state for this line: a tap may have
					// merged into it since the loop began.
					const entry = pending.get(id)
					if (!entry) continue // already acknowledged/removed
					try {
						const resp = await fetch(entry.url, {
							method: 'POST',
							headers: { 'Content-Type': 'application/json' },
							credentials: 'same-origin',
							body: JSON.stringify(entry.body),
						})
						if (resp.status === 401) {
							// Session lost — stop draining and re-auth. The entry stays in
							// IndexedDB, so nothing is lost; it replays after sign-in.
							leaveTo('/login')
							return
						}
						if (resp.status === 403) {
							// AUTHORIZATION, not a bad op: this role isn't allowed to make this
							// write (a role change mid-shift, or an allowlist edit). The op is
							// perfectly valid, so it MUST stay queued — dropping it would
							// silently destroy the shopper's purchases. Matches ShopSync
							// .replayAll, which the service worker uses on the same store; the
							// two diverging here is exactly the drift this shared module exists
							// to prevent.
							failed = true
							continue
						}
						// 2xx = applied. A non-auth 4xx means the op is permanently
						// rejected (e.g. the order was deleted) — drop it so one bad op can
						// never wedge the whole queue. 5xx / network → keep and retry.
						if (resp.ok || (resp.status >= 400 && resp.status < 500)) {
							// A successful write committed after any route GET that was
							// already in flight. Abort that older snapshot before it can
							// redraw the pre-tap state after `pending` becomes empty.
							if (resp.ok) invalidateRouteFetches()
							// Clear ONLY if nothing newer coalesced onto this line WHILE the
							// request was in flight. enqueueNetwork REPLACES the entry with a
							// freshly-merged object, so a changed reference means there's
							// still-unsent desired state. Deleting it here is exactly what made
							// a rapid case-then-grip tap "relapse": the grip was applied
							// locally + queued, then dropped after the case-only POST, and the
							// server echo reverted it. Leave it queued; the re-flush sends it.
							if (ShopSync.canAcknowledgeEntry(pending.get(id), entry)) {
								pending.delete(id)
								ShopSync.deleteEntry(id).catch(() => {})
							}
						} else {
							throw new Error('HTTP ' + resp.status)
						}
					} catch (e) {
						failed = true // network/5xx — keep queued, retry
					}
				}
				// `flushing` is released by flush()'s finally (the single owner), which runs
				// before either timer below can fire, so the re-flush is never blocked.
				if (pending.size) {
					if (failed) {
						// A genuine failure — back off so we don't hammer a flaky network.
						setConn('off')
						setTimeout(flush, 3000)
					} else {
						// Only freshly-coalesced (mid-flight) entries remain; send them
						// promptly so a still-unsent change can't linger and later relapse.
						setConn(sse && sse.readyState === 1 ? 'live' : 'off')
						setTimeout(flush, 0)
					}
				} else {
					setConn(sse && sse.readyState === 1 ? 'live' : 'off')
				}
			}

			// Set one component's status across one or many lines (skips no-ops).
			// `opts.noAdvance` keeps the view put (used for per-order edits made while
			// the status sheet is open, so it doesn't scroll away underneath).
			function setStatusRows(rowsArr, compKey, status, opts = {}) {
				const field = 'status_' + compKey
				const changed = rowsArr.filter((r) => (r[field] || 'Pending') !== status)
				if (!changed.length) return
				const comp = COMPONENTS.find((c) => c.key === compKey)
				const res = commitRows(changed, { [field]: status })
				afterCommit(res, `${compLabel(comp)} · ${stLabel(status)}`, opts)
			}

			// Mark a section's components bought across one or many lines.
			function markSection(rowsArr, sec) {
				const comps = sec === 'charm' ? CHARM : CASE_GRIP
				const patch = {}
				for (const c of comps) {
					if (rowsArr.some((r) => r[c.flag] && (r[c.status] || 'Pending') !== 'Purchased')) patch[c.status] = 'Purchased'
				}
				if (!Object.keys(patch).length) return
				const res = commitRows(rowsArr, patch)
				afterCommit(res, t('markedBought'))
			}

			// ── Undo (via the bottom countdown snackbar) ─────────────────────────
			// Each committed action carries everything needed to revert it. The undo
			// affordance is the countdown snackbar only (no persistent header button);
			// once the countdown lapses the action stands.
			function pushUndo(action) {
				return action
			}
			// Show the countdown undo snackbar for a specific just-performed action.
			function showUndoBar(msg, action) {
				if (!action) return toast(msg)
				toast(msg, t('undo'), () => undoAction(action), UNDO_MS)
			}
			// Revert one specific action.
			function undoAction(action) {
				if (!action) return
				haptic(10)
				if (action.type === 'assign') {
					for (const c of action.changes) {
						const row = rowIndex.get(c.receipt_id + '\x00' + c.item_key)
						if (row) {
							applyLocal(row, c.prev)
							enqueueNetwork(row, c.prev)
						}
					}
					render()
					toast(t('undone'))
				} else if (action.type === 'exchange') {
					const x = action.exchange
					if (!EXCHANGES.some((e) => e.exchange_id === x.exchange_id)) EXCHANGES.push(x)
					render()
					toast(t('undone'))
					fetch('/api/exchanges/' + encodeURIComponent(x.exchange_id) + '/reopen', { method: 'POST', credentials: 'same-origin' }).catch(() => {})
				}
			}

			function scrollToNextIncomplete(fromKey) {
				const idx = LAST_GROUPS.findIndex((g) => g.sortKey === fromKey)
				const start = idx >= 0 ? idx + 1 : 0
				for (let i = start; i < LAST_GROUPS.length; i++) {
					const g = LAST_GROUPS[i]
					if (groupRemaining(g) > 0) {
						const el = document.querySelector(`.group[data-gidx="${i}"] .ghead`)
						if (el) shopScrollElIntoView(el, 6)
						return
					}
				}
				// Nothing left to shop — stay exactly where the shopper is. (Jumping
				// back to the top here was disorienting and annoying.)
			}

			// ── Bottom-sheet status picker ───────────────────────────────────────
			// Two shapes:
			//   • Single order  → a plain status list (tap = set that line).
			//   • Many orders of one model → a "set all" list PLUS a per-order
			//     section, so one unit can be Bought while another is Out of Stock
			//     / Wrong Stall / etc. Each order maps 1:1 to a real line item.
			let sheetTarget = null // { rows, compKey, field }
			function optHtml(s, sel, extraAttr, mini) {
				const m = STATUS_META[s]
				return `<button class="opt${mini ? ' mini' : ''}${sel ? ' sel' : ''}" data-s="${esc(s)}"${extraAttr || ''}>
					<span class="swatch" style="background:${m.color}"></span>
					<span>${stLabel(s)}</span>
				</button>`
			}
			function renderSheet() {
				if (!sheetTarget) return
				const { rows, compKey, field } = sheetTarget
				const comp = COMPONENTS.find((c) => c.key === compKey)
				const r0 = rows[0]
				const totalQty = rows.reduce((n, r) => n + (r.quantity || 1), 0)
				const qtyTag = totalQty > 1 ? ` ×${totalQty}` : ''
				// Title: a case keeps its phone model (a case must fit); a grip has NO
				// model (it fits any phone); a charm shows its code.
				let title
				if (compKey === 'charm') title = `${compLabel(comp)} · <b>${esc(r0.charm_code || 'charm')}</b>${qtyTag}`
				else if (compKey === 'grip') title = `<b>${esc(compLabel(comp))}</b>${qtyTag}`
				else title = `${compLabel(comp)} · <b>${esc(r0.phone_model || 'item')}</b>${qtyTag}`
				$('sheetTitle').innerHTML = title

				if (rows.length <= 1) {
					const cur = r0[field] || 'Pending'
					$('sheetOpts').innerHTML = STATUS_ORDER.map((s) => optHtml(s, s === cur, '')).join('')
					return
				}
				// Multiple IDENTICAL units. They're fungible (a grip fits any phone; two
				// cases of the same model+design are interchangeable), so WHICH order gets
				// which unit is irrelevant — the shopper only cares HOW MANY are bought vs
				// unavailable. So: one-tap "set all", then a compact quantity split — far
				// cleaner than repeating the full status grid once per order.
				const allSame = rows.every((r) => (r[field] || 'Pending') === (r0[field] || 'Pending'))
				const cur = allSame ? r0[field] || 'Pending' : null
				const countOf = (s) => rows.filter((r) => (r[field] || 'Pending') === s).length
				const boughtN = countOf('Purchased')
				const noStockN = countOf('Out of Stock')
				const restN = rows.length - boughtN - noStockN
				const step = (statusKey, val) => {
					const canInc = rows.length - countOf(statusKey) > 0
					return `<div class="qrow">
						<span class="qlab"><span class="swatch" style="background:${STATUS_META[statusKey].color}"></span>${stLabel(statusKey)}</span>
						<span class="qstep">
							<button class="qbtn" data-qadj="dec" data-qs="${esc(statusKey)}"${val > 0 ? '' : ' disabled'} aria-label="minus">−</button>
							<span class="qval">${val}</span>
							<button class="qbtn" data-qadj="inc" data-qs="${esc(statusKey)}"${canInc ? '' : ' disabled'} aria-label="plus">+</button>
						</span>
					</div>`
				}
				let h = `<div class="sheet-lab">${t('setAll')}</div>`
				h += `<div class="opt-grid">${STATUS_ORDER.map((s) => optHtml(s, s === cur, '', true)).join('')}</div>`
				h += `<div class="sheet-lab">${t('splitQty')}</div>`
				h += `<div class="qalloc">`
				h += step('Purchased', boughtN)
				h += step('Out of Stock', noStockN)
				h += `<div class="qrow muted"><span class="qlab"><span class="swatch" style="background:${STATUS_META.Pending.color}"></span>${stLabel('Pending')}</span><span class="qval">${restN}</span></div>`
				h += `</div>`
				$('sheetOpts').innerHTML = h
			}
			function openSheet(rowsArr, compKey) {
				rememberFocus()
				const field = 'status_' + compKey
				// Only orders that actually carry this component are addressable.
				const relevant = rowsArr.filter((r) => r['has_' + compKey])
				sheetTarget = { rows: relevant.length ? relevant : rowsArr, compKey, field }
				renderSheet()
				$('sheetBg').classList.add('open')
				Overlay.opened($('sheet'))
				const first = $('sheetOpts').querySelector('.opt')
				if (first) first.focus()
			}
			function closeSheet(fromPop) {
				if (!$('sheetBg').classList.contains('open')) return
				$('sheetBg').classList.remove('open')
				sheetTarget = null
				restoreFocus()
				Overlay.closed(fromPop)
			}

			// ── Price editor ─────────────────────────────────────────────────────
			let priceTarget = null // { kind, key, part }
			const costField = (part) => (part === 'grip' ? 'cost_grip' : 'cost_case')
			// Apply a saved cost to every matching line in memory. A product-component
			// cost is shared by all orders of that title; a charm cost by all lines of
			// that code.
			function applyCostLocally(kind, key, cost, part) {
				if (kind === 'product') {
					const tn = normTitle(key)
					const f = costField(part)
					ROWS.forEach((r) => {
						if (normTitle(r.title) === tn) r[f] = cost
					})
				} else {
					const cd = String(key || '').trim()
					ROWS.forEach((r) => {
						if (String(r.charm_code || '').trim() === cd) r.charm_cost = cost
					})
					// Charm subtotals read from the (cached) aggregate objects, so keep them
					// in sync too — otherwise the stall total lags behind the chip. Covers
					// charm-stall groups AND charms merged into a supplier stop.
					LAST_GROUPS.forEach((g) => {
						for (const a of [...(g.aggs || []), ...(g.charmAggs || [])]) {
							if (String(a.charm_code || '').trim() === cd) a.charm_cost = cost
						}
					})
				}
			}
			// Recompute + patch ONE group's subtotal chip in place (insert / update /
			// remove as the total crosses zero).
			function updateGroupSubtotal(groupEl, g) {
				const head = groupEl.querySelector('.ghead')
				if (!head) return
				const st = groupSubtotal(g)
				let el = head.querySelector('.gtotal')
				if (st.sum <= 0) {
					if (el) el.remove()
					return
				}
				const text = money(st.sum) + (st.anyUnpriced ? '+' : '')
				if (el) {
					el.textContent = text
					return
				}
				el = document.createElement('span')
				el.className = 'gtotal'
				el.textContent = text
				head.insertBefore(el, head.querySelector('.gcount'))
			}
			// Patch every price chip a cost change touches — plus the affected stall
			// subtotals — WITHOUT rebuilding the list (no flash, keeps scroll + any
			// open interaction). Costs are shared by normalised title / charm code, so
			// we match the whole equivalence class, not one exact chip.
			function patchPricesLocally(kind, key, cost, part) {
				const cleared = cost == null || cost === ''
				const setChip = (chip) => {
					const qty = Number(chip.dataset.qty) || 1
					const wrap = chip.querySelector('.pvwrap')
					if (!wrap) return
					if (cleared) {
						chip.classList.add('unset')
						wrap.innerHTML = `<span class="pv">${t('setPrice')}</span>`
					} else {
						chip.classList.remove('unset')
						const per = qty > 1 ? `<span class="price-per">${money(cost)}×${qty}</span>` : ''
						wrap.innerHTML = `<span class="pv">${money(Number(cost) * qty)}</span>${per}`
					}
				}
				if (kind === 'product') {
					const tn = normTitle(key)
					const p = part === 'grip' ? 'grip' : 'case'
					document.querySelectorAll('.price[data-kind="product"][data-part="' + p + '"]').forEach((chip) => {
						if (normTitle(chip.dataset.title || '') === tn) setChip(chip)
					})
				} else {
					const cd = String(key || '').trim()
					document.querySelectorAll('.price[data-kind="charm"]').forEach((chip) => {
						if (String(chip.dataset.code || '').trim() === cd) setChip(chip)
					})
				}
				document.querySelectorAll('.group[data-gidx]').forEach((groupEl) => {

			function openPriceSheet(ds) {

			async function savePrice(clear) {
				if (!priceTarget) return
				const { kind, key, part } = priceTarget
				let cost = null
				if (!clear) {
					const raw = $('priceInput').value.trim()
					if (raw === '') {

				// durably. The write survives a dead zone / crash exactly like a status
				// change, so a price entered on the shop floor is never lost.
				applyCostLocally(kind, key, cost, part)
				patchPricesLocally(kind, key, cost, part)

			// ── "Same product" merge ─────────────────────────────────────────────
			// The residual the automatic matcher provably cannot reach: one physical
			// product listed by two shops with completely different photos. Perceptual
			// hashes of those photos are ~50% apart (indistinguishable from unrelated
			// products), and titles don't separate them either, so guessing would either
			// miss these or fuse genuinely different designs. The shopper standing at
			// the stall IS the sensor — this records their judgement durably
			// (product_merges) so the two orders become one card for good.
			let mergeTarget = null // { cardId, listingIds, candidates: [{cardId, listingIds}] }
			const mergePicked = new Set() // candidate cardIds selected in the open sheet

			// Distinct phone models a card still has to buy — the secondary cue (after
			// the photo) that tells two similar-looking cards apart.
			function cardModels(lines) {
				const models = []
				for (const r of lines) {
					const m = String(r.phone_model || '').trim()
					if (m && !models.includes(m)) models.push(m)
				}
				return models
			}
			function mergeCandHtml(cardId, lines, opts = {}) {
				const r0 = lines[0]
				const models = cardModels(lines)
				const thumb = r0.image_url
					? `<img class="mthumb" loading="lazy" decoding="async" referrerpolicy="no-referrer" src="${esc(r0.image_url)}" alt="" />`
					: `<div class="mthumb thumb ph"></div>`
				const sub = models.length ? esc(models.join(' · ')) : esc(r0.style || '')
				const cls = opts.anchor ? 'mcand anchor' : 'mcand' + (mergePicked.has(cardId) ? ' sel' : '')
				const attrs = opts.anchor ? '' : ` data-mcand="${cardId}"`
				const tick = opts.anchor ? '' : '<span class="mtick"></span>'
				return `<button type="button" class="${cls}"${attrs}>
					${thumb}
					<span class="mtext"><span class="mtitle">${esc(r0.title || '')}</span>${sub ? `<span class="msub">${sub}</span>` : ''}</span>
					${tick}
				</button>`
			}
			function renderMergeSheet() {
				if (!mergeTarget) return
				const anchor = PCARD.get(mergeTarget.cardId)
				$('mergeTitle').textContent = t('mergeTitle')
				$('mergeHint').textContent = t('mergeHint')
				$('mergeAnchor').innerHTML = anchor ? `<div class="sheet-lab">${t('mergeThis')}</div>` + mergeCandHtml(mergeTarget.cardId, anchor.lines, { anchor: true }) : ''
				$('mergeListLab').textContent = mergeTarget.candidates.length ? t('mergePick') : ''
				$('mergeList').innerHTML = mergeTarget.candidates.length
					? mergeTarget.candidates.map((c) => mergeCandHtml(c.cardId, c.lines)).join('')
					: `<div class="merge-empty">${t('mergeNone')}</div>`
				$('mergeCancel').textContent = t('cancel')
				const save = $('mergeSave')
				save.textContent = t('mergeDo')
				save.disabled = mergePicked.size === 0
				const split = $('mergeSplit')
				split.textContent = t('mergeSplit')
				split.style.display = mergeTarget.linked ? '' : 'none'
			}
			function openMergeSheet(cardId) {
				const card = PCARD.get(cardId)
				if (!card) return
				const listingIds = cardListingIds(card.lines)
				if (!listingIds.length) return
				const candidates = card.siblings
					.map((id) => {
						const sib = PCARD.get(id)
						return sib ? { cardId: id, lines: sib.lines, listingIds: cardListingIds(sib.lines) } : null
					})
					.filter((c) => c && c.listingIds.length)
					// Most plausible first — a convenience ordering only (the photos, shown
					// large above, are what the shopper actually decides on).
					.sort((a, b) => mergeRank(card.lines[0], b.lines[0]) - mergeRank(card.lines[0], a.lines[0]))
				mergePicked.clear()
				mergeTarget = { cardId, listingIds, candidates, linked: listingIds.some((id) => MANUAL_MERGE.has(id)) }
				rememberFocus()
				renderMergeSheet()
				$('mergeBg').classList.add('open')
				Overlay.opened($('mergeSheet'))
			}
			function closeMergeSheet(fromPop) {
				if (!$('mergeBg').classList.contains('open')) return
				$('mergeBg').classList.remove('open')
				mergeTarget = null
				mergePicked.clear()
				restoreFocus()
				Overlay.closed(fromPop)
			}

			// ── Supplier prep sheet (WeChat 备货清单) ────────────────────────────
			let prepState = null // { prep, blob, objectUrl, busy }
			function revokePrepUrl() {
				if (prepState && prepState.objectUrl) {
					try {
						URL.revokeObjectURL(prepState.objectUrl)
					} catch {}
				}
			}
			function zhBuildingOf(g) {
				const lab = g && g.loc && g.loc.buildingLabel
				if (!lab) return ''
				return String(lab.zh || lab.en || '').trim()
			}
			function buildPrepForGroup(g) {
				const Prep = window.ShopSupplierPrep
				if (!Prep || typeof Prep.buildSupplierPrep !== 'function') return null
				return Prep.buildSupplierPrep(g, {
					buildingLabel: zhBuildingOf(g),
					stallCode: (g.loc && g.loc.code) || '',

			async function generatePrepImage() {
				const Prep = window.ShopSupplierPrep
				if (!prepState || !prepState.prep || prepState.prep.empty) return
				if (!Prep || typeof Prep.renderPrepImage !== 'function') {
					$('prepPreview').innerHTML = `<div class="prep-err">${esc(t('prepNoModule'))}</div>`
					setPrepButtons(false)
					return
				}
				prepState.busy = true
				setPrepButtons(false)
				$('prepPreview').innerHTML = `<div class="prep-busy">${esc(t('prepBuilding'))}</div>`
				try {
					const blob = await Prep.renderPrepImage(prepState.prep)
					revokePrepUrl()
					const objectUrl = URL.createObjectURL(blob)
					prepState.blob = blob
					prepState.objectUrl = objectUrl

					$('prepShare').disabled = true
					$('prepSave').disabled = true
					$('prepCopy').disabled = false

				$('prepHint').textContent = t('prepHint')
				$('prepShare').textContent = t('prepShareBtn')
				$('prepSave').textContent = t('prepSaveBtn')
				$('prepCopy').textContent = t('prepCopyBtn')

				generatePrepImage()
			}
			function closePrepSheet(fromPop) {
				if (!$('prepBg').classList.contains('open')) return

			async function sharePrepImage() {
				const Prep = window.ShopSupplierPrep
				if (!prepState || !prepState.blob || !Prep) return

				const result = await Prep.sharePrepBlob(prepState.blob, prepState.prep.filename, text)
				if (result === 'shared') {
					toast(t('prepShared'))
					haptic(12)
					return
				}

			async function savePrepImage() {
				const Prep = window.ShopSupplierPrep
				if (!prepState || !prepState.blob || !Prep) return
				if (Prep.isIOS && Prep.isIOS()) toast(t('prepSavePhotosHint'))
				const result = await Prep.savePrepToPhotos(prepState.blob, prepState.prep.filename)
				if (result === 'aborted') return
				if (result === 'saved') {
					toast(t('prepPhotosSaved'))
					haptic(12)
					return
				}
				if (result === 'longpress') {
					if (prepState.objectUrl) openZoom(prepState.objectUrl)
					toast(t('prepLongPressSave'))
					haptic(8)
					return
				}
				if (result === 'downloaded') {
					toast(t('prepSaved'))
					haptic(10)
					return
				}
				if (prepState.objectUrl) {
					openZoom(prepState.objectUrl)
					toast(t('prepLongPressSave'))
				}
			}
			async function copyPrepText() {
				const Prep = window.ShopSupplierPrep
				if (!prepState || !prepState.prep || !Prep) return
				const text = Prep.prepToText(prepState.prep)
				try {
					if (navigator.clipboard && navigator.clipboard.writeText) {
						await navigator.clipboard.writeText(text)
					} else {
						const ta = document.createElement('textarea')
						ta.value = text
						ta.setAttribute('readonly', '')
						ta.style.position = 'fixed'
						ta.style.opacity = '0'
						document.body.appendChild(ta)
						ta.select()
						document.execCommand('copy')
						ta.remove()
					}
					toast(t('prepCopied'))
					haptic(8)
				} catch {
					toast(t('prepCopyFail'))
				}
			}

			// Jaccard overlap of the two titles' distinctive words (phone models, format
			// words and generic gift phrasing stripped) — mirrors the server's ordering
			// helper closely enough to rank a short list.
			const MERGE_STOPWORDS = new Set(
				('iphone pro max plus se mini ultra magsafe 17 16 15 14 13 12 11 xr xs x 8 7 for her him with and the of w case cover phone gift set').split(' '),
			)
			function mergeRank(a, b) {
				const toks = (s) =>
					new Set(
						String(s || '')
							.toLowerCase()
							.replace(/[^a-z0-9]+/g, ' ')
							.trim()
							.split(/\s+/)
							.filter((w) => w.length > 1 && !MERGE_STOPWORDS.has(w)),
					)
				const A = toks(a && a.title)
				const B = toks(b && b.title)
				if (!A.size || !B.size) return 0
				let inter = 0
				for (const w of A) if (B.has(w)) inter++
				return inter / (A.size + B.size - inter)
			}
			// Merging changes which lines share a card, so — unlike a status/price edit —
			// it can't be applied optimistically or replayed from the offline queue: the
			// server owns the resulting grouping. We therefore require a live round-trip
			// and re-pull the route, which is also what tells every other device.
			async function saveMerge() {
				if (!mergeTarget || !mergePicked.size) return
				const ids = new Set(mergeTarget.listingIds)
				for (const cardId of mergePicked) {
					const c = mergeTarget.candidates.find((x) => x.cardId === cardId)
					if (c) c.listingIds.forEach((id) => ids.add(id))
				}
				closeMergeSheet()
				await postMerge('POST', { listing_ids: [...ids] }, t('merged'))
			}
			async function splitMerge() {
				if (!mergeTarget) return
				const ids = mergeTarget.listingIds
				closeMergeSheet()
				await postMerge('DELETE', { listing_ids: ids }, t('mergeSplitDone'))
			}
			async function postMerge(method, body, okMsg) {
				try {
					const r = await fetch('/api/route/product-merges', {
						method,
						credentials: 'same-origin',
						headers: { 'Content-Type': 'application/json' },
						body: JSON.stringify(body),
					})
					if (r.status === 401) return void leaveTo('/login')
					if (!r.ok) throw new Error('HTTP ' + r.status)
					haptic(12)
					toast(okMsg)
					await load(false)
				} catch {
					toast(navigator.onLine === false ? t('mergeOffline') : t('mergeFail'))
				}
			}

			// ── Full-screen image zoom ───────────────────────────────────────────
			function openZoom(src) {
				// Listing photos are proxied same-origin; ask for a sharper variant on zoom.
				// Charm / substitution / style endpoints are already full-res from our server.
				// Blob URLs (supplier prep export) pass through unchanged.
				rememberFocus()
				let zoomSrc = src
				if (typeof src === 'string' && src.startsWith('blob:')) {
					zoomSrc = src
				} else if (src.includes('/api/route/listing-image/')) {
					try {
						const u = new URL(src, location.origin)
						u.searchParams.set('w', '570')
						zoomSrc = u.pathname + '?' + u.searchParams.toString()
					} catch {
						zoomSrc = src.replace(/([?&])w=\d+/, '$1w=570')
					}
				} else if (/il_300x300\./.test(src)) {
					zoomSrc = src.replace('il_300x300.', 'il_570xN.')
				}
				$('zoomImg').src = zoomSrc
				$('zoomBg').classList.add('open')
				Overlay.opened($('zoomBg'))
			}
			function closeZoom(fromPop) {
				if (!$('zoomBg').classList.contains('open')) return
				$('zoomBg').classList.remove('open')
				$('zoomImg').removeAttribute('src')
				restoreFocus()
				Overlay.closed(fromPop)
			}

			// ── Event delegation ─────────────────────────────────────────────────
			const rowFromEl = (el) => rowIndex.get(el.dataset.rid + '\x00' + el.dataset.ik)
			// Resolve the target line(s) for a button: a merged charm (data-agg) maps
			// to every line it covers; a normal button maps to its single line.
			const rowsFromEl = (el) => {
				if (el.dataset.agg) return AGG.get(el.dataset.agg) || []
				const r = rowFromEl(el)
				return r ? [r] : []
			}
			// Brief "settle" window after a completion that mutates the list. Marking
			// an item bought removes/shrinks its card (showDone is off) and everything
			// below slides UP under the finger, so a touchscreen's stray/echoed follow-up
			// tap lands on whatever chip reflowed into that spot. Without this guard that
			// tap fell through and popped open a NEIGHBOUR's status picker — the reported
			// "need to click twice / it opens after I complete an order" glitch. During
			// the window we ignore only picker-opening (.comp) taps; mark-bought taps are
			// still honoured so rapid multi-item shopping is never slowed.
			let listSettleUntil = 0
			const LIST_SETTLE_MS = 350
			const armListSettle = () => {
				listSettleUntil = performance.now() + LIST_SETTLE_MS
			}
			$('list').addEventListener('click', (e) => {
				// Tap a photo → open it full-screen so the design is easy to read.
				const thumb = e.target.closest('img.thumb')
				if (thumb && thumb.getAttribute('src')) {
					openZoom(thumb.getAttribute('src'))
					return
				}
				const priceEl = e.target.closest('.price')
				if (priceEl) {
					openPriceSheet(priceEl.dataset)
					return
				}
				const mergeEl = e.target.closest('.pmerge')
				if (mergeEl) {
					openMergeSheet(mergeEl.dataset.pcard)
					return
				}
				const comp = e.target.closest('.comp')
				if (comp) {
					// Reflow guard (see armListSettle): swallow a picker-opening tap that
					// arrives in the settle window right after a completion — it's almost
					// certainly a stray/echoed tap on a neighbour that slid under the
					// finger, not a deliberate request to open this chip's status picker.
					if (performance.now() < listSettleUntil) return
					const meta = COMPONENTS.find((c) => c.key === comp.dataset.c)
					const rows = rowsFromEl(comp).filter((r) => !meta || r[meta.flag])
					if (rows.length) openSheet(rows, comp.dataset.c)
					return
				}
				const all = e.target.closest('.markall')
				if (all) {
					if (all.dataset.exid) {
						markExchanged(Number(all.dataset.exid))
						armListSettle()
						return
					}
					const rows = rowsFromEl(all)
					if (rows.length) {
						if (all.dataset.comp) {
							// Component-scoped card (case row / grip batch): mark ONLY that
							// component bought, leaving the order's other component untouched.
							const comp = COMPONENTS.find((c) => c.key === all.dataset.comp)
							if (comp) setStatusRows(rows.filter((r) => r[comp.flag]), all.dataset.comp, 'Purchased')
						} else {
							markSection(rows, all.dataset.sec)
						}
						// Card just completed → the list reflows; block a stray follow-up
						// tap from falling through onto a neighbour's picker.
						armListSettle()
					}
					return
				}
				// "Share with supplier" — open the WeChat prep sheet (must run before
				// the header collapse handler below).
				const share = e.target.closest('.gshare')
				if (share) {
					const gidx = Number(share.dataset.gidx)
					openPrepSheet(gidx)
					return
				}
				// "Locate on map" pin → open the map focused on this stall (must run
				// before the header collapse handler below).
				const loc = e.target.closest('.glocate')
				if (loc) {
					openMapAt(loc.dataset.stall)
					return
				}
				// Tap a stall header to collapse / expand it.
				const head = e.target.closest('.ghead')
				if (head) {
					const wrap = head.closest('.group')
					const g = wrap && LAST_GROUPS[Number(wrap.dataset.gidx)]
					if (g) {
						collapseOverride.set(g.sortKey, !isCollapsed(g))
						render()
					}
				}
			})
			$('sheetBg').addEventListener('click', (e) => {
				if (e.target === $('sheetBg')) return closeSheet()
				// Quantity split: move ONE unit into / out of a status. Fungible units,
				// so we just pick any suitable line (prefer a still-"to buy" one on inc).
				const qbtn = e.target.closest('.qbtn')
				if (qbtn && sheetTarget && !qbtn.disabled) {
					const { rows, field, compKey } = sheetTarget
					const status = qbtn.dataset.qs
					if (qbtn.dataset.qadj === 'inc') {
						let line = rows.find((r) => (r[field] || 'Pending') === 'Pending' && (r[field] || 'Pending') !== status)
						if (!line) line = rows.find((r) => (r[field] || 'Pending') !== status)
						if (line) setStatusRows([line], compKey, status, { noAdvance: true })
					} else {
						const line = rows.find((r) => (r[field] || 'Pending') === status)
						if (line) setStatusRows([line], compKey, 'Pending', { noAdvance: true })
					}
					renderSheet()
					return
				}
				const opt = e.target.closest('.opt')
				if (!opt || !sheetTarget) return
				const s = opt.dataset.s
				{
					// Set-all: one decision for every unit, then close. (Partial edits use
					// the quantity split above; there are no per-order buttons any more.)
					setStatusRows(sheetTarget.rows, sheetTarget.compKey, s)
					closeSheet()
					// Closing the sheet re-exposes the (reflowed) list; arm the same guard
					// so an echoed tap can't immediately re-open a picker underneath.
					armListSettle()
				}
			})
			$('priceBg').addEventListener('click', (e) => {

			$('priceSave').addEventListener('click', () => savePrice(false))
			$('priceClear').addEventListener('click', () => savePrice(true))

			$('mergeBg').addEventListener('click', (e) => {

				if (!cand || !mergeTarget) return

				else mergePicked.add(id)

			})
			$('mergeCancel').addEventListener('click', () => closeMergeSheet())
			$('mergeSave').addEventListener('click', () => saveMerge())
			$('mergeSplit').addEventListener('click', () => splitMerge())

			$('prepBg').addEventListener('click', (e) => {
				if (e.target === $('prepBg')) closePrepSheet()
			})
			$('prepShare').addEventListener('click', () => sharePrepImage())
			$('prepSave').addEventListener('click', () => savePrepImage())
			$('prepCopy').addEventListener('click', () => copyPrepText())

			$('zoomBg').addEventListener('click', () => closeZoom())

			document.addEventListener('keydown', (e) => {
				if (e.key === 'Escape') closeTopOverlay(false)
			})

			// ── Navigation drawer wiring ─────────────────────────────────────────
			$('menuBtn').addEventListener('click', openDrawer)

					stage.classList.add('grabbing')
				} else if (mPointers.size === 2) {
					const [a, b] = [...mPointers.values()]
					mPinchDist = Math.hypot(a.x - b.x, a.y - b.y)
					mPinchMid = stagePt((a.x + b.x) / 2, (a.y + b.y) / 2)

					const [a, b] = [...mPointers.values()]
					const dist = Math.hypot(a.x - b.x, a.y - b.y)
					const mid = stagePt((a.x + b.x) / 2, (a.y + b.y) / 2)
					if (mPinchDist > 0) {
						mapZoomAt(dist / mPinchDist, mid.x, mid.y)
						if (mPinchMid) {

							mTy += mid.y - mPinchMid.y

					mPinchDist = dist
					mPinchMid = mid

					mPinchMid = null

			$('refreshBtn').addEventListener('click', () => load(true))

				// (still offline), make the shopper explicitly confirm before signing out
				// (logging out clears the session the queued writes need to replay).
				if (pending.size) {
					await flush()

			})
			// ── Data loading ─────────────────────────────────────────────────────
			async function whoAmI() {
				try {
					const r = await fetch('/api/auth/me', { credentials: 'same-origin' })
					if (r.ok) {
						const d = await r.json()
						ME = d.user || null
						if (d.authEnabled && !d.role) leaveTo('/login')
						// Show "back to dashboard" for the owner, and for a packer ONLY
						// when on the office LAN (so they can return to Packing Mode). Over
						// the public tunnel a packer stays shopping-only, so it's hidden.
						const onLan = /^(localhost|127\.|\[?::1\]?|192\.168\.|10\.|172\.(1[6-9]|2\d|3[01])\.|169\.254\.)/.test(location.hostname)
						if (d.role === 'owner' || (d.role === 'packer' && onLan)) $('dashBtn').style.display = ''
					}
				} catch {}
			}

			// Re-assert every QUEUED-but-unacknowledged status write over freshly-fetched
			// server rows. A queued op is state the shopper has already been shown and the
			// server has not confirmed yet, so it outranks the server's copy until it
			// drains — the standard optimistic-UI rule.
			//
			// This is what makes a restart safe. On boot with a queue, the route GET
			// resolves long before the replay POSTs do, so without this the list renders
			// the server's PRE-replay state and shows already-bought items as still to
			// buy — the double-buy the durable queue exists to prevent. reconcile() can't
			// cover it either: it deliberately bails while `pending` is non-empty, so the
			// stale list would stand until the queue drained AND the next 45 s tick came
			// round. Applying the patches locally fixes the render immediately, whether or
			// not the network is even up.
			//
			// Only assign (status) entries are replayed here: they are what drives the
			// buy/don't-buy decision. Cost entries carry their own absolute price and are
			// re-sent by the queue, but a stale price never causes a duplicate purchase.
			function reapplyPending(rows = ROWS) {
				if (!pending.size) return
				const index = rows === ROWS ? rowIndex : new Map(rows.map((row) => [keyOf(row), row]))
				for (const entry of pending.values()) {
					if (!entry || entry.url !== ShopSync.ASSIGN_URL || !entry.body) continue
					const row = index.get(entry.body.receipt_id + '\x00' + entry.body.item_key)
					if (!row) continue
					for (const f of ['status_case', 'status_grip', 'status_charm']) {
						if (entry.body[f] != null) row[f] = entry.body[f]
					}
				}
			}

			function recoverInvalidatedLoad(showSpinner) {
				if (!showSpinner) return
				if (hasRouteSnapshot) {
					render()
					return
				}

				// retry. This avoids one aborted GET per ACK when many offline taps replay.
				Promise.resolve(flush()).finally(() => {
					if (!foregroundRouteFetch) load(true)
				})
			}

			async function load(showSpinner) {
				if (showSpinner) $('list').innerHTML = `<div class="state"><div class="spinner"></div>${t('loading')}</div>`
				const fetchToken = beginRouteFetch('load')
				try {
					const r = await fetch('/api/shop/route', {
						credentials: 'same-origin',
						cache: 'no-store',
						signal: fetchToken.controller.signal,
					})
					if (r.status === 401) {
						leaveTo('/login')
						return
					}
					if (r.status === 403) {
						$('list').innerHTML = `<div class="state"><div class="state-title">${t('cantOpen')}</div></div>`
						return
					}
					if (!r.ok) throw new Error('HTTP ' + r.status)
					const data = await r.json()
					// A tap, write ACK, or newer route request happened while this was
					// in flight. Its payload predates that event and is unsafe to render.
					if (!routeFetchIsCurrent(fetchToken)) {
						recoverInvalidatedLoad(showSpinner)
						return
					}
					ROWS = data.rows || []
					EXCHANGES = data.exchanges || []
					hasRouteSnapshot = true
					MANUAL_MERGE = new Set((data.manual_merge_listings || []).map(Number))
					rowIndex.clear()

					}
				} finally {
					finishRouteFetch(fetchToken)
				}
			}

			// ── Self-healing reconciliation ──────────────────────────────────────
			// SSE only PATCHES lines we already hold; it never adds newly-synced
			// orders and can't repair a stale set the client latched onto during a
			// transient server/sync window. So — like every serious real-time app —
			// we periodically re-pull the authoritative route and on app focus / SSE
			// (re)connect, reconciling silently. Comparing the fetched signature to the
			// CURRENT rows means an unchanged route (incl. our own already-saved edits)
			// costs one fetch and ZERO re-render (no flicker); we never reconcile
			// mid-edit (pending saves) or over an open overlay.
			function routeSig(rows, exchanges) {
				const parts = []
				for (const r of rows) {
					parts.push(
						r.receipt_id +
							':' +
							r.item_key +
							':' +
							(r.status_case || '') +
							(r.status_grip || '') +
							(r.status_charm || '') +
							':' +
							(r.charm_code || '') +
							':' +
							(r.cost_case ?? '') +
							'/' +
							(r.cost_grip ?? '') +
							'/' +
							(r.charm_cost ?? '') +
							// Product identity is part of the signature: a merge changes which
							// lines share a card without changing any line's own fields, and
							// that MUST still trigger a re-render.
							':' +
							(r.product_key || ''),
					)
				}
				parts.push('x:' + (exchanges || []).map((e) => e.exchange_id).join(','))
				return rows.length + '|' + parts.join('|')
			}
			function anyOverlayOpen() {

					$('priceBg').classList.contains('open') ||
					$('mergeBg').classList.contains('open') ||
					$('prepBg').classList.contains('open') ||
					$('zoomBg').classList.contains('open') ||
					mapOpen() ||
					drawerOpen()

			}
			async function reconcile() {
				// Safe-to-refresh guards: foreground only, no unsaved edits to clobber,
				// and never yank the list out from under an open sheet/map/drawer.
				if (document.hidden || pending.size || flushing || foregroundRouteFetch || anyOverlayOpen()) return
				const fetchToken = beginRouteFetch('reconcile')
				try {
					const r = await fetch('/api/shop/route', {
						credentials: 'same-origin',
						cache: 'no-store',
						signal: fetchToken.controller.signal,

					if (r.status === 401) return leaveTo('/login')
					if (!r.ok) return
					const data = await r.json()

					const exchanges = data.exchanges || []
					if (!routeFetchIsCurrent(fetchToken)) return

			// HARD-depend on it: if SSE doesn't open fast, or drops, we quietly poll

			let sse = null

			let sseRetryTimer = null
			let pollTimer = null

			// through reconcile() so it stays guard-aware (won't yank the UI mid-edit or
			// under an open sheet) and never flashes when nothing actually changed.
			function scheduleRouteRefetch() {

			}

				try {

					scheduleReconnect()

				}

				}
					// A route-membership/content change we can't express as a per-line

					// fresh list (debounced to coalesce bursts).
					if (msg.type === 'refresh') {

					// is keyed by op-id (assign\0<receipt>\0<item>), NOT the rowIndex key.
					if (pending.has(ShopSync.assignOpId(msg.receipt_id, msg.item_key))) return
					const r = rowIndex.get(k)
					if (!r) {
						// A line we don't have yet — it just entered the route (e.g. a newly
						// switched or un-held order). Deliver on the "refresh soon" promise:
						// pull a fresh list so it appears, instead of silently dropping it.
						scheduleRouteRefetch()
						return
					}
					const before = fullyPurchased(r)
					r.status_case = msg.status_case
					r.status_grip = msg.status_grip
					r.status_charm = msg.status_charm
					if (msg.charm_code != null) r.charm_code = msg.charm_code
					if (msg.charm_shop != null) r.charm_shop = msg.charm_shop

					patchRowEverywhere(r)
					if (msg.by && msg.by !== ME) {

					}

					sseOpen = false
					clearTimeout(sseOpenTimer)
					try {
						sse.close()
					} catch {}

			// Keep sticky stall headers pinned exactly below the app header, whose
			// height changes with language / wrapping / rotation. A ResizeObserver
			// tracks it live so the offset is always correct (no magic numbers).
			function syncStickTop() {
				const h = document.querySelector('header')

			}

			// back into the in-memory mirror and drain — this is what guarantees a
			// shopped tap is never silently lost across a restart.
			async function hydrateQueue() {
				if (!(window.ShopSync && ShopSync.hasIDB())) return
				try {
					const entries = await ShopSync.getAll()
					for (const e of entries) if (e && e.id) pending.set(e.id, e)

						requestBgSync()

				syncStickTop()
				// AWAITED, and before load(): this only reads IndexedDB (fast — the drain it
				// kicks off is not awaited), and `pending` has to be populated before the
				// first load so reapplyPending() can keep unacknowledged taps on screen
				// instead of letting the server's pre-replay state overwrite them.
				await hydrateQueue()
				if (window.ResizeObserver) new ResizeObserver(syncStickTop).observe(document.querySelector('header'))
				window.addEventListener('resize', syncStickTop)
				// Start real-time + identity checks in PARALLEL with loading the list,
				// instead of waiting for each round-trip in series — faster first paint.
				whoAmI()
				connectSSE()
				loadFloorMap()
				await load(true)
				if ('serviceWorker' in navigator) {
					navigator.serviceWorker.register('/shop-sw.js', { scope: '/shop' }).catch(() => {})
				}
				// Self-heal: periodically reconcile with the server even while SSE is
				// live (SSE never adds new orders), so the counts can never silently
				// drift from the truth. Foreground reconciliation is registered once
				// above, alongside the queue drain.
				setInterval(reconcile, 45000)
			}
			boot()
		</script>
	</body>
</html>
