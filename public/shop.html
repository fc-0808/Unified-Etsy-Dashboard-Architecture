				const groups = new Map()
				for (const r of rows) {
					const shop = (r.charm_shop || '').trim()
					const key = shop ? shop.toLowerCase() : '\uffff'
					if (!groups.has(key)) groups.set(key, { shop, stall: (r.charm_stall || '').trim(), floor: r.charm_floor, sortKey: key, rows: [] })
					groups.get(key).rows.push(r)
				}
				return [...groups.values()].sort((a, b) => (a.sortKey < b.sortKey ? -1 : a.sortKey > b.sortKey ? 1 : 0))
			}

			function applySearch(rows) {
				if (!searchQ) return rows
				const q = searchQ.toLowerCase()
				return rows.filter((r) =>
					[r.title, r.phone_model, r.style, r.charm_code, r.supplier_shop, r.supplier_stall, r.charm_shop, r.have_model, r.need_model].some((v) =>
						String(v || '').toLowerCase().includes(q),
					),
				)
			}

			function render() {
				renderSummary()
				const box = $('list')
				if (!ROWS.length && !EXCHANGES.length) {
					LAST_GROUPS = []
					box.innerHTML = `<div class="state"><div class="state-title">${t('nothing')}</div></div>`
					maybeRenderTree()
					return
				}

				// Section 1 — Cases & Grips, MERGED with exchanges at the same stall.
				// A shopper standing at a supplier sees, in one place, what to BUY and
				// what to SWAP there — no need to backtrack for exchanges later.
				const merged = new Map()
				const ensureGroup = (r) => {
					const k = supKeyOf(r)
					if (!merged.has(k)) {
						const shop = (r.supplier_shop || '').trim()
						const stall = (r.supplier_stall || '').trim()
						merged.set(k, { floor: r.supplier_floor, shop, stall, matched: !!(shop || stall), rows: [], exRows: [] })
					}
					return merged.get(k)
				}
				let cg = ROWS.filter((r) => r.has_case || r.has_grip)
				cg = applySearch(cg.filter((r) => showDone || !cgDone(r)))
				for (const r of cg) ensureGroup(r).rows.push(r)
				for (const x of applySearch(EXCHANGES)) ensureGroup(x).exRows.push(x)
				const cgGroups = [...merged.keys()]
					.sort((a, b) => (a < b ? -1 : a > b ? 1 : 0))
					.map((k) => ({ ...merged.get(k), section: 'cg', comps: CASE_GRIP, doneFn: cgDone, sortKey: 'cg\x01' + k }))

				// Section 2 — Charms, grouped by charm stall, then merged by charm code.
				let ch = ROWS.filter((r) => r.has_charm)
				ch = applySearch(ch.filter((r) => showDone || !charmDone(r)))
				const chGroups = groupCharmRows(ch).map((g) => ({ ...g, section: 'charm', comps: CHARM, doneFn: charmDone, sortKey: 'ch\x01' + g.sortKey, aggs: aggregateCharms(g.rows) }))

				// Register every merged charm so its buttons can act on all its lines.
				AGG.clear()
				MODEL_AGG_SEQ = 0
				let ac = 0
				for (const g of chGroups) for (const a of g.aggs) { a.aggId = 'a' + ac++; AGG.set(a.aggId, a.rows) }

				LAST_GROUPS = [...cgGroups, ...chGroups]

				if (!cgGroups.length && !chGroups.length) {
					box.innerHTML = `<div class="state"><div class="state-title">${searchQ ? t('noMatches') : t('allBought')}</div></div>`
					maybeRenderTree()
					return
				}

				const prevScroll = window.scrollY
				box.innerHTML = renderSection(t('secCG'), cgGroups, 0, 'cg') + renderSection(t('secCharm'), chGroups, cgGroups.length, 'charm')
				maybeRenderTree()
				// Keep the shopper's place across a re-render (search/collapse/undo) —
				// no jarring jump.
				if (prevScroll > 0) requestAnimationFrame(() => window.scrollTo(0, prevScroll))
			}

			// Items still needing action in a group = unbought lines + open exchanges.
			function groupRemaining(g) {
				const buy = g.rows.filter((r) => !g.doneFn(r)).length
				return buy + ((g.exRows && g.exRows.length) || 0)
			}
			// Amount still to PAY at this stall (sum of unbought line costs). Exchanges
			// are swaps, not purchases, so they're excluded. anyUnpriced flags that some
			// items don't have a price yet (so the shown total is a partial total).
			function groupSubtotal(g) {
				let sum = 0
				let anyUnpriced = false
				if (g.section === 'charm') {
					for (const a of g.aggs || []) {
						if (a.done) continue
						if (a.charm_cost != null) sum += Number(a.charm_cost) * (a.qty || 1)
						else anyUnpriced = true
					}
				} else {
					for (const r of g.rows) {
						if (g.doneFn(r)) continue
						const qty = r.quantity || 1
						if (r.has_case) r.cost_case != null ? (sum += Number(r.cost_case) * qty) : (anyUnpriced = true)
						if (r.has_grip) r.cost_grip != null ? (sum += Number(r.cost_grip) * qty) : (anyUnpriced = true)
					}
				}
				return { sum: Math.round(sum * 100) / 100, anyUnpriced }
			}
			function gtotalHtml(g) {
				const st = groupSubtotal(g)
				if (st.sum <= 0) return ''
				return `<span class="gtotal">${money(st.sum)}${st.anyUnpriced ? '+' : ''}</span>`
			}

			function renderSection(title, groups, baseIdx, kind) {
				if (!groups.length) return ''
				const remaining = groups.reduce((n, g) => n + groupRemaining(g), 0)
				const badge = remaining ? `<span class="section-count">${remaining}</span>` : `<span class="section-count sdone">✓</span>`
				const body = groups.map((g, j) => renderGroup(g, baseIdx + j)).join('')
				return `<div class="section ${kind || ''}"><div class="section-head">${title}${badge}</div>${body}</div>`
			}

			function renderGroup(g, gidx) {
				const remaining = groupRemaining(g)
				const allDone = remaining === 0
				const collapsed = isCollapsed(g)
				const count = allDone ? `<span class="gcount done">✓</span>` : `<span class="gcount">${remaining}</span>`
				const chev = `<span class="gchev">${collapsed ? '▸' : '▾'}</span>`
				const gtotal = gtotalHtml(g)
				// "Locate on map" — only for supplier stalls we can actually point to.
				const locBtn =
					g.section !== 'charm' && g.matched && g.stall && mapHasStall(g.stall)
						? `<button class="glocate" data-stall="${esc(g.stall)}" title="${t('locate')}" aria-label="${t('locate')}"><svg viewBox="0 0 24 24"><path d="M12 21s7-5.6 7-11a7 7 0 1 0-14 0c0 5.4 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/></svg></button>`
						: ''
				let head
				if (g.section === 'charm') {
					const hasFloor = g.floor != null && g.floor !== '' && g.floor !== 999
					head = `<div class="ghead${allDone ? ' gdone' : ''}">
						${hasFloor ? `<span class="floor">${esc(floorLabel(g.floor))}</span>` : ''}
						<span class="shop">${esc(g.shop || t('charmNotSet'))}</span>
						${g.stall ? `<span class="stall">${esc(g.stall)}</span>` : ''}
						${gtotal}${count}${chev}
					</div>`
				} else {
					const hasFloor = g.floor != null && g.floor !== '' && g.floor !== 999
					head = g.matched
						? `<div class="ghead${allDone ? ' gdone' : ''}">
							${hasFloor ? `<span class="floor">${esc(floorLabel(g.floor))}</span>` : ''}
							<span class="shop">${esc(g.shop || '—')}</span>
							${g.stall ? `<span class="stall">${esc(g.stall)}</span>` : ''}
							${locBtn}${gtotal}${count}${chev}
						</div>`
						: `<div class="ghead${allDone ? ' gdone' : ''}">
							<span class="shop">${t('supplierNotSet')}</span>
							${gtotal}${count}${chev}
						</div>`
				}
				let body = ''
				if (!collapsed) {
					let cards
					if (g.section === 'charm') {
						cards = g.aggs.map((a) => charmCardHtml(a)).join('')
					} else {
						cards = renderCgCards(g)
						// Exchanges to swap at THIS same stall, under a small divider so the
						// shopper handles buying and swapping in one visit.
						if (g.exRows && g.exRows.length) {
							cards += `<div class="gsublabel">${t('secEx')}</div>` + g.exRows.map((x) => exCardHtml(x)).join('')
						}
					}
					body = `<div class="gbody">${cards}</div>`
				}
				return `<div class="group${collapsed ? ' collapsed' : ''}" data-gidx="${gidx}">${head}${body}</div>`
			}

			// A group is collapsed if the user explicitly collapsed it, else it
			// auto-collapses once every (visible) line in it is bought.
			function isCollapsed(g) {
				if (collapseOverride.has(g.sortKey)) return collapseOverride.get(g.sortKey)
				// Auto-collapse only when there's nothing left to buy AND nothing to swap.
				return groupRemaining(g) === 0
			}

			// Section-aware group keys + completion (for celebration / auto-scroll).
			function cgGroupKey(r) {
				const shop = (r.supplier_shop || '').trim()
				const stall = (r.supplier_stall || '').trim()
				return 'cg\x01' + (shop || stall ? supplierSortKey(r.supplier_floor, stall, shop) : '\uffff')
			}
			// Exchange → same supplier-location key as the buy list (they're merged).
			const exCgKey = (x) => cgGroupKey(x)
			function charmGroupKey(r) {
				const shop = (r.charm_shop || '').trim()
				return 'ch\x01' + (shop ? shop.toLowerCase() : '\uffff')
			}
			function cgGroupDone(key) {
				const rs = ROWS.filter((r) => (r.has_case || r.has_grip) && cgGroupKey(r) === key)
				const buysDone = rs.length > 0 && rs.every(cgDone)
				// The stall isn't "done" while a swap is still owed there.
				const swapPending = EXCHANGES.some((x) => exCgKey(x) === key)
				return buysDone && !swapPending
			}
			function charmGroupDone(key) {
				const rs = ROWS.filter((r) => r.has_charm && charmGroupKey(r) === key)
				return rs.length > 0 && rs.every(charmDone)
			}

			// ── Navigation drawer (route tree: Section → Floor → Supplier) ───────
			const treeCollapsed = new Set() // tree node ids the user has collapsed
			const drawerOpen = () => $('drawerBg').classList.contains('open')

			// Build the tree from the CURRENTLY rendered groups so leaf → card jumps
			// line up with the DOM (via each group's data-gidx index).
			function buildTree() {
				const cg = { id: 'sec:cg', type: 'section', label: t('secCG'), remaining: 0, floorMap: new Map(), children: [] }
				const charm = { id: 'sec:charm', type: 'section', label: t('secCharm'), remaining: 0, children: [] }
				LAST_GROUPS.forEach((g, gidx) => {
					// Count includes exchanges owed at the stall (they're merged into cg).
					const remaining = groupRemaining(g)
					if (g.section === 'charm') {
						charm.children.push({ type: 'leaf', gidx, label: g.shop || t('charmNotSet'), sub: g.stall || '', remaining })
						charm.remaining += remaining
					} else {
						const hasFloor = g.floor != null && g.floor !== '' && g.floor !== 999
						const fid = cg.id + ':flr:' + (hasFloor ? g.floor : '_')
						let fl = cg.floorMap.get(fid)
						if (!fl) {
							fl = { id: fid, type: 'floor', label: hasFloor ? floorLabel(g.floor) : t('otherFloor'), remaining: 0, children: [] }
							cg.floorMap.set(fid, fl)
							cg.children.push(fl)
						}
						fl.children.push({ type: 'leaf', gidx, label: g.shop || t('supplierNotSet'), sub: g.stall || '', remaining })
						fl.remaining += remaining
						cg.remaining += remaining
					}
				})
				const out = []
				if (cg.children.length) out.push(cg)
				if (charm.children.length) out.push(charm)
				return out
			}

			function treeNodeHtml(node) {
				const badge = (n) => `<span class="${n === 0 ? 'tcount z' : 'tcount'}">${n === 0 ? '✓' : n}</span>`
				if (node.type === 'leaf') {
					const sub = node.sub ? ` <span class="tsub">${esc(node.sub)}</span>` : ''
					return `<div class="tnode"><div class="trow leaf" data-gidx="${node.gidx}">
						<span class="tcaret" style="visibility:hidden">·</span>
						<span class="tlabel">${esc(node.label)}${sub}</span>
						${badge(node.remaining)}
					</div></div>`
				}
				const collapsed = treeCollapsed.has(node.id)
				return `<div class="tnode ${collapsed ? 'collapsed' : ''}">
					<div class="trow ${node.type}" data-toggle="${node.id}">
						<span class="tcaret">▾</span>
						<span class="tlabel">${esc(node.label)}</span>
						${badge(node.remaining)}
					</div>
					<div class="tchildren">${node.children.map(treeNodeHtml).join('')}</div>
				</div>`
			}

			function renderTree() {
				const tree = buildTree()
				const items = tree.reduce((n, s) => n + s.remaining, 0)
				const orders = new Set(ROWS.filter((r) => !fullyPurchased(r)).map((r) => r.receipt_id)).size
				$('drawerTitle').textContent = t('overview')
				$('drawerSub').textContent = `${items} ${t('leftSummary')} · ${ordersN(orders)}`
				$('treeRoot').innerHTML = tree.length ? tree.map(treeNodeHtml).join('') : `<div class="tempty">${t('allBought')}</div>`
			}
			function maybeRenderTree() {
				if (drawerOpen()) renderTree()
				syncMap()
			}

			// ── Overlay focus management (return focus on close, for a11y) ───────
			let lastFocus = null
			function rememberFocus() {
				lastFocus = document.activeElement
			}
			function restoreFocus() {
				try {
					if (lastFocus && lastFocus.focus) lastFocus.focus()
				} catch {}
				lastFocus = null
			}
			// Close whichever overlay is on top (Escape / back-gesture friendly).
			// `fromPop` is true when the close originates from a hardware/browser Back
			// press so the manager knows the history entry is already consumed.
			function closeTopOverlay(fromPop) {
				if ($('zoomBg').classList.contains('open')) return closeZoom(fromPop), true
				if ($('priceBg').classList.contains('open')) return closePriceSheet(fromPop), true
				if ($('sheetBg').classList.contains('open')) return closeSheet(fromPop), true
				if (mapOpen()) return closeMap(fromPop), true
				if (drawerOpen()) return closeDrawer(fromPop), true
				return false
			}

			// ── Overlay lifecycle manager ────────────────────────────────────────
			// One place owns the cross-cutting concerns for every modal overlay
			// (status sheet, price sheet, map, drawer, image zoom):
			//   • Hardware/browser BACK closes the top overlay instead of leaving the
			//     page — via a pushed history entry per open + a single popstate handler.
			//   • The page behind is scroll-locked so the list can't move under a sheet.
			//   • Focus is trapped inside the top overlay (Tab wraps) for keyboard/AT.
			// Design: every OPEN pushes one history entry; a PROGRAMMATIC close consumes
			// it via history.back() (guarded by `suppress` so it doesn't re-close); a
			// BACK press is handled by popstate closing the top overlay directly. Depth
			// stays balanced across any mix of the two paths, including stacked overlays.
			const Overlay = (() => {
				const trapStack = [] // dialog containers, innermost last (for focus trap)
				let depth = 0 // pushed history entries not yet consumed
				let suppress = 0 // popstate events to swallow (from our own history.back)
				const root = document.documentElement

				function opened(container) {
					if (!trapStack.length) root.classList.add('scroll-lock')
					trapStack.push(container || null)
					depth++
					history.pushState({ shopOverlay: depth }, '')
				}
				function closed(fromPop) {
					if (trapStack.length) trapStack.pop()
					if (!trapStack.length) root.classList.remove('scroll-lock')
					if (fromPop === true) {
						// popstate already decremented depth and moved history back.
						return
					}
					if (depth > 0) {
						depth--
						suppress++
						history.back()
					}
				}
				window.addEventListener('popstate', () => {
					if (suppress > 0) return void suppress--
					if (depth > 0) {
						depth--
						closeTopOverlay(true) // synchronous DOM close; won't touch history
					}
				})
				return {
					opened,
					closed,
					topTrap: () => trapStack[trapStack.length - 1] || null,
				}
			})()

			// Keep Tab focus inside the top overlay (light, standard focus trap).
			document.addEventListener('keydown', (e) => {
				if (e.key !== 'Tab') return
				const box = Overlay.topTrap()
				if (!box) return
				const nodes = [...box.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])')].filter(
					(n) => n.offsetWidth || n.offsetHeight || n === document.activeElement,
				)
				if (!nodes.length) return void e.preventDefault()
				const first = nodes[0]
				const last = nodes[nodes.length - 1]
				if (!box.contains(document.activeElement)) {
					e.preventDefault()
					first.focus()
				} else if (e.shiftKey && document.activeElement === first) {
					e.preventDefault()
					last.focus()
				} else if (!e.shiftKey && document.activeElement === last) {
					e.preventDefault()
					first.focus()
				}
			})

			function openDrawer() {
				rememberFocus()
				renderTree()
				$('drawerBg').classList.add('open')
				Overlay.opened($('drawer'))
				$('drawerClose').focus()
			}
			function closeDrawer(fromPop) {
				if (!$('drawerBg').classList.contains('open')) return
				$('drawerBg').classList.remove('open')
				restoreFocus()
				Overlay.closed(fromPop)
			}

			// Jump from a drawer leaf to its group: expand it, scroll it into view
			// (below the sticky header), and flash it.
			function navigateToGroup(gidx) {
				const g = LAST_GROUPS[gidx]
				closeDrawer()
				if (g && g.sortKey) collapseOverride.set(g.sortKey, false)
				render()
				requestAnimationFrame(() => {
					const grp = document.querySelector(`.group[data-gidx="${gidx}"]`)
					if (!grp) return
					const hH = (document.querySelector('header') || {}).offsetHeight || 0
					const top = grp.getBoundingClientRect().top + window.scrollY - hH - 8
					window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' })
					grp.classList.add('ghl')
					setTimeout(() => grp.classList.remove('ghl'), 1500)
				})
			}

			// ── Supplier map (in-person wayfinding) ──────────────────────────────
			let FLOOR_LAYOUT = null // [{ mall, floor, label, corridors:[…] }]
			let MAP_STALLS = new Set() // normalised stall codes that exist on any floor
			let mapFloorIdx = 0
			let mapLocateMode = false
			let mapLocateTarget = ''
			const mapOpen = () => $('mapBg').classList.contains('open')
			// Same normalisation the server uses, so route stalls match map stalls.
			const mapNorm = (s) =>
				String(s || '')
					.trim()
					.toUpperCase()
					.replace(/\s+/g, '')
					.replace(/[–—]/g, '-')
			const mapCodeAliases = (code) => {
				const normalized = mapNorm(code)
				if (!normalized) return []
				const out = new Set([normalized])
				const match = /^([A-Z]+)(\d{3,})-(\d{3,})$/.exec(normalized)
				if (match) {
					const start = Number(match[2])
					const end = Number(match[3])
					if (end >= start && end - start <= 20) {
						for (let value = start; value <= end; value++) out.add(`${match[1]}${value}`)
					}
				}
				return [...out]
			}
			const stallAliases = (stall) => (stall && stall.aliases && stall.aliases.length ? stall.aliases : mapCodeAliases(stall && (stall.code || stall.norm || stall)))
			const stallCodesOverlap = (a, b) => {
				const right = new Set(mapCodeAliases(b))
				return mapCodeAliases(a).some((code) => right.has(code))
			}
			// Localise a label that may be a plain string ('左a') or an {en,zh} pair.
			const lz = (v) => (typeof v === 'string' ? v : v ? (LANG === 'zh' ? v.zh : v.en) : '')

			async function loadFloorMap() {
				try {
					const r = await fetch('/api/route/floor-map', { credentials: 'same-origin' })
					if (!r.ok) return
					const d = await r.json()
					FLOOR_LAYOUT = (d.floors || []).filter((f) => f.corridors && f.corridors.length)
					// Index of every stall on the map, so the list only shows a "locate"
					// button for shops we can actually point to.
					MAP_STALLS = new Set()
					for (const f of FLOOR_LAYOUT) for (const c of f.corridors) for (const sd of c.sides) for (const blk of sd.blocks) for (const st of blk) {
						for (const alias of stallAliases(st)) MAP_STALLS.add(alias)
					}
					if (FLOOR_LAYOUT.length) {
						$('mapBtn').style.display = ''
						render() // re-render so locate buttons appear on already-shown groups
					}
				} catch {}
			}
			const mapHasStall = (stall) => MAP_STALLS.has(mapNorm(stall))

			// Per-stall (normalised) shopping status from the live route: how many
			// lines still to buy vs. total. Exchanges owed at a supplier count too.
			function stallStatusMap() {
				const m = new Map()
				const bump = (code, remaining) => {
					const c = mapNorm(code)
					if (!c) return
					let e = m.get(c)
					if (!e) {
						e = { total: 0, remaining: 0 }
						m.set(c, e)
					}
					e.total++
					if (remaining) e.remaining++
				}
				for (const r of ROWS) if (r.has_case || r.has_grip) bump(r.supplier_stall, !cgDone(r))
				for (const x of EXCHANGES) bump(x.supplier_stall, true)
				return m
			}

			// Index of the rendered cg group for a stall (for tap-to-jump), or -1.
			function groupIdxForStall(norm) {
				for (let i = 0; i < LAST_GROUPS.length; i++) {
					const g = LAST_GROUPS[i]
					if (g.section === 'cg' && stallCodesOverlap(g.stall, norm)) return i
				}
				return -1
			}

			function renderMap() {
				const body = $('mapFloor')
				if (!FLOOR_LAYOUT || !FLOOR_LAYOUT.length) {
					body.innerHTML = `<div class="state"><div class="state-title">${t('mapNone')}</div></div>`
					return
				}
				if (mapFloorIdx >= FLOOR_LAYOUT.length) mapFloorIdx = 0
				const floor = FLOOR_LAYOUT[mapFloorIdx]
				const stat = stallStatusMap()
				$('mapTitle').textContent = t('mapTitle')
				// Single floor → no switcher pill (saves header height); the floor is
				// shown in the subtitle instead.
				$('mapFloors').innerHTML =
					FLOOR_LAYOUT.length > 1
						? FLOOR_LAYOUT.map((f, i) => `<button class="map-floor ${i === mapFloorIdx ? 'on' : ''}" data-fi="${i}">${esc(lz(f.label))}</button>`).join('')
						: ''
				$('mapLegend').innerHTML =
					`<span class="lg"><span class="sw need"></span>${t('legTo')}</span>` +
					`<span class="lg"><span class="sw done"></span>${t('legDone')}</span>` +
					`<span class="lg"><span class="sw other"></span>${t('legOther')}</span>`

				let needStalls = 0
				const cell = (st) => {
					const aliases = stallAliases(st)
					const e = aliases.reduce(
						(total, alias) => {
							const value = stat.get(alias)
							if (value) {
								total.total += value.total
								total.remaining += value.remaining
							}
							return total
						},
						{ total: 0, remaining: 0 },
					)
					const hasStatus = !!(e && e.total > 0)
					const aliasAttr = aliases.map(esc).join(' ')
					// Faint only when it's neither named nor on today's route. Every cell
					// carries data-code so the "locate" action can target it.
					if (!st.named && !hasStatus) {
						return `<div class="mstall unnamed" data-code="${esc(st.norm)}" data-aliases="${aliasAttr}"><span class="mcode">${esc(st.code)}</span></div>`
					}
					let cls = 'other'
					let count = 0
					if (hasStatus) {
						if (e.remaining > 0) {
							cls = 'need'
							count = e.remaining
							needStalls++
						} else cls = 'done'
					}
					const tap = cls === 'need' || cls === 'done'
					const tag = tap ? 'button' : 'div'
					return `<${tag} class="mstall ${cls}" data-code="${esc(st.norm)}" data-aliases="${aliasAttr}"${tap ? ` data-stall="${esc(st.norm)}"` : ''}>
						<span class="mcode">${esc(st.code)}</span>
						${st.name ? `<span class="mname">${esc(st.name)}</span>` : ''}
						${count > 0 ? `<span class="mcount">${count}</span>` : ''}
					</${tag}>`
				}

				const elevatorHtml = (l) =>
					`<div class="map-elevator" title="${esc(lz(l.label))}"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><polyline points="9.5 9.5 12 7 14.5 9.5"/><polyline points="9.5 14.5 12 17 14.5 14.5"/></svg><span>${esc(lz(l.label))}</span></div>`
				let html = ''
				floor.corridors.forEach((c, ci) => {
					html += `<div class="corridor"><div class="corridor-title">${esc(lz(c.label))}</div><div class="aisle">`
					c.sides.forEach((sd, si) => {
						html += `<div class="side ${si === 0 ? 'a' : 'b'}"><div class="side-title">${esc(sd.label)}</div>`
						// Flip each side vertically: the last-recorded stall shows at the
						// TOP (e.g. 右b → A225-227 top, A248 bottom). Data stays in physical
						// walking order; only the display is reversed. slice() avoids
						// mutating the cached layout across re-renders.
						html += sd.blocks
							.slice()
							.reverse()
							.map((blk) => `<div class="mblock">${blk.slice().reverse().map(cell).join('')}</div>`)
							.join('')
						html += `</div>`
					})
					html += `</div></div>`
					// Central walkway between the two corridors — holds the elevator at the
					// near (bottom) end, between A275 (左b) and A2-21 (右a).
					if (ci === 0 && floor.corridors.length > 1) {
						const landmarks = floor.landmarks || []
						const elev = landmarks.find((l) => l.type === 'elevator')
						html += `<div class="map-walkway">${elev ? elevatorHtml(elev) : ''}</div>`
					}
				})
				body.innerHTML = html
				const floorLbl = lz(floor.label)
				$('mapSub').textContent = needStalls
					? LANG === 'zh'
						? `${floorLbl} · 需前往 ${needStalls} 个摊位`
						: `${floorLbl} · ${needStalls} stall${needStalls > 1 ? 's' : ''} to visit`
					: LANG === 'zh'
						? `${floorLbl} · 本层无需采购`
						: `${floorLbl} · nothing to buy here`
			}
			// Keep the map fresh while it's open (status changes, teammate updates).
			function syncMap() {
				if (!mapOpen()) return
				renderMap()
				if (mapLocateMode && mapLocateTarget) {
					const cell = $('mapFloor').querySelector('.mstall[data-aliases~="' + CSS.escape(mapLocateTarget) + '"]')
					if (cell) focusCell(cell)
				}
			}

			function openMap() {
				if (!FLOOR_LAYOUT || !FLOOR_LAYOUT.length) return
				const wasOpen = mapOpen()
				rememberFocus()
				mapLocateMode = false
				mapLocateTarget = ''
				$('mapBody').classList.remove('locating')
				// Default to the floor with the most stalls still to visit.
				const stat = stallStatusMap()
				let best = 0
				let bestN = -1
				FLOOR_LAYOUT.forEach((f, i) => {
					let n = 0
					for (const c of f.corridors) for (const sd of c.sides) for (const blk of sd.blocks) for (const st of blk) {
						const e = stat.get(st.norm)
						if (e && e.remaining > 0) n++
					}
					if (n > bestN) {
						bestN = n
						best = i
					}
				})
				mapFloorIdx = best
				set3d(false) // open flat (readable); user can tap 3D to tilt
				renderMap()
				$('mapBg').classList.add('open')
				if (!wasOpen) Overlay.opened($('mapBg'))
				// Open framing the ENTIRE floor so no stall is hidden below the fold
				// (e.g. A201-202 at the far end). Detail is a pinch / double-tap away.
				requestAnimationFrame(() => requestAnimationFrame(fitMap))
				$('mapClose').focus()
			}
			function closeMap(fromPop) {
				if (!mapOpen()) return
				$('mapBg').classList.remove('open')
				$('mapBody').classList.remove('locating')
				mapLocateMode = false
				mapLocateTarget = ''
				restoreFocus()
				Overlay.closed(fromPop)
			}

			// Which floor index holds a given stall code (or -1).
			function floorIdxForStall(norm) {
				for (let i = 0; i < (FLOOR_LAYOUT || []).length; i++) {
					for (const c of FLOOR_LAYOUT[i].corridors) for (const sd of c.sides) for (const blk of sd.blocks) for (const st of blk) {
						if (stallAliases(st).includes(norm)) return i
					}
				}
				return -1
			}
			// Open the map focused on ONE stall: switch to its floor, zoom in, centre it
			// and pulse it. Triggered by a supplier group's "locate" button when the
			// shopper doesn't know where a shop is.
			function openMapAt(code) {
				if (!FLOOR_LAYOUT || !FLOOR_LAYOUT.length) return
				const wasOpen = mapOpen()
				const norm = mapNorm(code)
				mapLocateTarget = norm
				const fi = floorIdxForStall(norm)
				rememberFocus()
				mapLocateMode = true
				if (fi >= 0) mapFloorIdx = fi
				set3d(false)
				renderMap()
				$('mapBg').classList.add('open')
				if (!wasOpen) Overlay.opened($('mapBg'))
				$('mapClose').focus()
				requestAnimationFrame(() =>
					requestAnimationFrame(() => {
						const cell = fi >= 0 ? $('mapFloor').querySelector('.mstall[data-aliases~="' + CSS.escape(norm) + '"]') : null
						if (cell) focusCell(cell)
						else {
							fitMap()
							toast(LANG === 'zh' ? '该摊位不在地图上' : "That stall isn't on the map")
						}
					}),
				)
			}
			// Frame the WHOLE floor (so the shopper sees where the shop sits in the
			// overall layout) and make the target pulse so it's found at a glance.
			function focusCell(cell) {
				fitMap()
				$('mapBody').classList.add('locating')
				cell.dataset.located = LANG === 'zh' ? '这里' : 'HERE'
				cell.classList.add('locate')
			}

			// ── Map pan / zoom / 3-D (dependency-free, pointer-events) ───────────
			let mScale = 1
			let mTx = 0
			let mTy = 0
			let mTilt = false
			const M_MIN = 0.12
			const M_MAX = 4.5
			const mPointers = new Map()
			let mPinchDist = 0
			let mPinchMid = null
			let mPanLast = null
			let mMoved = false // gesture moved → suppress the tap-to-jump click
			let mDown = null

			function applyMapTransform() {
				$('mapScene').style.transform = `translate(${mTx.toFixed(2)}px, ${mTy.toFixed(2)}px) scale(${mScale.toFixed(4)})`
			}
			const clampScale = (s) => Math.max(M_MIN, Math.min(M_MAX, s))
			// Point in stage-local coordinates.
			function stagePt(clientX, clientY) {
				const r = $('mapBody').getBoundingClientRect()
				return { x: clientX - r.left, y: clientY - r.top }
			}
			// Zoom by `factor` while keeping stage point (sx,sy) fixed (zoom-to-cursor).
			function mapZoomAt(factor, sx, sy) {
				const ns = clampScale(mScale * factor)
				const ratio = ns / mScale
				mTx = sx - (sx - mTx) * ratio
				mTy = sy - (sy - mTy) * ratio
				mScale = ns
				applyMapTransform()
			}
			// Fit the whole floor into the stage, centered.
			function fitMap() {
				const stage = $('mapBody')
				const floor = $('mapFloor')
				const sw = stage.clientWidth
				const sh = stage.clientHeight
				const fw = floor.offsetWidth
				const fh = floor.offsetHeight
				if (!fw || !fh || !sw || !sh) return
				const pad = 8
				mScale = clampScale(Math.min((sw - pad * 2) / fw, (sh - pad * 2) / fh))
				mTx = (sw - fw * mScale) / 2
				mTy = Math.max(pad, (sh - fh * mScale) / 2)
				applyMapTransform()
			}
			function set3d(on) {
				mTilt = on
				$('mapScene').classList.toggle('tilt', on)
				$('map3dBtn').classList.toggle('on', on)
			}
			const mapCenter = () => {
				const r = $('mapBody').getBoundingClientRect()
				return { x: r.width / 2, y: r.height / 2 }
			}

			// ── In-place DOM updates ─────────────────────────────────────────────
			// Status changes patch the affected card(s) directly instead of rebuilding
			// the whole list. This removes the flash/refresh AND stops every image
			// from reloading on each tap.
			function findCgCard(r) {
				// Direct attribute lookup (O(1)-ish) instead of scanning every card;
				// CSS.escape guards item_keys containing quotes / special characters.
				const direct = document.querySelector('.card[data-rid="' + CSS.escape(String(r.receipt_id)) + '"][data-ik="' + CSS.escape(r.item_key) + '"]')
				if (direct) return direct
				for (const el of document.querySelectorAll('.model-group[data-agg]')) {
					const rows = AGG.get(el.dataset.agg)
					if (rows && rows.includes(r)) return el
				}
				return null
			}
			// Locate the merged-charm card covering a row via the live AGG map.
			function findCharmCard(r) {
				for (const btn of document.querySelectorAll('.comp[data-agg][data-c="charm"]')) {
					const rows = AGG.get(btn.dataset.agg)
					if (rows && rows.includes(r)) return { el: btn.closest('.card'), rows }
				}
				return null
			}
			function updateCgCardEl(el, r) {
				const rows = el.dataset.agg ? AGG.get(el.dataset.agg) || [r] : [r]
				const done = rows.every(cgDone)
				el.classList.toggle('done', done)
				// Patch ONLY the affected component button(s) in place. Rebuilding the
				// whole .comps innerHTML tore down / recreated both buttons every tap,
				// which caused the visible twitch — so we surgically update instead.
				for (const c of CASE_GRIP) {
					if (!rows.some((row) => row[c.flag])) continue
					const cb = el.querySelector('.comp[data-c="' + c.key + '"]')
					if (!cb) continue
					const relevant = rows.filter((row) => row[c.flag])
					const st = aggregateComponentStatus(rows, c)
					const m = STATUS_META[st] || STATUS_META.Pending
					cb.className = 'comp type-' + c.key + ' ' + m.cls
					const qty = relevant.reduce((n, row) => n + (row.quantity || 1), 0)
					const cl = cb.querySelector('.cl')
					if (cl) cl.textContent = compLabel(c) + (qty > 1 ? ` ×${qty}` : '')
					const cs = cb.querySelector('.cs')
					if (cs) cs.innerHTML = aggStatusHtml(st, relevant, c.status)
				}
				const btn = el.querySelector('.markall')
				if (btn) {
					btn.classList.toggle('done', done)
					btn.textContent = done ? t('bought') : t('markBought')
				}
				updateProductSummary(el.closest('.product'))
			}

			function updateProductSummary(productEl) {
				if (!productEl) return
				const rows = []
				for (const el of productEl.querySelectorAll('.model-group[data-agg]')) {
					for (const row of AGG.get(el.dataset.agg) || []) rows.push(row)
				}
				const values = {
					case: rows.filter((r) => r.has_case && (r.status_case || 'Pending') !== 'Purchased').reduce((n, r) => n + (r.quantity || 1), 0),
					grip: rows.filter((r) => r.has_grip && (r.status_grip || 'Pending') !== 'Purchased').reduce((n, r) => n + (r.quantity || 1), 0),
				}
				for (const [key, qty] of Object.entries(values)) {
					const el = productEl.querySelector('.component-total.' + key)
					if (!el) continue
					const comp = key === 'case' ? COMP_CASE : COMP_GRIP
					el.textContent = `${compLabel(comp)} ×${qty}`
					el.hidden = qty === 0
				}
			}
			function updateCharmCardEl(el, rows) {
				const done = rows.every(charmDone)
				const status = aggStatus(rows)
				const m = STATUS_META[status] || STATUS_META.Pending
				el.classList.toggle('done', done)
				const comp = el.querySelector('.comp')
				if (comp) {
					comp.className = 'comp type-charm ' + m.cls
					const cs = comp.querySelector('.cs')
					if (cs) cs.innerHTML = aggStatusHtml(status, rows, 'status_charm')
				}
				const btn = el.querySelector('.markall')
				if (btn) {
					btn.className = 'markall' + (done ? ' done' : '')
					btn.textContent = done ? t('bought') : t('markBought')
				}
			}
			// Remove a card; drop its product wrapper / group / section when empty.
			function removeCardEl(el) {
				const productEl = el.closest('.product')
				const groupEl = el.closest('.group')
				const sectionEl = el.closest('.section')
				el.remove()
				if (productEl && !productEl.querySelector('.card')) productEl.remove()
				else updateProductSummary(productEl)
				if (groupEl && !groupEl.querySelector('.card')) groupEl.remove()
				if (sectionEl && !sectionEl.querySelector('.card')) sectionEl.remove()
			}
			// Recompute every count badge (group, section, summary, drawer) + collapse
			// finished stalls — all without rebuilding the list.
			function refreshBadges() {
				renderSummary()
				let cgRem = 0
				let chRem = 0
				document.querySelectorAll('.group[data-gidx]').forEach((groupEl) => {
					const g = LAST_GROUPS[+groupEl.dataset.gidx]
					if (!g) return
					const rem = groupRemaining(g)
					if (g.section === 'charm') chRem += rem
					else cgRem += rem
					const gc = groupEl.querySelector('.ghead .gcount')
					if (gc) {
						gc.className = 'gcount' + (rem === 0 ? ' done' : '')
						gc.textContent = rem === 0 ? '✓' : rem
					}
					if (rem === 0 && !collapseOverride.has(g.sortKey) && !groupEl.classList.contains('collapsed')) {
						groupEl.classList.add('collapsed')
						const gb = groupEl.querySelector('.gbody')
						if (gb) gb.remove()
					}
				})
				const setSec = (sel, rem) => {
					const b = document.querySelector(sel + ' .section-head .section-count')
					if (b) {
						b.className = 'section-count' + (rem === 0 ? ' sdone' : '')
						b.textContent = rem === 0 ? '✓' : rem
					}
				}
				setSec('.section.cg', cgRem)
				setSec('.section.charm', chRem)
				if (!$('list').querySelector('.card')) {
					LAST_GROUPS = []
					$('list').innerHTML = `<div class="state"><div class="state-title">${searchQ ? t('noMatches') : t('allBought')}</div></div>`
				}
				if (drawerOpen()) renderTree()
				syncMap()
			}
			// Patch the UI in place for one status change across one/many lines.
			function patchUi(rowsArr, touchesCharm) {
				for (const r of rowsArr) {
					if (touchesCharm) {
						const found = findCharmCard(r)
						if (found) {
							if (!showDone && found.rows.every(charmDone)) removeCardEl(found.el)
							else updateCharmCardEl(found.el, found.rows)
						}
					} else {
						const el = findCgCard(r)
						if (el) {
							const rows = el.dataset.agg ? AGG.get(el.dataset.agg) || [r] : [r]
							if (!showDone && rows.every(cgDone)) removeCardEl(el)
							else updateCgCardEl(el, r)
						}
					}
				}
				refreshBadges()
			}
			// Patch a row wherever it appears (a line can be in both the Case/Grip and
			// Charm sections). Used for real-time updates from other devices.
			function patchRowEverywhere(r) {
				const cg = findCgCard(r)
				if (cg) {
					const rows = cg.dataset.agg ? AGG.get(cg.dataset.agg) || [r] : [r]
					if (!showDone && rows.every(cgDone)) removeCardEl(cg)
					else updateCgCardEl(cg, r)
				}
				const ch = findCharmCard(r)
				if (ch) {
					if (!showDone && ch.rows.every(charmDone)) removeCardEl(ch.el)
					else updateCharmCardEl(ch.el, ch.rows)
				}
				refreshBadges()
			}

			// ── Status changes (optimistic + retry queue) ────────────────────────
			function applyLocal(r, patch) {
				Object.assign(r, patch)
			}

			// Queue the change for the server (optimistic; retried on failure).
			function enqueueNetwork(r, patch) {
				const k = keyOf(r)
				const op = pending.get(k) || { receipt_id: r.receipt_id, item_key: r.item_key, title: r.title }
				Object.assign(op, patch)
				pending.set(k, op)
				setConn(sse && sse.readyState === 1 ? 'live' : 'off')
				flush()
			}

			// Apply one status change to one OR MANY lines (a merged charm hits every
			// order line it covers), persist each, re-render, and — if this completes
			// a whole stall — celebrate + jump to the next stall still needing shopping.
			// Applies a status patch optimistically and returns
			//   { action, completedKey }
			// so the caller can offer an undo (with countdown) and, if a stall just
			// finished, celebrate + advance. `action` is null for undo replays.
			function commitRows(rowsArr, patch, opts = {}) {
				if (!rowsArr || !rowsArr.length) return { action: null, completedKey: null }
				// Record the pre-change values so this can be undone (skip when this
				// call IS an undo).
				let action = null
				if (!opts.isUndo) {
					const changes = rowsArr.map((r) => {
						const prev = {}
						for (const k in patch) prev[k] = r[k]
						return { receipt_id: r.receipt_id, item_key: r.item_key, prev }
					})
					action = pushUndo({ type: 'assign', changes })
				}
				const touchesCG = 'status_case' in patch || 'status_grip' in patch
				const touchesCharm = 'status_charm' in patch
				const cgKeys = new Set(rowsArr.map(cgGroupKey))
				const chKeys = new Set(rowsArr.map(charmGroupKey))
				const wasCg = new Map([...cgKeys].map((k) => [k, cgGroupDone(k)]))
				const wasCh = new Map([...chKeys].map((k) => [k, charmGroupDone(k)]))
				for (const r of rowsArr) {
					applyLocal(r, patch)
					enqueueNetwork(r, patch)
				}
				patchUi(rowsArr, touchesCharm)
				let completedKey = null
				if (touchesCharm) {
					for (const k of chKeys) if (!wasCh.get(k) && charmGroupDone(k)) { completedKey = k; break }
				} else if (touchesCG) {
					for (const k of cgKeys) if (!wasCg.get(k) && cgGroupDone(k)) { completedKey = k; break }
				}
				return { action, completedKey }
			}

			// Undo window (ms) for the countdown snackbar. Long enough to catch an
			// accidental tap, short enough to stay out of the way — Gmail uses ~5–10s.
			const UNDO_MS = 6000
			// After a status commit: show the undo snackbar, and if a stall just
			// finished, use a celebratory message + scroll to the next one.
			function afterCommit(res, msg, opts = {}) {
				if (!res || !res.action) return
				if (res.completedKey && !opts.noAdvance) {
					haptic([14, 40, 22]) // stall finished — a distinct success buzz
					showUndoBar(t('stallDone'), res.action)
					setTimeout(() => scrollToNextIncomplete(res.completedKey), 350)
				} else {
					haptic(10) // a single confirming tap
					showUndoBar(msg, res.action)
				}
			}

			async function flush() {
				if (flushing || !pending.size) return
				flushing = true
				for (const [k, op] of [...pending]) {
					try {
						const resp = await fetch('/api/shop/assign', {
							method: 'POST',
							headers: { 'Content-Type': 'application/json' },
							credentials: 'same-origin',
							body: JSON.stringify(op),
						})
						if (resp.status === 401) {
							location.href = '/login'
							return
						}
						if (!resp.ok) throw new Error('HTTP ' + resp.status)
						pending.delete(k)
					} catch (e) {
						// keep in queue; retry shortly
					}
				}
				flushing = false
				if (pending.size) {
					setConn('off')
					setTimeout(flush, 3000)
				} else {
					setConn(sse && sse.readyState === 1 ? 'live' : 'off')
				}
			}

			// Set one component's status across one or many lines (skips no-ops).
			// `opts.noAdvance` keeps the view put (used for per-order edits made while
			// the status sheet is open, so it doesn't scroll away underneath).
			function setStatusRows(rowsArr, compKey, status, opts = {}) {
				const field = 'status_' + compKey
				const changed = rowsArr.filter((r) => (r[field] || 'Pending') !== status)
				if (!changed.length) return
				const comp = COMPONENTS.find((c) => c.key === compKey)
				const res = commitRows(changed, { [field]: status })
				afterCommit(res, `${compLabel(comp)} · ${stLabel(status)}`, opts)
			}

			// Mark a section's components bought across one or many lines.
			function markSection(rowsArr, sec) {
				const comps = sec === 'charm' ? CHARM : CASE_GRIP
				const patch = {}
				for (const c of comps) {
					if (rowsArr.some((r) => r[c.flag] && (r[c.status] || 'Pending') !== 'Purchased')) patch[c.status] = 'Purchased'
				}
				if (!Object.keys(patch).length) return
				const res = commitRows(rowsArr, patch)
				afterCommit(res, t('markedBought'))
			}

			// ── Undo (via the bottom countdown snackbar) ─────────────────────────
			// Each committed action carries everything needed to revert it. The undo
			// affordance is the countdown snackbar only (no persistent header button);
			// once the countdown lapses the action stands.
			function pushUndo(action) {
				return action
			}
			// Show the countdown undo snackbar for a specific just-performed action.
			function showUndoBar(msg, action) {
				if (!action) return toast(msg)
				toast(msg, t('undo'), () => undoAction(action), UNDO_MS)
			}
			// Revert one specific action.
			function undoAction(action) {
				if (!action) return
				haptic(10)
				if (action.type === 'assign') {
					for (const c of action.changes) {
						const row = rowIndex.get(c.receipt_id + '\x00' + c.item_key)
						if (row) {
							applyLocal(row, c.prev)
							enqueueNetwork(row, c.prev)
						}
					}
					render()
					toast(t('undone'))
				} else if (action.type === 'exchange') {
					const x = action.exchange
					if (!EXCHANGES.some((e) => e.exchange_id === x.exchange_id)) EXCHANGES.push(x)
					render()
					toast(t('undone'))
					fetch('/api/exchanges/' + encodeURIComponent(x.exchange_id) + '/reopen', { method: 'POST', credentials: 'same-origin' }).catch(() => {})
				}
			}

			function scrollToNextIncomplete(fromKey) {
				const idx = LAST_GROUPS.findIndex((g) => g.sortKey === fromKey)
				const start = idx >= 0 ? idx + 1 : 0
				for (let i = start; i < LAST_GROUPS.length; i++) {
					const g = LAST_GROUPS[i]
					if (groupRemaining(g) > 0) {
						const el = document.querySelector(`.group[data-gidx="${i}"] .ghead`)
						if (el) {
							const headerH = (document.querySelector('header') || {}).offsetHeight || 0
							const top = el.getBoundingClientRect().top + window.scrollY - headerH - 6
							window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' })
						}
						return
					}
				}
				// Nothing left to shop — stay exactly where the shopper is. (Jumping
				// back to the top here was disorienting and annoying.)
			}

			// ── Bottom-sheet status picker ───────────────────────────────────────
			// Two shapes:
			//   • Single order  → a plain status list (tap = set that line).
			//   • Many orders of one model → a "set all" list PLUS a per-order
			//     section, so one unit can be Bought while another is Out of Stock
			//     / Wrong Stall / etc. Each order maps 1:1 to a real line item.
			let sheetTarget = null // { rows, compKey, field }
			function optHtml(s, sel, extraAttr, mini) {
				const m = STATUS_META[s]
				return `<button class="opt${mini ? ' mini' : ''}${sel ? ' sel' : ''}" data-s="${esc(s)}"${extraAttr || ''}>
					<span class="swatch" style="background:${m.color}"></span>
					<span>${stLabel(s)}</span>
				</button>`
			}
			function renderSheet() {
				if (!sheetTarget) return
				const { rows, compKey, field } = sheetTarget
				const comp = COMPONENTS.find((c) => c.key === compKey)
				const r0 = rows[0]
				const totalQty = rows.reduce((n, r) => n + (r.quantity || 1), 0)
				let subtitle
				if (compKey === 'charm') {
					subtitle = `${esc(r0.charm_code || 'charm')}${totalQty > 1 ? ` ×${totalQty}` : ''}`
				} else {
					subtitle = esc(r0.phone_model || 'item') + (totalQty > 1 ? ` ×${totalQty}` : '')
				}
				$('sheetTitle').innerHTML = `${compLabel(comp)} · <b>${subtitle}</b>`
				if (rows.length <= 1) {
					const cur = r0[field] || 'Pending'
					$('sheetOpts').innerHTML = STATUS_ORDER.map((s) => optHtml(s, s === cur, '')).join('')
					return
				}
				// Multi-order: set-all list, then a row per constituent order.
				const allSame = rows.every((r) => (r[field] || 'Pending') === (r0[field] || 'Pending'))
				const cur = allSame ? r0[field] || 'Pending' : null
				let h = `<div class="sheet-lab">${t('setAll')}</div>`
				h += `<div class="opt-grid">${STATUS_ORDER.map((s) => optHtml(s, s === cur, '', true)).join('')}</div>`
				h += `<div class="sheet-lab">${t('perOrder')}</div>`
				rows.forEach((r, i) => {
					const st = r[field] || 'Pending'
					const q = (r.quantity || 1) > 1 ? `<span class="oq">×${r.quantity}</span>` : ''
					h += `<div class="order-row">
						<div class="order-lab">${t('order')} ${i + 1}${q}</div>
						<div class="opt-grid">${STATUS_ORDER.map((s) => optHtml(s, s === st, ` data-oi="${i}"`, true)).join('')}</div>
					</div>`
				})
				$('sheetOpts').innerHTML = h
			}
			function openSheet(rowsArr, compKey) {
				rememberFocus()
				const field = 'status_' + compKey
				// Only orders that actually carry this component are addressable.
				const relevant = rowsArr.filter((r) => r['has_' + compKey])
				sheetTarget = { rows: relevant.length ? relevant : rowsArr, compKey, field }
				renderSheet()
				$('sheetBg').classList.add('open')
				Overlay.opened($('sheet'))
				const first = $('sheetOpts').querySelector('.opt')
				if (first) first.focus()
			}
			function closeSheet(fromPop) {
				if (!$('sheetBg').classList.contains('open')) return
				$('sheetBg').classList.remove('open')
				sheetTarget = null
				restoreFocus()
				Overlay.closed(fromPop)
			}

			// ── Price editor ─────────────────────────────────────────────────────
			let priceTarget = null // { kind, key, part }
			const costField = (part) => (part === 'grip' ? 'cost_grip' : 'cost_case')
			// Apply a saved cost to every matching line in memory. A product-component
			// cost is shared by all orders of that title; a charm cost by all lines of
			// that code.
			function applyCostLocally(kind, key, cost, part) {
				if (kind === 'product') {
					const tn = normTitle(key)
					const f = costField(part)
					ROWS.forEach((r) => {
						if (normTitle(r.title) === tn) r[f] = cost
					})
				} else {
					const cd = String(key || '').trim()
					ROWS.forEach((r) => {
						if (String(r.charm_code || '').trim() === cd) r.charm_cost = cost
					})
					// Charm subtotals read from the (cached) aggregate objects, so keep
					// them in sync too — otherwise the stall total lags behind the chip.
					LAST_GROUPS.forEach((g) => (g.aggs || []).forEach((a) => {
						if (String(a.charm_code || '').trim() === cd) a.charm_cost = cost
					}))
				}
			}
			// Recompute + patch ONE group's subtotal chip in place (insert / update /
			// remove as the total crosses zero).
			function updateGroupSubtotal(groupEl, g) {
				const head = groupEl.querySelector('.ghead')
				if (!head) return
				const st = groupSubtotal(g)
				let el = head.querySelector('.gtotal')
				if (st.sum <= 0) {
					if (el) el.remove()
					return
				}
				const text = money(st.sum) + (st.anyUnpriced ? '+' : '')
				if (el) {
					el.textContent = text
					return
				}
				el = document.createElement('span')
				el.className = 'gtotal'
				el.textContent = text
				head.insertBefore(el, head.querySelector('.gcount'))
			}
			// Patch every price chip a cost change touches — plus the affected stall
			// subtotals — WITHOUT rebuilding the list (no flash, keeps scroll + any
			// open interaction). Costs are shared by normalised title / charm code, so
			// we match the whole equivalence class, not one exact chip.
			function patchPricesLocally(kind, key, cost, part) {
				const cleared = cost == null || cost === ''
				const setChip = (chip) => {
					const qty = Number(chip.dataset.qty) || 1
					const wrap = chip.querySelector('.pvwrap')
					if (!wrap) return
					if (cleared) {
						chip.classList.add('unset')
						wrap.innerHTML = `<span class="pv">${t('setPrice')}</span>`
					} else {
						chip.classList.remove('unset')
						const per = qty > 1 ? `<span class="price-per">${money(cost)}×${qty}</span>` : ''
						wrap.innerHTML = `<span class="pv">${money(Number(cost) * qty)}</span>${per}`
					}
				}
				if (kind === 'product') {
					const tn = normTitle(key)
					const p = part === 'grip' ? 'grip' : 'case'
					document.querySelectorAll('.price[data-kind="product"][data-part="' + p + '"]').forEach((chip) => {
						if (normTitle(chip.dataset.title || '') === tn) setChip(chip)
					})
				} else {
					const cd = String(key || '').trim()
					document.querySelectorAll('.price[data-kind="charm"]').forEach((chip) => {
						if (String(chip.dataset.code || '').trim() === cd) setChip(chip)
					})
				}
				document.querySelectorAll('.group[data-gidx]').forEach((groupEl) => {
					const g = LAST_GROUPS[Number(groupEl.dataset.gidx)]
					if (g) updateGroupSubtotal(groupEl, g)
				})
			}
			function openPriceSheet(ds) {
				const kind = ds.kind
				if (kind !== 'product' && kind !== 'charm') return
				rememberFocus()
				const part = ds.part === 'grip' ? 'grip' : 'case'
				const key = kind === 'product' ? ds.title : ds.code
				if (!key) return
				priceTarget = { kind, key, part }
				let unit = null
				if (kind === 'product') {
					const f = costField(part)
					const r0 = ROWS.find((x) => normTitle(x.title) === normTitle(key))
					unit = r0 ? r0[f] : null
					const comp = part === 'grip' ? COMP_GRIP : COMP_CASE
					const sub = r0 ? esc([r0.phone_model, r0.style].filter(Boolean).join(' · ')) : esc(key)
					$('priceTitle').innerHTML = `${t('priceFor')} · ${compLabel(comp)} · <b>${sub}</b>`
				} else {
					const r0 = ROWS.find((x) => String(x.charm_code || '').trim() === key && x.charm_cost != null)
					unit = r0 ? r0.charm_cost : null
					$('priceTitle').innerHTML = `${t('priceFor')} · ${compLabel(COMP_CHARM)} · <b>${esc(key)}</b>`
				}
				$('priceCur').textContent = CUR
				$('priceClear').textContent = t('clear')
				$('priceSave').textContent = t('save')
				const inp = $('priceInput')
				inp.value = unit != null ? unit : ''
				$('priceBg').classList.add('open')
				Overlay.opened($('priceSheet'))
				setTimeout(() => {
					inp.focus()
					inp.select()
				}, 60)
			}
			function closePriceSheet(fromPop) {
				if (!$('priceBg').classList.contains('open')) return
				$('priceBg').classList.remove('open')
				priceTarget = null
				restoreFocus()
				Overlay.closed(fromPop)
			}
			async function savePrice(clear) {
				if (!priceTarget) return
				const { kind, key, part } = priceTarget
				let cost = null
				if (!clear) {
					const raw = $('priceInput').value.trim()
					if (raw === '') {
						cost = null
					} else {
						const n = Number(raw)
						if (!isFinite(n) || n < 0) {
							toast(t('priceInvalid'))
							return
						}
						cost = Math.round(n * 100) / 100
					}
				}
				// Optimistic: reflect immediately (surgical — no list rebuild), then persist.
				applyCostLocally(kind, key, cost, part)
				patchPricesLocally(kind, key, cost, part)
				closePriceSheet()
				try {
					const body = kind === 'product' ? { kind, title: key, part, cost } : { kind, code: key, cost }
					const resp = await fetch('/api/shop/cost', {
						method: 'POST',
						headers: { 'Content-Type': 'application/json' },
						credentials: 'same-origin',
						body: JSON.stringify(body),
					})
					if (resp.status === 401) return (location.href = '/login')
					if (!resp.ok) throw new Error('HTTP ' + resp.status)
					toast(t('priceSaved'))
				} catch (e) {
					toast(t('priceSaveFail'))
				}
			}

			// ── Full-screen image zoom ───────────────────────────────────────────
			function openZoom(src) {
				// Product thumbnails are served at 300px; load a sharper variant for the
				// zoom. Charm photos are already full-res from our endpoint.
				rememberFocus()
				$('zoomImg').src = src.replace('il_300x300.', 'il_570xN.')
				$('zoomBg').classList.add('open')
				Overlay.opened($('zoomBg'))
			}
			function closeZoom(fromPop) {
				if (!$('zoomBg').classList.contains('open')) return
				$('zoomBg').classList.remove('open')
				$('zoomImg').removeAttribute('src')
				restoreFocus()
				Overlay.closed(fromPop)
			}

			// ── Event delegation ─────────────────────────────────────────────────
			const rowFromEl = (el) => rowIndex.get(el.dataset.rid + '\x00' + el.dataset.ik)
			// Resolve the target line(s) for a button: a merged charm (data-agg) maps
			// to every line it covers; a normal button maps to its single line.
			const rowsFromEl = (el) => {
				if (el.dataset.agg) return AGG.get(el.dataset.agg) || []
				const r = rowFromEl(el)
				return r ? [r] : []
			}
			$('list').addEventListener('click', (e) => {
				// Tap a photo → open it full-screen so the design is easy to read.
				const thumb = e.target.closest('img.thumb')
				if (thumb && thumb.getAttribute('src')) {
					openZoom(thumb.getAttribute('src'))
					return
				}
				const priceEl = e.target.closest('.price')
				if (priceEl) {
					openPriceSheet(priceEl.dataset)
					return
				}
				const comp = e.target.closest('.comp')
				if (comp) {
					const meta = COMPONENTS.find((c) => c.key === comp.dataset.c)
					const rows = rowsFromEl(comp).filter((r) => !meta || r[meta.flag])
					if (rows.length) openSheet(rows, comp.dataset.c)
					return
				}
				const all = e.target.closest('.markall')
				if (all) {
					if (all.dataset.exid) {
						markExchanged(Number(all.dataset.exid))
						return
					}
					const rows = rowsFromEl(all)
					if (rows.length) markSection(rows, all.dataset.sec)
					return
				}
				// "Locate on map" pin → open the map focused on this stall (must run
				// before the header collapse handler below).
				const loc = e.target.closest('.glocate')
				if (loc) {
					openMapAt(loc.dataset.stall)
					return
				}
				// Tap a stall header to collapse / expand it.
				const head = e.target.closest('.ghead')
				if (head) {
					const wrap = head.closest('.group')
					const g = wrap && LAST_GROUPS[Number(wrap.dataset.gidx)]
					if (g) {
						collapseOverride.set(g.sortKey, !isCollapsed(g))
						render()
					}
				}
			})
			$('sheetBg').addEventListener('click', (e) => {
				if (e.target === $('sheetBg')) return closeSheet()
				const opt = e.target.closest('.opt')
				if (!opt || !sheetTarget) return
				const s = opt.dataset.s
				if (opt.dataset.oi != null) {
					// Per-order: apply to just that line, keep the sheet open so the
					// shopper can set the sibling order(s), and refresh the highlights.
					const row = sheetTarget.rows[Number(opt.dataset.oi)]
					if (row) setStatusRows([row], sheetTarget.compKey, s, { noAdvance: true })
					renderSheet()
				} else {
					// Set-all: one decision for every order of this model, then close.
					setStatusRows(sheetTarget.rows, sheetTarget.compKey, s)
					closeSheet()
				}
			})
			$('priceBg').addEventListener('click', (e) => {
				if (e.target === $('priceBg')) closePriceSheet()
			})
			$('priceSave').addEventListener('click', () => savePrice(false))
			$('priceClear').addEventListener('click', () => savePrice(true))
			$('priceInput').addEventListener('keydown', (e) => {
				if (e.key === 'Enter') savePrice(false)
			})

			$('zoomBg').addEventListener('click', () => closeZoom())

			document.addEventListener('keydown', (e) => {
				if (e.key === 'Escape') closeTopOverlay(false)
			})

			// ── Navigation drawer wiring ─────────────────────────────────────────
			$('menuBtn').addEventListener('click', openDrawer)
			$('drawerClose').addEventListener('click', () => closeDrawer())
			$('drawerBg').addEventListener('click', (e) => {
				if (e.target === $('drawerBg')) closeDrawer()
			})
			$('treeRoot').addEventListener('click', (e) => {
				const leaf = e.target.closest('.trow.leaf')
				if (leaf) {
					navigateToGroup(Number(leaf.dataset.gidx))
					return
				}
				const tog = e.target.closest('.trow[data-toggle]')
				if (tog) {
					const id = tog.dataset.toggle
					if (treeCollapsed.has(id)) treeCollapsed.delete(id)
					else treeCollapsed.add(id)
					renderTree()
				}
			})

			// ── Supplier map wiring ──────────────────────────────────────────────
			$('mapBtn').addEventListener('click', openMap)
			$('mapClose').addEventListener('click', () => closeMap())
			$('mapFloors').addEventListener('click', (e) => {
				const b = e.target.closest('.map-floor[data-fi]')
				if (!b) return
				mapFloorIdx = Number(b.dataset.fi)
				renderMap()
				requestAnimationFrame(fitMap)
			})
			// Tap a highlighted stall → jump to its group (ignored if the gesture was
			// a pan/pinch, not a tap).
			$('mapBody').addEventListener('click', (e) => {
				if (mMoved) return
				const cell = e.target.closest('.mstall[data-stall]')
				if (cell) {
					const gidx = groupIdxForStall(cell.dataset.stall)
					closeMap()
					if (gidx >= 0) navigateToGroup(gidx)
					return
				}
				// A supplier-pin lookup is a quick locate-and-dismiss flow: tapping
				// any empty part of the map closes it. Drag/pinch and controls remain
				// unaffected.
				if (mapLocateMode && !e.target.closest('.map-ctrl')) closeMap()
			})
			$('mapBg').addEventListener('click', (e) => {
				if (!mapLocateMode) return
				if (e.target.closest('#mapClose, .map-ctrl, .map-floor, .mstall')) return
				if (!e.target.closest('#mapBody')) closeMap()
			})

			// Zoom / 3-D controls.
			$('mapZoomIn').addEventListener('click', () => {
				const c = mapCenter()
				mapZoomAt(1.3, c.x, c.y)
			})
			$('mapZoomOut').addEventListener('click', () => {
				const c = mapCenter()
				mapZoomAt(0.77, c.x, c.y)
			})
			$('mapFit').addEventListener('click', fitMap)
			$('map3dBtn').addEventListener('click', () => set3d(!mTilt))

			// Pan (1 pointer) + pinch-zoom (2 pointers).
			const stage = $('mapBody')
			stage.addEventListener('pointerdown', (e) => {
				if (e.target.closest('.map-ctrl')) return
				try {
					stage.setPointerCapture(e.pointerId)
				} catch {}
				mPointers.set(e.pointerId, { x: e.clientX, y: e.clientY })
				mMoved = false
				mDown = { x: e.clientX, y: e.clientY }
				if (mPointers.size === 1) {
					mPanLast = { x: e.clientX, y: e.clientY }
					stage.classList.add('grabbing')
				} else if (mPointers.size === 2) {
					const [a, b] = [...mPointers.values()]
					mPinchDist = Math.hypot(a.x - b.x, a.y - b.y)
					mPinchMid = stagePt((a.x + b.x) / 2, (a.y + b.y) / 2)
				}
			})
			stage.addEventListener('pointermove', (e) => {
				if (!mPointers.has(e.pointerId)) return
				mPointers.set(e.pointerId, { x: e.clientX, y: e.clientY })
				if (mPointers.size >= 2) {
					const [a, b] = [...mPointers.values()]
					const dist = Math.hypot(a.x - b.x, a.y - b.y)
					const mid = stagePt((a.x + b.x) / 2, (a.y + b.y) / 2)
					if (mPinchDist > 0) {
						mapZoomAt(dist / mPinchDist, mid.x, mid.y)
						if (mPinchMid) {
							mTx += mid.x - mPinchMid.x
							mTy += mid.y - mPinchMid.y
							applyMapTransform()
						}
					}
					mPinchDist = dist
					mPinchMid = mid
					mMoved = true
					return
				}
				if (mPanLast) {
					if (mDown && Math.abs(e.clientX - mDown.x) + Math.abs(e.clientY - mDown.y) > 6) mMoved = true
					mTx += e.clientX - mPanLast.x
					mTy += e.clientY - mPanLast.y
					mPanLast = { x: e.clientX, y: e.clientY }
					applyMapTransform()
				}
			})
			const mapPointerUp = (e) => {
				mPointers.delete(e.pointerId)
				if (mPointers.size < 2) {
					mPinchDist = 0
					mPinchMid = null
				}
				if (mPointers.size === 1) {
					const p = [...mPointers.values()][0]
					mPanLast = { x: p.x, y: p.y }
				} else if (mPointers.size === 0) {
					mPanLast = null
					stage.classList.remove('grabbing')
				}
			}
			stage.addEventListener('pointerup', mapPointerUp)
			stage.addEventListener('pointercancel', mapPointerUp)
			// Wheel / trackpad zoom-to-cursor.
			stage.addEventListener(
				'wheel',
				(e) => {
					e.preventDefault()
					const p = stagePt(e.clientX, e.clientY)
					mapZoomAt(e.deltaY < 0 ? 1.12 : 0.89, p.x, p.y)
				},
				{ passive: false },
			)
			// Double-tap / double-click: zoom in, or fit if already zoomed in.
			stage.addEventListener('dblclick', (e) => {
				if (e.target.closest('.map-ctrl')) return
				const p = stagePt(e.clientX, e.clientY)
				if (mScale > 1.3) fitMap()
				else mapZoomAt(1.9, p.x, p.y)
			})
			// Re-fit on rotate / resize so the whole plan stays framed.
			window.addEventListener('resize', () => {
				if (mapOpen()) fitMap()
			})

			$('langBtn').addEventListener('click', () => {
				LANG = LANG === 'en' ? 'zh' : 'en'
				try {
					localStorage.setItem('shopLang', LANG)
				} catch {}
				applyStaticI18n()
				render()
			})
			$('dashBtn').addEventListener('click', () => (location.href = '/'))
			$('refreshBtn').addEventListener('click', () => load(true))
			$('logoutBtn').addEventListener('click', async () => {
				try {
					await fetch('/api/auth/logout', { method: 'POST', credentials: 'same-origin' })
				} catch {}
				location.href = '/login'
			})
			// ── Data loading ─────────────────────────────────────────────────────
			async function whoAmI() {
				try {
					const r = await fetch('/api/auth/me', { credentials: 'same-origin' })
					if (r.ok) {
						const d = await r.json()
						ME = d.user || null
						if (d.authEnabled && !d.role) location.href = '/login'
						// Show "back to dashboard" for the owner, and for a packer ONLY
						// when on the office LAN (so they can return to Packing Mode). Over
						// the public tunnel a packer stays shopping-only, so it's hidden.
						const onLan = /^(localhost|127\.|\[?::1\]?|192\.168\.|10\.|172\.(1[6-9]|2\d|3[01])\.|169\.254\.)/.test(location.hostname)
						if (d.role === 'owner' || (d.role === 'packer' && onLan)) $('dashBtn').style.display = ''
					}
				} catch {}
			}

			async function load(showSpinner) {
				if (showSpinner) $('list').innerHTML = `<div class="state"><div class="spinner"></div>${t('loading')}</div>`
				try {
					const r = await fetch('/api/shop/route', { credentials: 'same-origin' })
					if (r.status === 401) {
						location.href = '/login'
						return
					}
					if (r.status === 403) {
						$('list').innerHTML = `<div class="state"><div class="state-title">${t('cantOpen')}</div></div>`
						return
					}
					if (!r.ok) throw new Error('HTTP ' + r.status)
					const data = await r.json()
					ROWS = data.rows || []
					EXCHANGES = data.exchanges || []
					rowIndex.clear()
					for (const row of ROWS) rowIndex.set(keyOf(row), row)
					render()
					// A successful load means we CAN reach the server — that's the honest
					// "connected" signal (SSE is only for instant push on top of this).
					setConn('live')
				} catch (e) {
					setConn('off')
					// Only replace the list with an error screen if we have nothing to
					// show; a failed background poll must not wipe the current list.
					if (showSpinner || !ROWS.length) {
						$('list').innerHTML = `<div class="state"><div class="state-title">${t('couldntLoad')}</div><button class="chipbtn on" onclick="location.reload()" style="margin-top:14px">${t('retry')}</button></div>`
					}
				}
			}

			// ── Self-healing reconciliation ──────────────────────────────────────
			// SSE only PATCHES lines we already hold; it never adds newly-synced
			// orders and can't repair a stale set the client latched onto during a
			// transient server/sync window. So — like every serious real-time app —
			// we periodically re-pull the authoritative route and on app focus / SSE
			// (re)connect, reconciling silently. Comparing the fetched signature to the
			// CURRENT rows means an unchanged route (incl. our own already-saved edits)
			// costs one fetch and ZERO re-render (no flicker); we never reconcile
			// mid-edit (pending saves) or over an open overlay.
			function routeSig(rows, exchanges) {
				const parts = []
				for (const r of rows) {
					parts.push(
						r.receipt_id +
							':' +
							r.item_key +
							':' +
							(r.status_case || '') +
							(r.status_grip || '') +
							(r.status_charm || '') +
							':' +
							(r.charm_code || '') +
							':' +
							(r.cost_case ?? '') +
							'/' +
							(r.cost_grip ?? '') +
							'/' +
							(r.charm_cost ?? ''),
					)
				}
				parts.push('x:' + (exchanges || []).map((e) => e.exchange_id).join(','))
				return rows.length + '|' + parts.join('|')
			}
			function anyOverlayOpen() {
				return (
					$('sheetBg').classList.contains('open') ||
					$('priceBg').classList.contains('open') ||
					$('zoomBg').classList.contains('open') ||
					mapOpen() ||
					drawerOpen()
				)
			}
			async function reconcile() {
				// Safe-to-refresh guards: foreground only, no unsaved edits to clobber,
				// and never yank the list out from under an open sheet/map/drawer.
				if (document.hidden || pending.size || anyOverlayOpen()) return
				try {
					const r = await fetch('/api/shop/route', { credentials: 'same-origin' })
					if (r.status === 401) return (location.href = '/login')
					if (!r.ok) return
					const data = await r.json()
					const rows = data.rows || []
					const exchanges = data.exchanges || []
					setConn('live') // a successful pull proves we're connected
					// Re-check guards: an overlay/edit may have begun during the fetch.
					if (pending.size || anyOverlayOpen()) return
					// Already in sync (incl. our own saved edits)? Do nothing — no flicker.
					if (routeSig(rows, exchanges) === routeSig(ROWS, EXCHANGES)) return
					ROWS = rows
					EXCHANGES = exchanges
					rowIndex.clear()
					for (const row of ROWS) rowIndex.set(keyOf(row), row)
					render()
				} catch {}
			}

			// ── Real-time updates: SSE with a polling fallback ───────────────────
			// SSE gives instant push, but some networks/proxies (e.g. a Cloudflare
			// Tunnel or a carrier proxy) buffer or block event-streams. So we never
			// HARD-depend on it: if SSE doesn't open fast, or drops, we quietly poll
			// the route every few seconds so the team still stays in sync.
			let sse = null
			let sseOpen = false
			let sseRetry = 0
			let sseOpenTimer = null
			let sseRetryTimer = null
			let pollTimer = null
			let routeRefetchTimer = null

			// Debounced full re-sync, used when a pushed event means a line just entered
			// or left the route (design switched/reverted, issue flagged/resolved/…): the
			// list membership changed, so a per-line patch can't help — pull fresh. Routes
			// through reconcile() so it stays guard-aware (won't yank the UI mid-edit or
			// under an open sheet) and never flashes when nothing actually changed.
			function scheduleRouteRefetch() {
				clearTimeout(routeRefetchTimer)
				routeRefetchTimer = setTimeout(() => reconcile(), 400)
			}

			function startPolling() {
				if (pollTimer) return
				pollTimer = setInterval(() => {
					if (!sseOpen) reconcile()
				}, 12000)
			}
			function stopPolling() {
				if (pollTimer) {
					clearInterval(pollTimer)
					pollTimer = null
				}
			}
			function scheduleReconnect() {
				clearTimeout(sseRetryTimer)
				sseRetry = Math.min(sseRetry + 1, 6)
				sseRetryTimer = setTimeout(connectSSE, 1000 * sseRetry)
			}

			function connectSSE() {
				try {
					if (sse) sse.close()
				} catch {}
				try {
					sse = new EventSource('/api/shop/stream')
				} catch {
					startPolling()
					scheduleReconnect()
					return
				}
				clearTimeout(sseOpenTimer)
				// If the stream doesn't open within 6s it's almost certainly being
				// buffered/blocked upstream — fall back to polling and keep retrying.
				sseOpenTimer = setTimeout(() => {
					if (!sseOpen) {
						try {
							sse.close()
						} catch {}
						startPolling()
						scheduleReconnect()
					}
				}, 6000)
				sse.onopen = () => {
					sseOpen = true
					clearTimeout(sseOpenTimer)
					sseRetry = 0
					stopPolling()
					setConn(pending.size ? 'off' : 'live')
					// Catch up on anything that changed (new orders, other devices)
					// while the stream was down or before it opened.
					reconcile()
				}
				sse.onmessage = (ev) => {
					let msg
					try {
						msg = JSON.parse(ev.data)
					} catch {
						return
					}
					// A wrong-model swap changed elsewhere.
					if (msg.type === 'exchange') {
						if (msg.status === 'open') {
							// Reopened (someone undid a swap) — re-fetch so it reappears.
							load(false)
							return
						}
						const i = EXCHANGES.findIndex((x) => x.exchange_id === msg.exchange_id)
						if (i >= 0) {
							EXCHANGES.splice(i, 1)
							const el = document.querySelector('.card.ex[data-exid="' + msg.exchange_id + '"]')
							if (el) removeCardEl(el)
							refreshBadges()
							if (msg.by && msg.by !== ME) toast(LANG === 'zh' ? `${msg.by} 已换货一项` : `${msg.by} exchanged an item`)
						}
						return
					}
					// A price was set/changed elsewhere — update matching lines + subtotals.
				if (msg.type === 'cost') {
					const key = msg.kind === 'product' ? msg.title : msg.code
					if (key != null) {
						applyCostLocally(msg.kind, key, msg.cost, msg.part)
						patchPricesLocally(msg.kind, key, msg.cost, msg.part)
					}
					return
				}
					// A route-membership/content change we can't express as a per-line
					// patch (design switched/reverted, issue flagged/resolved/reopened/
					// deleted). A line may have just ENTERED or LEFT the route, so pull a
					// fresh list (debounced to coalesce bursts).
					if (msg.type === 'refresh') {
						scheduleRouteRefetch()
						return
					}
					if (msg.type !== 'assign') return
					const k = msg.receipt_id + '\x00' + msg.item_key
					// Don't clobber a change we're still trying to save.
					if (pending.has(k)) return
					const r = rowIndex.get(k)
					if (!r) {
						// A line we don't have yet — it just entered the route (e.g. a newly
						// switched or un-held order). Deliver on the "refresh soon" promise:
						// pull a fresh list so it appears, instead of silently dropping it.
						scheduleRouteRefetch()
						return
					}
					const before = fullyPurchased(r)
					r.status_case = msg.status_case
					r.status_grip = msg.status_grip
					r.status_charm = msg.status_charm
					if (msg.charm_code != null) r.charm_code = msg.charm_code
					if (msg.charm_shop != null) r.charm_shop = msg.charm_shop
					// In-place patch (no full re-render) so the list never flashes when a
					// teammate — or our own echoed change — comes in over the stream.
					patchRowEverywhere(r)
					if (msg.by && msg.by !== ME) {
						const after = fullyPurchased(r)
						if (after && !before) toast(LANG === 'zh' ? `${msg.by} 已购买一项` : `${msg.by} bought an item`)
						else toast(LANG === 'zh' ? `${msg.by} 更新了一项` : `${msg.by} updated an item`)
					}
				}
				sse.onerror = () => {
					sseOpen = false
					clearTimeout(sseOpenTimer)
					try {
						sse.close()
					} catch {}
					// Keep data fresh via polling while the stream is down; the next
					// successful load() reaffirms "live" (or marks "off" if unreachable).
					startPolling()
					scheduleReconnect()
				}
			}

			// Re-sync when the app returns to foreground (phone unlocked / tab back).
			document.addEventListener('visibilitychange', () => {
				if (document.visibilityState === 'visible') {
					if (!sse || sse.readyState === 2) connectSSE()
					load(false)
					flush()
				}
			})
			window.addEventListener('online', () => {
				flush()
				if (!sse || sse.readyState === 2) connectSSE()
			})
			window.addEventListener('offline', () => setConn('off'))

			// Escape closes the top-most open overlay (dialog / drawer / zoom).
			document.addEventListener('keydown', (e) => {
				if (e.key === 'Escape') closeTopOverlay()
			})

			// ── Boot ─────────────────────────────────────────────────────────────
			// Keep sticky stall headers pinned exactly below the app header, whose
			// height changes with language / wrapping / rotation. A ResizeObserver
			// tracks it live so the offset is always correct (no magic numbers).
			function syncStickTop() {
				const h = document.querySelector('header')
				if (h) document.documentElement.style.setProperty('--stick-top', h.offsetHeight + 'px')
			}

			async function boot() {
				applyStaticI18n()
				syncStickTop()
				if (window.ResizeObserver) new ResizeObserver(syncStickTop).observe(document.querySelector('header'))
				window.addEventListener('resize', syncStickTop)
				// Start real-time + identity checks in PARALLEL with loading the list,
				// instead of waiting for each round-trip in series — faster first paint.
				whoAmI()
				connectSSE()
				loadFloorMap()
				await load(true)
				if ('serviceWorker' in navigator) {
					navigator.serviceWorker.register('/shop-sw.js', { scope: '/shop' }).catch(() => {})
				}
				// Self-heal: periodically reconcile with the server even while SSE is
				// live (SSE never adds new orders), and whenever the app returns to the
				// foreground — so the counts can never silently drift from the truth.
				setInterval(reconcile, 45000)
				document.addEventListener('visibilitychange', () => {
					if (!document.hidden) reconcile()
				})
			}
			boot()
		</script>
	</body>
</html>
